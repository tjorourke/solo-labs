# lint-crd-blocks: allow preserveToken
# Backend used by the route policy to retrieve the tenant's public signing keys.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: entra-jwks
  namespace: agentgateway-system
spec:
  static:
    host: login.microsoftonline.com
    port: 443
  policies:
    tls: {}
---
# Validate the Entra user access token sent by the MCP client and preserve it for
# the downstream Elicitation flow. The audience is the gateway API app, not ADO.
# Replace the sample tenant ID and audience with values from your app registration.
# Entra > App registrations > gateway API app > Overview:
#   Directory (tenant) ID replaces 11111111-2222-3333-4444-555555555555 twice.
#   Application (client) ID replaces c1d4b01a-4c5d-4e9f-8abc-1234567890ab.
# The gateway API must request v2 access tokens; the audience is its client ID.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: azure-devops-mcp-entra-jwt
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: azure-devops-mcp
  traffic:
    jwtAuthentication:
      mode: Strict
      preserveToken: true
      providers:
        - issuer: https://login.microsoftonline.com/11111111-2222-3333-4444-555555555555/v2.0
          audiences:
            - c1d4b01a-4c5d-4e9f-8abc-1234567890ab
          jwks:
            remote:
              backendRef:
                group: agentgateway.dev
                kind: AgentgatewayBackend
                name: entra-jwks
                namespace: agentgateway-system
              jwksPath: /11111111-2222-3333-4444-555555555555/discovery/v2.0/keys
