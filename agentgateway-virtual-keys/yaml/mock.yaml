# Local deterministic fixture. No requests leave the cluster for an LLM provider.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-llm
  namespace: agentgateway-system
data:
  server.py: |
    import json
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"ok")

        def do_POST(self):
            request = json.loads(self.rfile.read(int(self.headers.get("Content-Length", 0))))
            response = {
                "id": "chatcmpl-virtual-key-demo",
                "object": "chat.completion",
                "created": 0,
                "model": request.get("model", "virtual-key-demo"),
                "choices": [{"index": 0, "message": {
                    "role": "assistant", "content": "Mock response: 120 reported tokens."
                }, "finish_reason": "stop"}],
                "usage": {"prompt_tokens": 100, "completion_tokens": 20, "total_tokens": 120}
            }
            body = json.dumps(response).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

    ThreadingHTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm
  namespace: agentgateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-llm
  template:
    metadata:
      labels:
        app: mock-llm
    spec:
      containers:
        - name: mock
          image: python:3.13.7-alpine
          command: [python, /app/server.py]
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: server
              mountPath: /app
              readOnly: true
      volumes:
        - name: server
          configMap:
            name: mock-llm
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm
  namespace: agentgateway-system
spec:
  selector:
    app: mock-llm
  ports:
    - port: 8000
      targetPort: 8000
