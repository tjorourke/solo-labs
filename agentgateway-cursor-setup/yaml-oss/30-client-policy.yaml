# One policy on the gateway, doing the two things an editor needs and one thing you want.
#
# 1. jwtAuthentication. Cursor sends the API key field verbatim as the bearer token, so that
#    field is where per-person identity comes from. Verify it here and the subject is on the
#    request for anything downstream that reads claims. `preserveToken` keeps the token on the
#    request, which matters when a second hop verifies it too.
#
# 2. The tool filter. Cursor attaches its tools to every agent request and some of them use
#    OpenAI's newer `"type": "custom"` shape, which the backends reject with a 503 saying
#    `missing field custom`. Keeping the classic function tools and dropping the rest leaves
#    tool calling working.
#
# 3. The question. An editor does not send the question on its own. It sends the open files,
#    its own instructions, then the question wrapped in <user_query> tags, all inside one user
#    message. Anything classifying "the prompt" therefore reads the envelope. Appending the
#    question as its own final message fixes that without taking anything away from the model,
#    which still receives the whole envelope. Drop this branch if nothing downstream is
#    classifying content.
#
# The branches are first match, and `conditional` cannot be combined with a plain `request`
# transformation, so the last entry is a catch-all. The transformation runs at PreRouting,
# before route selection, and AFTER any external processor on the same gateway: if something
# of yours reads the body through ExtProc, this has to sit on an earlier hop to be of use to
# it. See the semantic router page in this series.
#
# preserveToken keeps the bearer on the request after it has been verified, so a second hop
# can verify it again. Without it the gateway strips the Authorization header once the JWT
# has been checked.
#
# lint-crd-blocks: allow preserveToken
# The repo's cached AgentgatewayPolicy schema is the Enterprise 2026.8 chart's; preserveToken
# is on the OSS v1.5.0 CRD (kubectl explain agentgatewaypolicy.spec.traffic.jwtAuthentication).
#
# Message content is a string in a plain chat and a list of parts in an agent conversation,
# so every expression here handles both. The system prompt mentions the tag as well, which is
# why the split takes the last occurrence rather than the first.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: client-policy
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: my-gateway
  traffic:
    jwtAuthentication:
      mode: Strict
      preserveToken: true
      providers:
        - issuer: https://identity.example
          audiences: [model-gateway]
          jwks:
            remote:
              url: https://identity.example/.well-known/jwks.json
    phase: PreRouting
    transformation:
      conditional:
        # An editor, with at least one tool the backends can take.
        - condition: 'has(json(request.body).messages) && json(request.body).messages.map(m, type(m.content) == string ? m.content : m.content.map(p, has(p.text) ? p.text : "").join(" ")).join("\n").contains("<user_query>") && has(json(request.body).tools) && size(json(request.body).tools.filter(t, t.type == "function")) > 0'
          policy:
            request:
              body: 'toJson(json(request.body).merge({"tools": json(request.body).tools.filter(t, t.type == "function"), "messages": json(request.body).messages + [{"role": "user", "content": json(request.body).messages.map(m, type(m.content) == string ? m.content : m.content.map(p, has(p.text) ? p.text : "").join(" ")).join("\n").split("<user_query>")[size(json(request.body).messages.map(m, type(m.content) == string ? m.content : m.content.map(p, has(p.text) ? p.text : "").join(" ")).join("\n").split("<user_query>")) - 1].split("</user_query>")[0]}]}))'
        # An editor whose tools are all shapes the backends reject. An empty list is not an
        # option: vLLM refuses it outright, so the field goes.
        - condition: 'has(json(request.body).messages) && json(request.body).messages.map(m, type(m.content) == string ? m.content : m.content.map(p, has(p.text) ? p.text : "").join(" ")).join("\n").contains("<user_query>") && has(json(request.body).tools)'
          policy:
            request:
              body: 'toJson(json(request.body).filterKeys(k, k != "tools" && k != "tool_choice").merge({"messages": json(request.body).messages + [{"role": "user", "content": json(request.body).messages.map(m, type(m.content) == string ? m.content : m.content.map(p, has(p.text) ? p.text : "").join(" ")).join("\n").split("<user_query>")[size(json(request.body).messages.map(m, type(m.content) == string ? m.content : m.content.map(p, has(p.text) ? p.text : "").join(" ")).join("\n").split("<user_query>")) - 1].split("</user_query>")[0]}]}))'
        # An editor with no tools attached.
        - condition: 'has(json(request.body).messages) && json(request.body).messages.map(m, type(m.content) == string ? m.content : m.content.map(p, has(p.text) ? p.text : "").join(" ")).join("\n").contains("<user_query>")'
          policy:
            request:
              body: 'toJson(json(request.body).merge({"messages": json(request.body).messages + [{"role": "user", "content": json(request.body).messages.map(m, type(m.content) == string ? m.content : m.content.map(p, has(p.text) ? p.text : "").join(" ")).join("\n").split("<user_query>")[size(json(request.body).messages.map(m, type(m.content) == string ? m.content : m.content.map(p, has(p.text) ? p.text : "").join(" ")).join("\n").split("<user_query>")) - 1].split("</user_query>")[0]}]}))'
        # Any other client sending tools, at least one of them usable.
        - condition: 'has(json(request.body).tools) && size(json(request.body).tools.filter(t, t.type == "function")) > 0'
          policy:
            request:
              body: 'toJson(json(request.body).merge({"tools": json(request.body).tools.filter(t, t.type == "function")}))'
        # Any other client whose tools are all unusable.
        - condition: 'has(json(request.body).tools)'
          policy:
            request:
              body: 'toJson(json(request.body).filterKeys(k, k != "tools" && k != "tool_choice"))'
        # Anything else passes through unchanged.
        - condition: 'true'
          policy:
            request:
              body: 'toJson(json(request.body))'
