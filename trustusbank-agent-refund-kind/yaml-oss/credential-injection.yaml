# Illustrative OSS subset, not a runnable or validated OSS edition of the lab.
# STS, kagent Enterprise AccessPolicy and the Enterprise waypoint are required
# for the complete walkthrough. Supply your own agentgateway Gateway and Secret.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata: {name: bank-model-example, namespace: bank}
spec:
  ai:
    provider: {anthropic: {model: claude-haiku-4-5}}
  policies:
    auth: {secretRef: {name: anthropic-key}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: bank-model-example, namespace: bank}
spec:
  parentRefs: [{name: agentgateway}]
  rules:
  - matches: [{path: {type: PathPrefix, value: /v1}}]
    backendRefs: [{group: agentgateway.dev, kind: AgentgatewayBackend, name: bank-model-example}]
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata: {name: bank-model-example, namespace: bank}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: bank-model-example}]
  traffic:
    authorization:
      action: Allow
      policy:
        matchExpressions: ['source.identity.namespace == "bank" && source.identity.serviceAccount == "payments-assistant"']
