fullnameOverride: bank-ui-auth
replicaCount: 1
image:
  pullPolicy: IfNotPresent
config:
  existingSecret: bank-ui-auth
extraArgs:
  provider: oidc
  oidc-issuer-url: http://keycloak.localtest.me:18580/realms/bank
  skip-oidc-discovery: 'true'
  login-url: http://keycloak.localtest.me:18580/realms/bank/protocol/openid-connect/auth
  redeem-url: http://keycloak.keycloak.svc.cluster.local:8080/realms/bank/protocol/openid-connect/token
  oidc-jwks-url: http://keycloak.keycloak.svc.cluster.local:8080/realms/bank/protocol/openid-connect/certs
  profile-url: http://keycloak.keycloak.svc.cluster.local:8080/realms/bank/protocol/openid-connect/userinfo
  client-id: bank-ui
  email-domain: '*'
  upstream: http://kagent-ui.kagent.svc.cluster.local:8080
  redirect-url: http://localhost:18380/oauth2/callback
  cookie-secure: 'false'
  cookie-samesite: lax
  cookie-refresh: 1m
  pass-authorization-header: 'true'
  pass-access-token: 'true'
  set-authorization-header: 'true'
  set-xauthrequest: 'true'
  skip-provider-button: 'true'
  reverse-proxy: 'true'
  http-address: 0.0.0.0:4180
service:
  type: ClusterIP
  portNumber: 4180
resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {cpu: 200m, memory: 64Mi}
