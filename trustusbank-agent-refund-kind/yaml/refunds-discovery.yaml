# Keep static agent-card discovery available during the kill switch. The DENY
# applies to the execution route, so the parent can still load its toolset and
# explain the refused call instead of failing before it can answer.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: refunds-agent-card, namespace: bank}
spec:
  parentRefs: [{group: '', kind: Service, name: refunds-agent}]
  hostnames: [refunds-agent.bank.svc.cluster.local]
  rules:
  - matches: [{path: {type: Exact, value: /.well-known/agent-card.json}}]
    backendRefs: [{name: refunds-agent, port: 8080}]
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata: {name: refunds-card-callers, namespace: bank}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: refunds-agent-card}]
  traffic:
    authorization:
      action: Allow
      policy:
        matchExpressions:
        - 'source.identity.namespace == "bank" && source.identity.serviceAccount == "payments-assistant"'
        - 'source.identity.namespace == "kagent" && source.identity.serviceAccount == "kagent-controller"'
