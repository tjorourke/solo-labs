apiVersion: apps/v1
kind: Deployment
metadata: {name: core-bank, namespace: bank}
spec:
  selector: {matchLabels: {app: core-bank}}
  template:
    metadata: {labels: {app: core-bank, bank-tool: 'true'}}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: bank
        image: python:3.12-slim
        command: [python, /app/core_bank.py]
        readinessProbe: {tcpSocket: {port: 8001}}
        volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: core-bank}}]
---
apiVersion: v1
kind: Service
metadata: {name: core-bank, namespace: bank}
spec:
  selector: {app: core-bank}
  ports: [{port: 8001}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: bank-waypoint, namespace: bank}
spec:
  gatewayClassName: enterprise-agentgateway-waypoint
  listeners: [{name: mesh, port: 15008, protocol: HBONE}]
---
apiVersion: v1
kind: Service
metadata:
  name: bank-gw
  namespace: bank
  labels: {istio.io/use-waypoint: bank-waypoint}
spec:
  ports: [{name: http, port: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: core-bank, namespace: bank}
spec:
  parentRefs: [{group: '', kind: Service, name: bank-gw, port: 8080}]
  rules:
  - matches: [{path: {type: PathPrefix, value: /core}}]
    backendRefs: [{name: core-bank, port: 8001}]
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata: {name: core-credential, namespace: bank}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: core-bank}]
  backend:
    auth: {secretRef: {name: core-bank-key}}
