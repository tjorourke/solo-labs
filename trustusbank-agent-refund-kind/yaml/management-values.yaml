cluster: trustusbank-lab
platform:
  multiCluster:
    enabled: false
istio:
  ambient:
    enabled: false
global:
  istio:
    ambient:
      enabled: false
service:
  type: ClusterIP
products:
  kagent:
    enabled: true
    namespace: kagent
  agentgateway:
    enabled: true
    namespace: agentgateway-system
    features:
      cost-management: false
      cost-management-writes: false
licensing:
  createSecret: false
  secretName: trustusbank-management-license
oidc:
  issuer: http://refund-idp.localtest.me:19580/realms/bank
ui:
  publicUrl: http://refund-lab.localhost:19380
  backend:
    oidc:
      clientId: bank-enterprise
      secretRef: bank-enterprise-oidc
  frontend:
    oidc:
      clientId: bank-enterprise-ui
rbac:
  roleMapping:
    roleMapper: 'has(claims.groups) ? claims.groups.transformList(i, v, v in rolesMap, rolesMap[v]) : []'
    roleMappings:
      payments-ops: global.Admin
      payment_mgmt: global.Reader
      customer-service: global.Reader
      security-ops: global.Admin
telemetry:
  metrics:
    enabled: false
  traces:
    enabled: true
  collector:
    replicaCount: 1
clickhouse:
  persistentVolume:
    enabled: false
