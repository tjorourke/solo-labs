apiVersion: policy.kagent-enterprise.solo.io/v1alpha1
kind: AccessPolicy
metadata: {name: payments-manager-mgmt, namespace: bank}
spec:
  action: ALLOW
  from:
    subjects:
    - kind: UserGroup
      userGroup:
        claimName: groups
        claimValue: payment_mgmt
        issuer: http://refund-idp.localtest.me:19580/realms/bank
        jwksKey:
          remote:
            serviceRef: {name: keycloak, namespace: keycloak, port: 8080}
            path: /realms/bank/protocol/openid-connect/certs
  targetRef: {kind: Agent, name: payments-manager}
---
