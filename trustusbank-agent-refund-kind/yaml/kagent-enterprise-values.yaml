global:
  licensing:
    createSecret: false
    secretName: trustusbank-kagent-license
providers:
  default: anthropic
  anthropic:
    apiKeySecretRef: bank-model-placeholder
    apiKeySecretKey: ANTHROPIC_API_KEY
oidc:
  issuer: http://keycloak.localtest.me:18580/realms/bank
  clientId: bank-enterprise
  secretRef: bank-enterprise-oidc
  stsWellKnownUri: http://enterprise-agentgateway.agentgateway-system.svc.cluster.local:7777/.well-known/openid-configuration
  # 0.5.11 still needs this: otherwise the controller attempts its legacy OBO
  # signer before the agent-side STS exchange and returns "handler not ready".
  skipOBO: true
controller:
  remoteJwksConfig:
    serviceRef: {name: enterprise-agentgateway, namespace: agentgateway-system, port: 7777}
    path: /.well-known/jwks.json
rbac:
  roleMapping:
    roleMapper: 'has(claims.groups) ? claims.groups.transformList(i, v, v in rolesMap, rolesMap[v]) : []'
    roleMappings:
      payments-ops: global.Admin
      customer-service: global.Reader
      security-ops: global.Admin
database:
  postgres:
    bundled:
      storageClassName: trustusbank-enterprise-local
otel:
  tracing:
    enabled: true
    sampler: always_on
    exporter:
      otlp:
        endpoint: http://solo-enterprise-telemetry-collector.agentgateway-system.svc.cluster.local:4317
        insecure: true
ui:
  enabled: false
kmcp:
  enabled: false
kagent-tools:
  enabled: false
k8s-agent: {enabled: false}
kgateway-agent: {enabled: false}
istio-agent: {enabled: false}
promql-agent: {enabled: false}
observability-agent: {enabled: false}
argo-rollouts-agent: {enabled: false}
helm-agent: {enabled: false}
cilium-policy-agent: {enabled: false}
cilium-manager-agent: {enabled: false}
cilium-debug-agent: {enabled: false}
grafana-mcp: {enabled: false}
