apiVersion: policy.kagent-enterprise.solo.io/v1alpha1
kind: AccessPolicy
metadata:
  name: refunds-agent-killswitch
  namespace: bank
  annotations:
    bank.trustus/reason: Refund API calls outside the expected pattern
    bank.trustus/owner: alice
spec:
  action: DENY
  from:
    subjects:
    - {kind: Agent, name: payments-assistant, namespace: bank}
    - {kind: Agent, name: customer-service-assistant, namespace: bank}
  targetRef: {kind: Agent, name: refunds-agent}
