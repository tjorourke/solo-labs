apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: {name: trustusbank-enterprise-local}
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata: {name: trustusbank-enterprise-kagent-db}
spec:
  capacity: {storage: 500Mi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: trustusbank-enterprise-local
  hostPath: {path: /var/local/trustusbank-enterprise-kagent-db, type: Directory}
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - {key: kubernetes.io/hostname, operator: In, values: [trustusbank-lab-control-plane]}
