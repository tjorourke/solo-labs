apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata: {name: anthropic, namespace: bank}
spec:
  ai:
    provider: {anthropic: {model: claude-haiku-4-5}}
  policies:
    auth: {secretRef: {name: anthropic-key}}
    ai:
      finalTransformations:
      - field: tool_choice
        expression: '{"type": "auto", "disable_parallel_tool_use": true}'
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: anthropic, namespace: bank}
spec:
  parentRefs: [{group: '', kind: Service, name: bank-gw, port: 8080}]
  rules:
  - matches: [{path: {type: PathPrefix, value: /v1}}]
    backendRefs: [{group: enterpriseagentgateway.solo.io, kind: EnterpriseAgentgatewayBackend, name: anthropic}]
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata: {name: model-callers, namespace: bank}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: anthropic}]
  traffic:
    authorization:
      action: Allow
      policy:
        matchExpressions:
        - 'source.identity.namespace == "bank" && source.identity.serviceAccount in ["payments-assistant", "payments-manager", "customer-service-assistant", "customer-agent", "fraud-agent", "refunds-agent"]'
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: fraud-vendor, namespace: bank}
spec:
  parentRefs: [{group: '', kind: Service, name: bank-gw, port: 8080}]
  rules:
  - matches: [{path: {type: PathPrefix, value: /fraud}}]
    backendRefs: [{name: fraud-vendor, port: 8002}]
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata: {name: fraud-credential, namespace: bank}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: fraud-vendor}]
  backend:
    auth:
      secretRef: {name: fraud-vendor-key, key: X-Api-Key}
      location: {header: {name: X-Api-Key}}
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata: {name: fraud-egress-caller, namespace: bank}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: fraud-vendor}]
  traffic:
    authorization:
      action: Allow
      policy:
        matchExpressions: ['source.identity.namespace == "bank" && source.identity.serviceAccount == "fraud-mcp"']
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata: {name: core-egress-caller, namespace: bank}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: core-bank}]
  traffic:
    authorization:
      action: Allow
      policy:
        matchExpressions: ['source.identity.namespace == "bank" && source.identity.serviceAccount == "payments-mcp"']
