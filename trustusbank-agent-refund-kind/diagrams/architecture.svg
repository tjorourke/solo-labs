<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1670 875" role="img" aria-labelledby="title desc"><title id="title">TrustUs Bank refund architecture</title><desc id="desc">Carol and Bob use five declarative agents. Per-agent waypoints enforce access policies. The shared bank waypoint validates delegated tokens and injects model, vendor and bank credentials.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8b98b0"/></marker></defs><rect width="1670" height="875" fill="#f8f9fd"/><g font-family="Arial, sans-serif"><text x="837" y="42" text-anchor="middle" font-size="29" font-weight="700" fill="#172033">TrustUs Bank · customer refunds</text><text x="837" y="75" text-anchor="middle" font-size="19" font-weight="400" fill="#58657c">Five declarative agents. Identity checks and credentials stay at the gateways.</text><g data-node="carol"><rect data-node-box="true" x="25" y="225" width="170" height="80" rx="12" fill="#eef5ff" stroke="#d5dbea" stroke-width="2"/><text x="110.0" y="259.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Carol</text><text x="110.0" y="285.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">customer-service</text></g><g data-node="bob"><rect data-node-box="true" x="25" y="380" width="170" height="80" rx="12" fill="#eef5ff" stroke="#d5dbea" stroke-width="2"/><text x="110.0" y="414.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Bob</text><text x="110.0" y="440.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">payments-ops</text></g><g data-node="alice"><rect data-node-box="true" x="25" y="565" width="170" height="80" rx="12" fill="#fff4ec" stroke="#d5dbea" stroke-width="2"/><text x="110.0" y="599.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Alice</text><text x="110.0" y="625.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">security-ops</text></g><g data-node="keycloak"><rect data-node-box="true" x="240" y="110" width="180" height="80" rx="12" fill="#fff" stroke="#d5dbea" stroke-width="2"/><text x="330.0" y="144.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Keycloak</text><text x="330.0" y="170.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">bank realm</text></g><g data-node="ui"><rect data-node-box="true" x="240" y="225" width="180" height="235" rx="12" fill="#f4efff" stroke="#d5dbea" stroke-width="2"/><text x="330.0" y="310.5" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Solo UI</text><text x="330.0" y="336.5" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">OIDC sign-in</text><text x="330.0" y="362.5" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">Chat · policies</text><text x="330.0" y="388.5" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">Traces</text></g><g data-node="switch"><rect data-node-box="true" x="240" y="565" width="180" height="80" rx="12" fill="#fff4ec" stroke="#d5dbea" stroke-width="2"/><text x="330.0" y="599.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">AccessPolicy</text><text x="330.0" y="625.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">DENY refunds-agent</text></g><g data-node="service"><rect data-node-box="true" x="460" y="215" width="210" height="100" rx="12" fill="#f4efff" stroke="#d5dbea" stroke-width="2"/><text x="565.0" y="246.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Customer service</text><text x="565.0" y="272.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">assistant + waypoint</text><text x="565.0" y="298.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">Read only</text></g><g data-node="payments"><rect data-node-box="true" x="460" y="370" width="210" height="100" rx="12" fill="#f4efff" stroke="#d5dbea" stroke-width="2"/><text x="565.0" y="401.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Payments assistant</text><text x="565.0" y="427.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">Agent + waypoint</text><text x="565.0" y="453.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">Approval card</text></g><g data-node="customer"><rect data-node-box="true" x="710" y="215" width="200" height="100" rx="12" fill="#fff" stroke="#d5dbea" stroke-width="2"/><text x="810.0" y="246.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">customer-agent</text><text x="810.0" y="272.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">Agent + waypoint</text><text x="810.0" y="298.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">Customer context</text></g><g data-node="fraud"><rect data-node-box="true" x="710" y="370" width="200" height="100" rx="12" fill="#fff" stroke="#d5dbea" stroke-width="2"/><text x="810.0" y="401.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">fraud-agent</text><text x="810.0" y="427.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">Agent + waypoint</text><text x="810.0" y="453.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">Risk assessment</text></g><g data-node="refunds"><rect data-node-box="true" x="710" y="525" width="200" height="100" rx="12" fill="#fff" stroke="#d5dbea" stroke-width="2"/><text x="810.0" y="556.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">refunds-agent</text><text x="810.0" y="582.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">Agent + waypoint</text><text x="810.0" y="608.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">Up to £10,000</text></g><g data-node="gateway"><rect data-node-box="true" x="955" y="215" width="220" height="410" rx="12" fill="#f4efff" stroke="#7c3aed" stroke-width="2"/></g><text x="1065" y="252" text-anchor="middle" font-size="22" font-weight="700" fill="#7c3aed">bank-waypoint</text><text x="1065" y="280" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">bank-gw service</text><text x="1065" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">STS-issued identity</text><text x="1065" y="350" text-anchor="middle" font-size="18" font-weight="400" fill="#172033">JWT · tool policy</text><text x="1065" y="377" text-anchor="middle" font-size="18" font-weight="400" fill="#172033">£10,000 limit</text><text x="1075" y="434" text-anchor="middle" font-size="17" font-weight="700" fill="#172033">Anthropic key</text><circle cx="978" cy="428" r="5" fill="none" stroke="#7c3aed" stroke-width="2"/><path d="M983,428h10m-3,0v5" stroke="#7c3aed" stroke-width="2"/><text x="1075" y="494" text-anchor="middle" font-size="17" font-weight="700" fill="#172033">Vendor API key</text><circle cx="978" cy="488" r="5" fill="none" stroke="#7c3aed" stroke-width="2"/><path d="M983,488h10m-3,0v5" stroke="#7c3aed" stroke-width="2"/><text x="1075" y="554" text-anchor="middle" font-size="17" font-weight="700" fill="#172033">Vault token</text><circle cx="978" cy="548" r="5" fill="none" stroke="#7c3aed" stroke-width="2"/><path d="M983,548h10m-3,0v5" stroke="#7c3aed" stroke-width="2"/><text x="1065" y="601" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">Credentials injected</text><g data-node="customers-mcp"><rect data-node-box="true" x="1215" y="225" width="180" height="80" rx="12" fill="#fff" stroke="#d5dbea" stroke-width="2"/><text x="1305.0" y="259.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">customers-mcp</text><text x="1305.0" y="285.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">Read-only records</text></g><g data-node="fraud-mcp"><rect data-node-box="true" x="1215" y="380" width="180" height="80" rx="12" fill="#fff" stroke="#d5dbea" stroke-width="2"/><text x="1305.0" y="414.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">fraud-mcp</text><text x="1305.0" y="440.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">Vendor request</text></g><g data-node="payments-mcp"><rect data-node-box="true" x="1215" y="535" width="180" height="80" rx="12" fill="#fff" stroke="#d5dbea" stroke-width="2"/><text x="1305.0" y="569.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">payments-mcp</text><text x="1305.0" y="595.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">Bank request</text></g><g data-node="anthropic"><rect data-node-box="true" x="1435" y="110" width="210" height="80" rx="12" fill="#eef9f4" stroke="#d5dbea" stroke-width="2"/><text x="1540.0" y="144.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Anthropic</text><text x="1540.0" y="170.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">Claude Haiku 4.5</text></g><g data-node="vendor"><rect data-node-box="true" x="1435" y="380" width="210" height="80" rx="12" fill="#eef9f4" stroke="#d5dbea" stroke-width="2"/><text x="1540.0" y="401.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Fraud vendor mock</text><text x="1540.0" y="427.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">Via bank-waypoint</text><text x="1540.0" y="453.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">Checks X-Api-Key</text></g><g data-node="core"><rect data-node-box="true" x="1435" y="535" width="210" height="80" rx="12" fill="#eef9f4" stroke="#d5dbea" stroke-width="2"/><text x="1540.0" y="556.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Core bank mock</text><text x="1540.0" y="582.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">Via bank-waypoint</text><text x="1540.0" y="608.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">Checks Vault token</text></g><g data-node="vault"><rect data-node-box="true" x="1435" y="710" width="210" height="80" rx="12" fill="#fff4ec" stroke="#d5dbea" stroke-width="2"/><text x="1540.0" y="744.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Vault</text><text x="1540.0" y="770.0" text-anchor="middle" font-size="16" font-weight="400" fill="#58657c">Revocable bank key</text></g><path data-connector="true" d="M195,265 L240,265" fill="none" stroke="#8b98b0" stroke-width="2"  marker-end="url(#arrow)"/><path data-connector="true" d="M195,420 L240,420" fill="none" stroke="#8b98b0" stroke-width="2"  marker-end="url(#arrow)"/><path data-connector="true" d="M330,190 L330,225" fill="none" stroke="#8b98b0" stroke-width="2"  marker-end="url(#arrow)"/><path data-connector="true" d="M420,265 L460,265" fill="none" stroke="#8b98b0" stroke-width="2"  marker-end="url(#arrow)"/><path data-connector="true" d="M420,420 L460,420" fill="none" stroke="#8b98b0" stroke-width="2"  marker-end="url(#arrow)"/><path data-connector="true" d="M670,265 L710,265" fill="none" stroke="#8b98b0" stroke-width="2"  marker-end="url(#arrow)"/><path data-connector="true" d="M670,420 L690,420 L690,300 L710,300" fill="none" stroke="#8b98b0" stroke-width="2"  marker-end="url(#arrow)"/><path data-connector="true" d="M670,420 L710,420" fill="none" stroke="#8b98b0" stroke-width="2"  marker-end="url(#arrow)"/><path data-connector="true" d="M670,420 L690,420 L690,575 L710,575" fill="none" stroke="#8b98b0" stroke-width="2"  marker-end="url(#arrow)"/><path data-connector="true" d="M910,265 L955,265" fill="none" stroke="#8b98b0" stroke-width="2"  marker-end="url(#arrow)"/><path data-connector="true" d="M1175,265 L1215,265" fill="none" stroke="#8b98b0" stroke-width="2"  marker-end="url(#arrow)"/><path data-connector="true" d="M910,420 L955,420" fill="none" stroke="#8b98b0" stroke-width="2"  marker-end="url(#arrow)"/><path data-connector="true" d="M1175,420 L1215,420" fill="none" stroke="#8b98b0" stroke-width="2"  marker-end="url(#arrow)"/><path data-connector="true" d="M910,575 L955,575" fill="none" stroke="#8b98b0" stroke-width="2"  marker-end="url(#arrow)"/><path data-connector="true" d="M1175,575 L1215,575" fill="none" stroke="#8b98b0" stroke-width="2"  marker-end="url(#arrow)"/><path data-connector="true" d="M1395,420 L1435,420" fill="none" stroke="#8b98b0" stroke-width="2"  marker-end="url(#arrow)"/><path data-connector="true" d="M1395,575 L1435,575" fill="none" stroke="#8b98b0" stroke-width="2"  marker-end="url(#arrow)"/><path data-connector="true" d="M1065,215 L1065,150 L1435,150" fill="none" stroke="#8b98b0" stroke-width="2"  marker-end="url(#arrow)"/><text x="1260" y="137" text-anchor="middle" font-size="17" font-weight="400" fill="#58657c">Model calls from all agents</text><path data-connector="true" d="M195,605 L240,605" fill="none" stroke="#bf7131" stroke-width="2"  marker-end="url(#arrow)"/><path data-connector="true" d="M420,605 L440,605 L440,680 L810,680 L810,625" fill="none" stroke="#bf7131" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="608" y="667" text-anchor="middle" font-size="17" font-weight="400" fill="#58657c">Stop the refunds agent</text><path data-connector="true" d="M1435,750 L1065,750 L1065,625" fill="none" stroke="#bf7131" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="1220" y="737" text-anchor="middle" font-size="17" font-weight="400" fill="#58657c">Provision credential</text><text x="530" y="765" text-anchor="middle" font-size="18" font-weight="400" fill="#58657c">A2A calls cross the destination agent’s waypoint.</text><text x="530" y="795" text-anchor="middle" font-size="18" font-weight="400" fill="#58657c">Agents exchange tokens at the controller’s STS endpoint.</text><text x="837" y="837" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">No Anthropic key, bank token or vendor key is mounted in an agent or MCP pod.</text></g></svg>