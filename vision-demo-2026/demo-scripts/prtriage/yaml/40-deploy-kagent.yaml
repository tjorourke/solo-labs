# Deploy the published agent onto the kagent runtime. No env here on purpose:
# the model key is injected in-cluster from Secret/kagent-anthropic by the
# Kyverno policy, and the GitHub PAT is not here because the agent never has one.
apiVersion: ar.dev/v1alpha1
kind: Deployment
metadata:
  name: prtriage
spec:
  targetRef:  { kind: Agent,   name: prtriage }
  runtimeRef: { kind: Runtime, name: kind-kagent }
