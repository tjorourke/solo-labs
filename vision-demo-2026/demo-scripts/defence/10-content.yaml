# On the agent's model route at dd-waypoint, so the check runs before anything is
# sent to the provider, whichever prompt or tool result the text came from.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata: {name: reject-personal-data, namespace: dd-gateway}
spec:
  targetRefs:
  - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: model}
  backend:
    ai:
      promptGuard:
        request:
        - regex:
            action: Reject
            builtins: [Email]
          response:
            statusCode: 403
            message: "Personal data refused before the model call"
