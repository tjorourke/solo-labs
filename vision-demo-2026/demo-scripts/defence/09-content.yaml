apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata: {name: mask-personal-data, namespace: dd-gateway}
spec:
  targetRefs:
  - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: model}
  backend:
    ai:
      promptGuard:
        request:
        - regex:
            action: Mask
            builtins: [Email]
