# On the front door's agent route: each signed caller gets three agent requests a
# minute, and a refused request never reaches the agent or the model.
apiVersion: ratelimit.solo.io/v1alpha1
kind: RateLimitConfig
metadata: {name: dd-per-person, namespace: dd-gateway}
spec:
  raw:
    descriptors:
    - key: dd-sub
      rateLimit: {requestsPerUnit: 3, unit: MINUTE}
    rateLimits:
    - actions:
      - cel: {expression: jwt.sub, key: dd-sub}
      type: REQUEST
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata: {name: per-person-rate, namespace: dd-gateway}
spec:
  targetRefs:
  - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: agent}
  traffic:
    entRateLimit:
      global:
        rateLimitConfigRefs: [{name: dd-per-person}]
        backendRef:
          name: dd-rate-limiter
          namespace: agentgateway-system
          port: 8083
