# Only the tool server's pods are selected, and only these identities may connect:
# dd-waypoint (the agent's path to its tools), dd-gateway (the operator route and the
# read-only state view) and kagent's controller, which connects directly to discover
# the tools of the MCPServer it manages. The controller is a privileged caller; it
# is admitted here because kagent needs it, and should be reviewed like any other.
# The agent's own identity is not on the list.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: gateway-only, namespace: dd-tools}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: defence-operations}
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - mesh1/ns/dd-gateway/sa/dd-waypoint
        - mesh1/ns/dd-gateway/sa/dd-gateway
        - mesh1/ns/kagent/sa/kagent-controller
