# The agent's model and tool endpoints. Each is a Service with no pods; the label
# sends its traffic to dd-waypoint, which sees the caller's SPIFFE identity. Policies
# here can therefore name the agent's workload, not a token it happens to hold.
# The Anthropic key lives only in dd-anthropic, attached to the model backend.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: dd-waypoint, namespace: dd-gateway}
spec:
  gatewayClassName: enterprise-agentgateway-waypoint
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
    allowedRoutes: {namespaces: {from: Same}}
---
apiVersion: v1
kind: Service
metadata:
  name: model
  namespace: dd-gateway
  labels: {istio.io/use-waypoint: dd-waypoint}
spec:
  ports: [{name: http, port: 80, targetPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: tools
  namespace: dd-gateway
  labels: {istio.io/use-waypoint: dd-waypoint}
spec:
  ports: [{name: http, port: 80, targetPort: 80}]
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata: {name: model, namespace: dd-gateway}
spec:
  ai:
    provider:
      anthropic: {model: claude-haiku-4-5}
  policies:
    auth:
      secretRef: {name: dd-anthropic}
---
# FailClosed: if the tool server cannot be reached, the agent gets an error rather
# than a partial tool list. The target selects the kmcp Service (appProtocol
# kgateway.dev/mcp) in dd-tools rather than naming a static host. The waypoint
# then reaches it over the mesh as dd-waypoint, which chapter 3's policy admits.
# A static host is dialled without a mesh identity and would be refused.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata: {name: tools, namespace: dd-gateway}
spec:
  entMcp:
    toolMode: Standard
    failureMode: FailClosed
    targets:
    - name: operations
      selector:
        namespaces: {matchLabels: {kubernetes.io/metadata.name: dd-tools}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: model, namespace: dd-gateway}
spec:
  parentRefs: [{group: "", kind: Service, name: model, port: 80}]
  rules:
  - backendRefs:
    - {name: model, group: enterpriseagentgateway.solo.io, kind: EnterpriseAgentgatewayBackend}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: tools, namespace: dd-gateway}
spec:
  parentRefs: [{group: "", kind: Service, name: tools, port: 80}]
  rules:
  - backendRefs:
    - {name: tools, group: enterpriseagentgateway.solo.io, kind: EnterpriseAgentgatewayBackend}
