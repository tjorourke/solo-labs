# A harness: a whole agent runtime (OpenClaw here) that kagent runs on the same pool. It
# gets its own ActorTemplate and golden snapshot, and one shared actor serves its chats.
# This build does not carry a default harness image, so it is pinned here by digest.
apiVersion: kagent.dev/v1alpha2
kind: AgentHarness
metadata:
  name: lab-harness
  namespace: kagent
spec:
  backend: openclaw
  description: OpenClaw harness on the lab-pool WorkerPool
  modelConfigRef: default-model-config
  substrate:
    workerPoolRef:
      name: lab-pool
    workloadImage: ghcr.io/kagent-dev/kagent/acp-sandbox-openclaw@sha256:4fd5fc323217c284b55e510136a2d7c2f989d7d98a09f1df383ba77524dc9610
