<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" width="1080" height="400" role="img"
     aria-label="Claude Desktop calls the model gateway, which classifies the task. Native AGW CEL determines the data class and pool. The gateway enforces refusals before the personal-data service or model, then redacts allowed requests and routes them to the permitted model.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .b   { fill:#fff; stroke:#94a3b8; stroke-width:1.5; rx:8; }
      .gw  { fill:#f5f3ff; stroke:#7c3aed; stroke-width:1.75; rx:8; }
      .chk { fill:#ecfdf5; stroke:#15803d; stroke-width:1.75; rx:8; }
      .out { fill:#fffbeb; stroke:#d97706; stroke-width:1.75; rx:8; }
      .eu  { fill:#eff6ff; stroke:#2563eb; stroke-width:1.75; rx:8; }
      .own { fill:#ecfdf5; stroke:#15803d; stroke-width:1.75; rx:8; }
      .t   { font:600 13px -apple-system,Segoe UI,Helvetica,Arial,sans-serif; fill:#0f172a; }
      .s   { font:11px -apple-system,Segoe UI,Helvetica,Arial,sans-serif; fill:#64748b; }
      .l   { font:11px ui-monospace,Menlo,monospace; fill:#475569; }
      .cl  { fill:none; stroke:#cbd5e1; stroke-width:1.5; stroke-dasharray:6 5; rx:12; }
      .cln { font:600 11px -apple-system,Segoe UI,Helvetica,Arial,sans-serif; fill:#94a3b8; }
      .ico { fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
      .arr { stroke:#64748b; stroke-width:1.75; fill:none; marker-end:url(#a); }
      .trunk { stroke:#64748b; stroke-width:1.75; fill:none; }
    </style>
  </defs>

  <!-- the cluster -->
  <rect class="cl" x="176" y="20" width="514" height="360"/>
  <text class="cln" x="192" y="42">Kernwerk's Kubernetes cluster · namespace agentgateway-system</text>

  <!-- the pipeline, all on one line at y=120 -->
  <rect class="b"  x="16"  y="92" width="140" height="56"/>
  <text class="t"  x="86"  y="115" text-anchor="middle">Claude Desktop</text>
  <text class="s"  x="86"  y="133" text-anchor="middle">enrolled as martink</text>

  <rect class="gw" x="196" y="92" width="140" height="56"/>
  <text class="t"  x="266" y="115" text-anchor="middle">model gateway</text>
  <text class="s"  x="266" y="133" text-anchor="middle">checks the token</text>

  <rect class="gw" x="396" y="92" width="140" height="56"/>
  <text class="t"  x="466" y="115" text-anchor="middle">decision gateway</text>
  <text class="s"  x="466" y="133" text-anchor="middle">applies the decision</text>

  <!-- what hangs below the pipeline -->
  <rect class="b"   x="196" y="212" width="140" height="56"/>
  <text class="t"   x="266" y="235" text-anchor="middle">semantic router</text>
  <text class="s"   x="266" y="253" text-anchor="middle">what kind of task</text>

  <rect class="chk" x="356" y="212" width="120" height="56"/>
  <text class="t"   x="416" y="235" text-anchor="middle">AGW CEL</text>
  <text class="s"   x="416" y="253" text-anchor="middle">class and pool</text>

  <rect class="chk" x="496" y="300" width="176" height="60"/>
  <text class="t"   x="584" y="323" text-anchor="middle">kernwerk-pii</text>
  <text class="s"   x="584" y="341" text-anchor="middle">replaces personal data</text>

  <!-- destinations -->
  <rect class="out" x="740" y="40"  width="324" height="56"/>
  <text class="t"   x="790" y="63">Anthropic</text>
  <text class="s"   x="790" y="81">Class 1 · may leave the EU</text>

  <rect class="eu"  x="740" y="156" width="324" height="56"/>
  <text class="t"   x="790" y="179">Amazon Bedrock, eu-central-1</text>
  <text class="s"   x="790" y="197">Class 2 · stays in the EU</text>

  <rect class="own" x="740" y="272" width="324" height="56"/>
  <text class="t"   x="790" y="295">vLLM on Kernwerk's own GPUs</text>
  <text class="s"   x="790" y="313">Class 3 · in this cluster, never leaves</text>

  <!-- arrows along the pipeline -->
  <path class="arr" d="M156 120 H190"/>
  <path class="arr" d="M336 120 H390"/>

  <!-- the two things the gateways consult, straight down and back -->
  <path class="arr" d="M266 148 V206"/>
  <path class="arr" d="M416 148 V206"/>
  <path class="arr" d="M516 148 V300"/>

  <!-- out to the models: one trunk carrying no arrowhead, then one spur per
       destination, so nothing points into the gap between two boxes -->
  <g class="ico" stroke="#b45309" transform="translate(756 56)">
    <circle cx="11" cy="11" r="9"/><path d="M2 11h18M11 2c2.6 3 2.6 15 0 18M11 2c-2.6 3-2.6 15 0 18"/>
  </g>
  <g class="ico" stroke="#1d4ed8" transform="translate(756 172)">
    <path d="M11 2 3 5.2v5.9c0 4.4 3.4 7.9 8 9.7 4.6-1.8 8-5.3 8-9.7V5.2z"/><circle cx="11" cy="10.6" r="3.4"/>
  </g>
  <g class="ico" stroke="#15803d" transform="translate(756 288)">
    <rect x="3" y="9.5" width="16" height="11" rx="2.4"/><path d="M6.8 9.5V6.4a4.2 4.2 0 0 1 8.4 0v3.1"/>
  </g>

  <path class="trunk" d="M536 120 H700"/>
  <path class="trunk" d="M700 68 V300"/>
  <path class="arr" d="M700 68  H734"/>
  <path class="arr" d="M700 184 H734"/>
  <path class="arr" d="M700 300 H734"/>

  <text class="l" x="618" y="110" text-anchor="middle">one of three</text>
</svg>
