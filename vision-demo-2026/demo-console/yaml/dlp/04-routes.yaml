# Three routes, one per destination. The lane policy (05) has already read the
# prompt and set x-kernwerk-lane. Anything it did not mark as public or EU
# lands on the private route, so a request nobody classified stays inside.
# Each route has a wire-tap rule first: it answers with what the model on that
# route would have received.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kernwerk-anywhere
  namespace: agentgateway-system
spec:
  parentRefs:
  - name: dlp-gateway
  rules:
  - name: wire-tap
    matches:
    - headers:
      - {name: x-kernwerk-lane, value: public}
      - {name: x-kernwerk-tap, value: wire}
    backendRefs:
    - {group: enterpriseagentgateway.solo.io, kind: EnterpriseAgentgatewayBackend, name: wire-tap}
  - name: model
    matches:
    - headers:
      - {name: x-kernwerk-lane, value: public}
    backendRefs:
    - {group: enterpriseagentgateway.solo.io, kind: EnterpriseAgentgatewayBackend, name: kernwerk-claude}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kernwerk-eu
  namespace: agentgateway-system
spec:
  parentRefs:
  - name: dlp-gateway
  rules:
  - name: wire-tap
    matches:
    - headers:
      - {name: x-kernwerk-lane, value: eu}
      - {name: x-kernwerk-tap, value: wire}
    backendRefs:
    - {group: enterpriseagentgateway.solo.io, kind: EnterpriseAgentgatewayBackend, name: wire-tap}
  - name: model
    matches:
    - headers:
      - {name: x-kernwerk-lane, value: eu}
    backendRefs:
    - {group: enterpriseagentgateway.solo.io, kind: EnterpriseAgentgatewayBackend, name: kernwerk-eu}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kernwerk-private
  namespace: agentgateway-system
spec:
  parentRefs:
  - name: dlp-gateway
  rules:
  - name: wire-tap
    matches:
    - headers:
      - {name: x-kernwerk-tap, value: wire}
    backendRefs:
    - {group: enterpriseagentgateway.solo.io, kind: EnterpriseAgentgatewayBackend, name: wire-tap}
  - name: model
    backendRefs:
    - {group: enterpriseagentgateway.solo.io, kind: EnterpriseAgentgatewayBackend, name: kernwerk-private}
