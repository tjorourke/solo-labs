# The personal-data check, running inside Kernwerk's cluster. Presidio finds
# names with a language model that runs here on CPU, and the rest with patterns.
# pii.py speaks the gateway's guardrail webhook contract: POST /request and
# POST /response, answering pass or mask with the placeholders filled in.
#
# It also opens attachments. Claude Desktop sends a PDF as a document block,
# and converting Messages to chat completions has nowhere to put one, so it
# would be dropped before the gateway could classify it. Desktop's requests
# come here first (port 8081, 07-desktop.yaml): each PDF becomes text, inside
# the cluster, and the request goes back to the gateway to be classified and
# masked like any other prompt.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kernwerk-pii
  namespace: agentgateway-system
data:
  pii.py: |
    import base64
    import http.client
    import io
    import json
    import threading
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from presidio_analyzer import AnalyzerEngine, Pattern, PatternRecognizer

    engine = AnalyzerEngine()
    for entity, regex, score in [
        ("KERNWERK_EMPLOYEE_ID", r"\bKW-\d{6}\b", 0.95),
        ("GERMAN_PHONE", r"(?:\+49 ?|\b0)[1-9]\d{1,4}(?:[ /-]?\d{2,8}){1,3}\b", 0.85),
        ("GERMAN_TAX_ID", r"\b[1-9]\d{10}\b", 0.7),
        ("IBAN", r"\b[A-Z]{2}\d{2}(?: ?[0-9A-Z]{4}){3,7}(?: ?[0-9A-Z]{1,4})?\b", 0.95),
        ("ADDRESS", r"\b[A-ZÄÖÜ][a-zäöüß]+(?:straße|strasse|str\.|weg|platz|allee|gasse|ring|damm)"
                    r" \d+[a-z]?(?:, \d{5} [A-ZÄÖÜ][a-zäöüß]+)?", 0.9),
    ]:
        engine.registry.add_recognizer(PatternRecognizer(
            supported_entity=entity, name=entity.lower(), patterns=[Pattern(entity, regex, score)]))

    # Presidio's names for things, mapped to the placeholders people read.
    LABEL = {"PERSON": "NAME", "EMAIL_ADDRESS": "EMAIL", "PHONE_NUMBER": "PHONE",
             "IBAN_CODE": "IBAN", "IBAN": "IBAN", "CREDIT_CARD": "CARD",
             "KERNWERK_EMPLOYEE_ID": "KERNWERK_EMPLOYEE_ID", "GERMAN_TAX_ID": "GERMAN_TAX_ID",
             "ADDRESS": "ADDRESS",
             "GERMAN_PHONE": "PHONE"}
    # Company, site and project names (Werk Brno, Project Lindwurm) are not
    # personal data. The model tags spans such as "Meet Kernwerk" as a person,
    # so any span holding one is kept.
    KEEP = ["Kernwerk", "Werk ", "Project ", "Hannover Messe"]

    def mask(text):
        found = [r for r in engine.analyze(text=text, language="en", entities=list(LABEL),
                                           score_threshold=0.5)
                 if not any(k in text[r.start:r.end] for k in KEEP)]
        found.sort(key=lambda r: (r.start, -(r.end - r.start), -r.score))
        out, pos, n = [], 0, 0
        for r in found:
            if r.start < pos:
                continue
            out.append(text[pos:r.start] + "{" + LABEL[r.entity_type] + "}")
            pos, n = r.end, n + 1
        return "".join(out) + text[pos:], n

    def mask_content(content):
        """Chat completions content is a string or a list of parts."""
        if isinstance(content, list):
            total = 0
            for part in content:
                if isinstance(part, dict) and isinstance(part.get("text"), str):
                    part["text"], n = mask(part["text"])
                    total += n
            return content, total
        return mask(content or "")

    def text_of(content):
        if isinstance(content, list):
            return "\n".join(p.get("text", "[attachment]") for p in content if isinstance(p, dict))
        return content or ""

    # One JSON line per prompt and per answer, for the demo console to follow
    # with kubectl logs. Only the newest message of a conversation is recorded:
    # "incoming" as Desktop sent it, "request" as the model will receive it,
    # "answer" as Desktop is shown it.
    def record(**event):
        print(json.dumps({"ts": time.time(), **event}), flush=True)

    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            self.reply({"ok": True})

        def do_POST(self):
            payload = json.loads(self.rfile.read(int(self.headers.get("Content-Length") or 0)) or b"{}")
            body = payload["body"]
            lane = self.headers.get("x-kernwerk-lane", "")
            # On the decision gateway the class is decided by AGW and arrives here as the
            # lane. A caller whose organisation does not classify its data has none, and
            # then this service changes nothing and records nothing: it cannot alter a
            # colleague's request on the same gateway even if it is called for one.
            if not lane:
                return self.reply({"action": {"reason": "caller does not classify data"}})
            # The decision gateway's trace id, so the console can put the redactions on the
            # right card rather than guessing by matching text.
            trace = self.headers.get("traceparent", "").split("-")
            trace = trace[1] if len(trace) == 4 else ""
            total = 0
            if self.path.startswith("/request"):
                # A coding agent's conversation carries tool results, and the gateway
                # hands back a masked body without each tool message's tool_call_id.
                # The masked request then fails to parse and the turn is rejected with
                # a 400, so a masked tool conversation can never reach a model. It is
                # passed on unmasked and nothing is recorded for it, so the console
                # does not show a redaction the model never received.
                if any(m.get("role") == "tool" for m in body["messages"]):
                    return self.reply({"action": {"reason": "tool conversation, not masked"}})
                last = None
                for m in body["messages"]:
                    if m.get("role") == "system":
                        continue
                    # An assistant turn that is only tool calls carries no content key at
                    # all. Reading it as "" and writing that back invents a field the
                    # caller never sent, and the gateway then has to reconcile a message
                    # that is both a tool call and an empty answer. Nothing to check here,
                    # so leave the message exactly as it arrived.
                    if not isinstance(m.get("content"), (str, list)):
                        continue
                    before = text_of(m.get("content"))
                    m["content"], n = mask_content(m.get("content"))
                    total += n
                    if m.get("role") == "user":
                        last = (before, text_of(m["content"]), n)
                if last:
                    record(kind="request", lane=lane, trace=trace, original=last[0],
                           masked=last[1], replaced=last[2],
                           turns=sum(1 for m in body["messages"] if m.get("role") == "user"))
            else:
                for c in body["choices"]:
                    if not isinstance(c.get("message", {}).get("content"), (str, list)):
                        continue
                    before = text_of(c["message"].get("content"))
                    c["message"]["content"], n = mask_content(c["message"].get("content"))
                    total += n
                    record(kind="response", lane=lane, trace=trace, original=before,
                           masked=text_of(c["message"]["content"]), replaced=n)
            if total:
                self.reply({"action": {"body": body, "reason": f"{total} personal data items replaced"}})
            else:
                self.reply({"action": {"reason": "no personal data"}})

        def reply(self, d):
            out = json.dumps(d).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(out)))
            self.end_headers()
            self.wfile.write(out)

        def log_message(self, *a):
            pass


    def read_pdf(data):
        from pypdf import PdfReader
        pdf = PdfReader(io.BytesIO(base64.b64decode(data)))
        return "\n".join((page.extract_text() or "") for page in pdf.pages).strip(), len(pdf.pages)

    def open_attachments(body):
        opened = []
        for m in body.get("messages", []):
            if not isinstance(m.get("content"), list):
                continue
            for i, part in enumerate(m["content"]):
                source = part.get("source") or {}
                if part.get("type") != "document":
                    continue
                name = part.get("title") or "attached document"
                if source.get("type") == "text":
                    text, pages = source.get("data", ""), 1
                elif source.get("media_type") == "application/pdf" and source.get("type") == "base64":
                    text, pages = read_pdf(source["data"])
                else:
                    continue
                m["content"][i] = {"type": "text", "text": f"[{name}, {pages} page(s)]\n{text}"}
                opened.append({"name": name, "pages": pages})
        return opened

    UPSTREAM = ("model-gateway.agentgateway-system.svc.cluster.local", 8080)
    HOP = {"connection", "keep-alive", "transfer-encoding", "content-length", "host"}
    # The gateway checks a streamed answer as it goes past, which the response
    # webhook cannot do, so Desktop's answers are fetched whole, checked, and
    # sent on as a stream.
    STOPPED = ("Stopped at the Kernwerk gateway. This request carries a secret or tries to "
               "override the model's rules, so no model received it.")

    def sse(msg):
        """A complete Messages response, replayed as the events a stream carries."""
        def ev(kind, data):
            return f"event: {kind}\ndata: {json.dumps({'type': kind, **data})}\n\n".encode()
        blocks, usage = msg.get("content") or [], msg.get("usage") or {}
        out = [ev("message_start", {"message": {**msg, "content": [], "stop_reason": None,
                                                "usage": {**usage, "output_tokens": 0}}})]
        for i, b in enumerate(blocks):
            if b.get("type") == "text":
                out += [ev("content_block_start", {"index": i, "content_block": {"type": "text", "text": ""}}),
                        ev("content_block_delta", {"index": i, "delta": {"type": "text_delta", "text": b["text"]}})]
            elif b.get("type") == "tool_use":
                out += [ev("content_block_start", {"index": i, "content_block": {**b, "input": {}}}),
                        ev("content_block_delta", {"index": i, "delta": {
                            "type": "input_json_delta", "partial_json": json.dumps(b.get("input") or {})}})]
            else:
                continue
            out.append(ev("content_block_stop", {"index": i}))
        out += [ev("message_delta", {"delta": {"stop_reason": msg.get("stop_reason"),
                                                "stop_sequence": msg.get("stop_sequence")},
                                      "usage": {"output_tokens": usage.get("output_tokens", 0)}}),
                ev("message_stop", {})]
        return b"".join(out)

    class Reader(BaseHTTPRequestHandler):
        def do_GET(self):
            self.send_response(200)
            self.end_headers()

        def do_POST(self):
            raw = self.rfile.read(int(self.headers.get("Content-Length") or 0))
            messages = self.path.endswith("/v1/messages")
            rid, stream = f"{time.time():.6f}", False
            try:
                body = json.loads(raw)
                opened = open_attachments(body)
                if messages:
                    stream = bool(body.pop("stream", False))
                    users = [m for m in body.get("messages", []) if m.get("role") == "user"]
                    record(kind="incoming", id=rid, text=text_of(users[-1].get("content")) if users else "",
                           files=opened, turns=len(users))
                raw = json.dumps(body).encode()
            except Exception as e:
                record(kind="attachment-error", error=str(e)[:200])
            # Uncompressed, since the answer is read here before Desktop gets it.
            headers = {k: v for k, v in self.headers.items() if k.lower() not in HOP | {"accept-encoding"}}
            headers["Content-Length"] = str(len(raw))
            conn = http.client.HTTPConnection(*UPSTREAM, timeout=300)
            conn.request("POST", "/kernwerk-open" + self.path[len("/kernwerk"):], raw, headers)
            resp = conn.getresponse()
            status, data = resp.status, resp.read()
            ctype = resp.getheader("Content-Type", "application/json")
            conn.close()
            # A request the gateway refuses comes back as text, which the
            # Messages conversion then fails to read.
            if status == 502 and data.startswith(b"failed to process LLM response"):
                status = 403
                data = json.dumps({"type": "error", "error": {"type": "permission_error", "message": STOPPED}}).encode()
                ctype = "application/json"
            if messages:
                answer = ""
                try:
                    answer = text_of([b for b in json.loads(data).get("content", []) if b.get("type") == "text"])
                except Exception:
                    pass
                record(kind="answer", id=rid, status=status, text=answer)
            if stream and status == 200:
                try:
                    data, ctype = sse(json.loads(data)), "text/event-stream"
                except Exception as e:
                    record(kind="stream-error", id=rid, error=str(e)[:200])
            self.send_response(status)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(data)))
            self.send_header("Connection", "close")
            self.end_headers()
            self.wfile.write(data)

        def log_message(self, *a):
            pass

    threading.Thread(target=ThreadingHTTPServer(("0.0.0.0", 8081), Reader).serve_forever, daemon=True).start()
    ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kernwerk-pii
  namespace: agentgateway-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: kernwerk-pii}
  template:
    metadata:
      labels: {app: kernwerk-pii}
    spec:
      containers:
      - name: pii
        image: mcr.microsoft.com/presidio-analyzer@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
        command: ["python", "-u", "/opt/kernwerk/pii.py"]
        env: [{name: PYTHONPATH, value: /app:/opt/pylib}]
        ports: [{containerPort: 8080}, {containerPort: 8081}]
        readinessProbe:
          httpGet: {path: /, port: 8080}
          periodSeconds: 5
        resources:
          requests: {cpu: 250m, memory: 1Gi}
          limits: {memory: 2Gi}
        volumeMounts: [{name: app, mountPath: /opt/kernwerk}, {name: pylib, mountPath: /opt/pylib}]
      # pypdf, for reading attached PDFs. The Presidio image does not carry it.
      initContainers:
      - name: pypdf
        image: mcr.microsoft.com/presidio-analyzer@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
        command: ["pip", "install", "--quiet", "--target", "/opt/pylib", "pypdf>=5,<7"]
        volumeMounts: [{name: pylib, mountPath: /opt/pylib}]
      volumes:
      - name: app
        configMap: {name: kernwerk-pii}
      - name: pylib
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kernwerk-pii
  namespace: agentgateway-system
spec:
  selector: {app: kernwerk-pii}
  ports: [{name: guardrail, port: 8080, targetPort: 8080}, {name: reader, port: 8081, targetPort: 8081}]
