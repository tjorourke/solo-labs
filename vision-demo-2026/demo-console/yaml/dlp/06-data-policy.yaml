# Kernwerk's data policy, on all three routes. The lane policy (05) has already
# decided where a prompt may go; this decides what it may carry.
#
# First, what no model gets, not even Kernwerk's own: secrets and attempts to
# talk the model out of its rules. Then every personal detail is replaced with
# a placeholder by kernwerk-pii, which runs in this cluster, so no prompt is
# sent to a cloud service to be checked. The answer passes through kernwerk-pii
# again on the way back.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: kernwerk-data-policy
  namespace: agentgateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: kernwerk-anywhere
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: kernwerk-eu
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: kernwerk-private
  backend:
    ai:
      prompt:
        prepend:
        - role: system
          content: >-
            Kernwerk data policy: personal data below has been replaced with
            placeholders like {NAME}. Treat each placeholder as the person or
            detail it stands for.
      promptGuard:
        request:
        - regex:
            action: Reject
            builtins: [CreditCard]
            matches:
            - '\bAKIA[0-9A-Z]{16}\b'
            - '(?i)\b(password|passwort|kennwort)\s*[:=]\s*\S+'
            - '(?i)ignore (all |any )?(previous|prior|your) (instructions|rules)'
            - '(?i)you (now )?have no (rules|restrictions)'
            - '(?i)(print|reveal|show) (me )?your system prompt'
          response:
            statusCode: 403
            message: "Stopped at the Kernwerk gateway. This request carries a secret or tries to override the model's rules, so no model received it."
        - webhook:
            backendRef:
              kind: Service
              name: kernwerk-pii
              port: 8080
            failureMode: FailClosed
            # So the DLP service can record which class each prompt was.
            forwardHeaderMatches:
            - {name: x-kernwerk-lane, type: RegularExpression, value: ".*"}
        response:
        - webhook:
            backendRef:
              kind: Service
              name: kernwerk-pii
              port: 8080
            failureMode: FailClosed
            forwardHeaderMatches:
            - {name: x-kernwerk-lane, type: RegularExpression, value: ".*"}
