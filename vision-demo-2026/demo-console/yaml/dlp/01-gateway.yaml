# The gateway every Kernwerk agent calls. Its service account carries an IAM role
# that may call one Bedrock inference profile, the EU one, and nothing else.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayParameters
metadata:
  name: dlp-gateway-params
  namespace: agentgateway-system
spec:
  service:
    spec:
      type: ClusterIP
  serviceAccount:
    metadata:
      annotations:
        eks.amazonaws.com/role-arn: ${ROLE_ARN}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dlp-gateway
  namespace: agentgateway-system
spec:
  gatewayClassName: enterprise-agentgateway
  infrastructure:
    parametersRef:
      group: enterpriseagentgateway.solo.io
      kind: EnterpriseAgentgatewayParameters
      name: dlp-gateway-params
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
