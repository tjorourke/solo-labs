# Anything that may go anywhere: Claude, straight from Anthropic.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: kernwerk-claude
  namespace: agentgateway-system
spec:
  ai:
    provider:
      anthropic:
        model: claude-sonnet-5
  policies:
    auth:
      secretRef:
        name: anthropic-secret
---
# Personal data may leave Kernwerk, but not the EU. The EU inference profile on
# Amazon Bedrock only ever runs the model in EU regions.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: kernwerk-eu
  namespace: agentgateway-system
spec:
  ai:
    provider:
      bedrock:
        model: eu.anthropic.claude-sonnet-5
        region: eu-central-1
---
# Restricted data never leaves. Mistral Small on Kernwerk's own GPUs, in this
# cluster. vLLM wants a single system message, so the gateway merges them.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: kernwerk-private
  namespace: agentgateway-system
spec:
  ai:
    provider:
      openai:
        model: mistral-small-3.2-24b
      host: vllm.models.svc.cluster.local
      port: 8000
      path: /v1/chat/completions
  policies:
    ai:
      finalTransformations:
      - field: messages
        expression: |-
          llmRequest.messages.filter(m, m.role == "system").size() == 0 ? llmRequest.messages : [{"role": "system", "content": llmRequest.messages.filter(m, m.role == "system").map(m,
            type(m.content) == string ? m.content : m.content.map(p, p.text).join("\n")).join("\n\n")}]
          + llmRequest.messages.filter(m, m.role != "system")
---
# A stand-in model that answers with exactly what it was sent, and names the
# lane the gateway chose. It sits behind the same policies as the real models,
# so it shows what each one would receive.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: wire-tap
  namespace: agentgateway-system
spec:
  ai:
    provider:
      openai:
        model: wire-tap
      host: wire-tap.agentgateway-system.svc.cluster.local
      port: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wire-tap
  namespace: agentgateway-system
data:
  tap.py: |
    import json, time
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class H(BaseHTTPRequestHandler):
        def do_POST(self):
            body = json.loads(self.rfile.read(int(self.headers.get("Content-Length") or 0)) or b"{}")
            text = "\n\n".join(
                m["content"] if isinstance(m.get("content"), str)
                else "".join(p.get("text", "") for p in m.get("content") or [])
                for m in body.get("messages", []) if m.get("role") == "user")
            out = json.dumps({
                "id": "tap", "object": "chat.completion", "created": int(time.time()),
                "model": self.headers.get("x-kernwerk-lane") or "private",
                "choices": [{"index": 0, "finish_reason": "stop",
                             "message": {"role": "assistant", "content": text}}],
                "usage": {"prompt_tokens": 0, "completion_tokens": 0, "total_tokens": 0},
            }).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(out)))
            self.end_headers()
            self.wfile.write(out)

        def log_message(self, *a):
            pass

    HTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wire-tap
  namespace: agentgateway-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: wire-tap}
  template:
    metadata:
      labels: {app: wire-tap}
    spec:
      containers:
      - name: tap
        image: python:3.12-alpine
        command: ["python", "-u", "/app/tap.py"]
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: 10m, memory: 32Mi}
        volumeMounts: [{name: app, mountPath: /app}]
      volumes:
      - name: app
        configMap: {name: wire-tap}
---
apiVersion: v1
kind: Service
metadata:
  name: wire-tap
  namespace: agentgateway-system
spec:
  selector: {app: wire-tap}
  ports: [{port: 8080, targetPort: 8080}]
