# Site daylight MCP: sunrise, sunset, work windows, moon phase. Pure arithmetic,
# no data and nothing it can change, so its AgentRegistry record carries
# mcp.governance/auto-approve=true (see daylight-mcp-registry.yaml).
#
# It still sits behind agentgateway with default deny. "Auto-approve" means
# My agents writes the per-agent allow at deploy time instead of waiting for a
# platform admin. It never means unpoliced.
apiVersion: v1
kind: Namespace
metadata:
  name: mcp-servers
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-daylight
  namespace: mcp-servers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: site-daylight
  template:
    metadata:
      labels:
        app: site-daylight
    spec:
      containers:
      - name: mcp
        image: localhost:5001/daylight-mcp:1
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: site-daylight
  namespace: mcp-servers
spec:
  selector:
    app: site-daylight
  ports:
  - port: 3000
    targetPort: 3000
---
# What agents call. Same waypoint as GitHub, so source.identity is the calling
# agent's ServiceAccount.
apiVersion: v1
kind: Service
metadata:
  name: daylight-mcp
  namespace: kagent
  labels:
    istio.io/use-waypoint: github-mcp-waypoint
spec:
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: daylight-mcp
  namespace: kagent
spec:
  entMcp:
    toolMode: Standard
    sessionRouting: Stateful
    failureMode: FailClosed
    targets:
    - name: daylight
      static:
        host: site-daylight.mcp-servers.svc.cluster.local
        port: 3000
        path: /
        protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: daylight-mcp
  namespace: kagent
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: daylight-mcp
    port: 80
  rules:
  - backendRefs:
    - group: enterpriseagentgateway.solo.io
      kind: EnterpriseAgentgatewayBackend
      name: daylight-mcp
    timeouts:
      request: 60s
