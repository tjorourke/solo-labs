# GitHub hosted MCP, fronted by a dedicated Gateway on mesh1.
# No JWT: the GitHub PAT stays in the gateway Secret. The laptop talks MCP only.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mcp-demo
  namespace: agentgateway-system
spec:
  gatewayClassName: enterprise-agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: github-mcp
  namespace: agentgateway-system
spec:
  policies:
    transformation:
      request:
        set:
          - name: X-MCP-Toolsets
            value: '"all"'
  entMcp:
    toolMode: Standard
    sessionRouting: Stateful
    failureMode: FailClosed
    targets:
      - name: github
        static:
          host: api.githubcopilot.com
          port: 443
          path: /mcp/
          protocol: StreamableHTTP
          policies:
            tls:
              sni: api.githubcopilot.com
            auth:
              secretRef:
                name: github-mcp-pat
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: github-mcp
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: mcp-demo
  rules:
    - backendRefs:
        - group: enterpriseagentgateway.solo.io
          kind: EnterpriseAgentgatewayBackend
          name: github-mcp
      timeouts:
        request: 180s
