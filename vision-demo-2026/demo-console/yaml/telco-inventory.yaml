apiVersion: v1
kind: Namespace
metadata:
  name: mcp-servers
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telco-inventory
  namespace: mcp-servers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telco-inventory
  template:
    metadata:
      labels:
        app: telco-inventory
    spec:
      containers:
      - name: mcp
        image: localhost:5001/telco-inventory:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: telco-inventory
  namespace: mcp-servers
spec:
  selector:
    app: telco-inventory
  ports:
  - port: 3000
    targetPort: 3000
