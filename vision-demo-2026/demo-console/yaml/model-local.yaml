# The model route for My agents, inside mesh1. Agents call
# http://my-agents-model.kagent.svc.cluster.local/v1 in the OpenAI shape with their own
# MCP token as the bearer. The gateway checks the token was signed by the console and
# names the calling pod's own ServiceAccount, then sends the call to Anthropic as
# claude-haiku-4-5 with the key from the my-agents-model-key Secret. The agent never
# holds a provider key, and nothing here leaves for EKS.
#
# Applied by agents_lab.ensure_local_model(), which creates the Secret from
# CORP_API_KEY and fills in __JWKS__ with the public half of the console's MCP key.
apiVersion: v1
kind: Service
metadata:
  name: my-agents-model
  namespace: kagent
  labels:
    istio.io/use-waypoint: my-agents-model-waypoint
spec:
  # No selector: a name for agents to call and something for the waypoint to attach to.
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: my-agents-model-waypoint
  namespace: kagent
spec:
  gatewayClassName: enterprise-agentgateway-waypoint
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: my-agents-model
  namespace: kagent
spec:
  ai:
    provider:
      anthropic:
        model: claude-haiku-4-5
  policies:
    auth:
      secretRef:
        name: my-agents-model-key
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-agents-model
  namespace: kagent
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: my-agents-model
    port: 80
  rules:
  - backendRefs:
    - group: enterpriseagentgateway.solo.io
      kind: EnterpriseAgentgatewayBackend
      name: my-agents-model
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: my-agents-model-authn
  namespace: kagent
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: my-agents-model
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
      - issuer: https://my-agents.lab
        audiences:
        - mcp-gateway
        jwks:
          inline: '__JWKS__'
    authorization:
      action: Allow
      policy:
        matchExpressions:
        - source.identity.namespace == "kagent" && source.identity.serviceAccount == jwt.sub
