# Real, clickable preview URLs for the HITL review step -- no port-forward, same pattern
# notebooks.py's _ingress_url() already uses for the AgentRegistry/kagent UI links.
# LB_PLACEHOLDER is the ar-ingress Gateway's address, substituted at apply time.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: petstore-staging
  namespace: petstore-staging
spec:
  parentRefs: [{ name: ar-ingress, namespace: agentgateway-system }]
  hostnames: ["petstore-staging.LB_PLACEHOLDER.sslip.io"]
  rules:
  - backendRefs:
    - name: petstore
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: petstore-prod
  namespace: petstore-prod
spec:
  parentRefs: [{ name: ar-ingress, namespace: agentgateway-system }]
  hostnames: ["petstore-prod.LB_PLACEHOLDER.sslip.io"]
  rules:
  - backendRefs:
    - name: petstore
      port: 8080
