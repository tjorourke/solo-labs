# The staging copy of demo-petstore. petstore_lab.py rewrites the image tag with
# `kubectl set image` after every dev-bot commit; IMAGE_TAG_PLACEHOLDER here is only the
# very first baseline build applied once during setup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petstore
  namespace: petstore-staging
spec:
  replicas: 1
  selector:
    matchLabels: { app: petstore }
  template:
    metadata:
      labels: { app: petstore }
    spec:
      containers:
      - name: petstore
        image: localhost:5001/demo-petstore:IMAGE_TAG_PLACEHOLDER
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 2
        resources:
          requests: { cpu: 10m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: petstore
  namespace: petstore-staging
spec:
  selector: { app: petstore }
  ports:
  - port: 8080
    targetPort: 8080
