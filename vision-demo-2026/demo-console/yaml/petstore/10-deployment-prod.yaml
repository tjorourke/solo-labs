# The prod copy of demo-petstore. Only ever updated by petstore_lab.py's promote(), which
# sets the image to the exact tag already reviewed in staging -- never a fresh build, so
# what Tom approved is byte-identical to what ships.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petstore
  namespace: petstore-prod
spec:
  replicas: 1
  selector:
    matchLabels: { app: petstore }
  template:
    metadata:
      labels: { app: petstore }
    spec:
      containers:
      - name: petstore
        image: localhost:5001/demo-petstore:IMAGE_TAG_PLACEHOLDER
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 2
        resources:
          requests: { cpu: 10m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: petstore
  namespace: petstore-prod
spec:
  selector: { app: petstore }
  ports:
  - port: 8080
    targetPort: 8080
