<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 320" style="width:100%;max-width:1000px;height:auto" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="740" height="320" rx="10" fill="#f8fafc"/>
  <text x="370" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">One field on the gateway</text>
  <defs>
    <marker id="c1" markerWidth="8" markerHeight="8" refX="6" refY="2.6" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 Z" fill="#94a3b8"/></marker>
    <marker id="c2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>

  <text x="30" y="58" font-size="11.5" font-weight="700" fill="#7f1d1d">Standard</text>
  <rect x="30" y="68" width="96" height="58" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="78" y="94" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">model</text>
  <text x="78" y="112" text-anchor="middle" font-size="9.5" fill="#475569">the agent</text>
  <rect x="330" y="68" width="110" height="58" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="385" y="94" text-anchor="middle" font-size="10.5" font-weight="700" fill="#78350f">gateway</text>
  <text x="385" y="112" text-anchor="middle" font-size="9.5" fill="#92400e">passes through</text>
  <rect x="620" y="68" width="90" height="58" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="665" y="102" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">GitHub</text>

  <line x1="126" y1="80" x2="326" y2="80" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#c1)"/>
  <line x1="126" y1="90" x2="326" y2="90" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#c1)"/>
  <line x1="126" y1="100" x2="326" y2="100" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#c1)"/>
  <line x1="126" y1="110" x2="326" y2="110" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#c1)"/>
  <line x1="126" y1="120" x2="326" y2="120" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#c1)"/>
  <line x1="440" y1="97" x2="616" y2="97" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#c1)"/>
  <text x="226" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">19 round trips</text>
  <text x="226" y="163" text-anchor="middle" font-size="10.5" fill="#991b1b">80,000 bytes cross the model</text>

  <line x1="20" y1="186" x2="720" y2="186" stroke="#cbd5e1"/>

  <text x="30" y="212" font-size="11.5" font-weight="700" fill="#14532d">CodeSearch</text>
  <rect x="30" y="222" width="96" height="58" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="78" y="248" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">model</text>
  <text x="78" y="266" text-anchor="middle" font-size="9.5" fill="#475569">the agent</text>
  <rect x="330" y="210" width="110" height="82" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="385" y="234" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14532d">gateway</text>
  <text x="385" y="252" text-anchor="middle" font-size="9.5" fill="#166534">runs the</text>
  <text x="385" y="268" text-anchor="middle" font-size="9.5" fill="#166534">program</text>
  <rect x="620" y="222" width="90" height="58" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="665" y="256" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">GitHub</text>

  <line x1="126" y1="251" x2="326" y2="251" stroke="#16a34a" stroke-width="1.8" marker-end="url(#c2)"/>
  <text x="226" y="243" text-anchor="middle" font-size="9.5" fill="#166534">one program</text>
  <line x1="440" y1="240" x2="616" y2="240" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#c1)"/>
  <line x1="440" y1="252" x2="616" y2="252" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#c1)"/>
  <line x1="440" y1="264" x2="616" y2="264" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#c1)"/>
  <text x="528" y="286" text-anchor="middle" font-size="9" fill="#475569">18 calls, inside the gateway</text>
  <text x="226" y="303" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">2 round trips, 24 bytes back</text>
</svg>
