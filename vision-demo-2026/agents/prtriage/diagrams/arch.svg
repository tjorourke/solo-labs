<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" style="width:100%;max-width:1000px;height:auto" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="740" height="300" rx="10" fill="#f8fafc"/>
  <text x="370" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">One agent, one GitHub integration, three products</text>
  <defs><marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker></defs>

  <rect x="14" y="96" width="128" height="72" rx="9" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
  <text x="78" y="122" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">developer</text>
  <text x="78" y="140" text-anchor="middle" font-size="10" fill="#475569">arctl</text>
  <text x="78" y="156" text-anchor="middle" font-size="10" fill="#475569">Java + ADK</text>

  <rect x="162" y="96" width="128" height="72" rx="9" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="226" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#312e81">AgentRegistry</text>
  <text x="226" y="138" text-anchor="middle" font-size="10" fill="#4338ca">approved server</text>
  <text x="226" y="154" text-anchor="middle" font-size="10" fill="#4338ca">approved skill</text>

  <rect x="310" y="96" width="128" height="72" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="374" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">kagent</text>
  <text x="374" y="138" text-anchor="middle" font-size="10" fill="#166534">runs the agent</text>
  <text x="374" y="154" text-anchor="middle" font-size="10" fill="#166534">no credential</text>

  <rect x="458" y="96" width="128" height="72" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="522" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#78350f">agentgateway</text>
  <text x="522" y="138" text-anchor="middle" font-size="10" fill="#92400e">waypoint</text>
  <text x="522" y="154" text-anchor="middle" font-size="10" fill="#92400e">holds the token</text>

  <rect x="606" y="96" width="120" height="72" rx="9" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
  <text x="666" y="126" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">GitHub</text>
  <text x="666" y="146" text-anchor="middle" font-size="10" fill="#475569">MCP, 44 tools</text>

  <line x1="142" y1="132" x2="158" y2="132" stroke="#334155" stroke-width="1.8" marker-end="url(#a1)"/>
  <line x1="290" y1="132" x2="306" y2="132" stroke="#334155" stroke-width="1.8" marker-end="url(#a1)"/>
  <line x1="438" y1="132" x2="454" y2="132" stroke="#334155" stroke-width="1.8" marker-end="url(#a1)"/>
  <line x1="586" y1="132" x2="602" y2="132" stroke="#334155" stroke-width="1.8" marker-end="url(#a1)"/>

  <text x="226" y="76" text-anchor="middle" font-size="9.5" fill="#475569">publish + deploy</text>
  <text x="374" y="76" text-anchor="middle" font-size="9.5" fill="#475569">Agent CRD</text>
  <text x="522" y="76" text-anchor="middle" font-size="9.5" fill="#475569">every tool call</text>

  <rect x="310" y="212" width="276" height="54" rx="8" fill="#fff" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="448" y="234" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">the token lives here, not in the agent</text>
  <text x="448" y="252" text-anchor="middle" font-size="10" fill="#475569">and policy decides which tools each agent sees</text>
  <line x1="448" y1="212" x2="500" y2="172" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3"/>
</svg>
