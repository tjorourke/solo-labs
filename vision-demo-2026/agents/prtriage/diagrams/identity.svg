<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 322" style="width:100%;max-width:1000px;height:auto" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="740" height="322" rx="10" fill="#f8fafc"/>
  <text x="370" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Same integration. Different permissions.</text>
  <defs>
    <marker id="d1" markerWidth="8" markerHeight="8" refX="6" refY="2.6" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 Z" fill="#64748b"/></marker>
    <marker id="d2" markerWidth="8" markerHeight="8" refX="6" refY="2.6" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 Z" fill="#16a34a"/></marker>
  </defs>

  <rect x="252" y="62" width="132" height="212" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="318" y="86" text-anchor="middle" font-size="11.5" font-weight="700" fill="#78350f">agentgateway</text>
  <text x="318" y="103" text-anchor="middle" font-size="9.5" fill="#92400e">waypoint</text>
  <text x="318" y="128" text-anchor="middle" font-size="9" fill="#92400e">reads the caller's</text>
  <text x="318" y="142" text-anchor="middle" font-size="9" fill="#92400e">SPIFFE identity</text>
  <text x="318" y="166" text-anchor="middle" font-size="9" fill="#92400e">one token</text>
  <text x="318" y="180" text-anchor="middle" font-size="9" fill="#92400e">one policy</text>

  <rect x="20" y="66" width="132" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="86" y="88" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14532d">triage agent</text>
  <text x="86" y="105" text-anchor="middle" font-size="9" fill="#166534">sa: prtriagejava</text>

  <rect x="20" y="142" width="132" height="52" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="86" y="164" text-anchor="middle" font-size="10.5" font-weight="700" fill="#312e81">release agent</text>
  <text x="86" y="181" text-anchor="middle" font-size="9" fill="#4338ca">sa: releasejava</text>

  <rect x="20" y="218" width="132" height="52" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="86" y="240" text-anchor="middle" font-size="10.5" font-weight="700" fill="#475569">another workload</text>
  <text x="86" y="257" text-anchor="middle" font-size="9" fill="#64748b">not in the policy</text>

  <line x1="152" y1="92" x2="248" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#d1)"/>
  <line x1="152" y1="168" x2="248" y2="168" stroke="#64748b" stroke-width="1.5" marker-end="url(#d1)"/>
  <line x1="152" y1="244" x2="248" y2="216" stroke="#64748b" stroke-width="1.5" marker-end="url(#d1)"/>

  <rect x="412" y="66" width="176" height="52" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.4"/>
  <text x="500" y="86" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">reads pull requests</text>
  <text x="500" y="104" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">merge tool hidden</text>

  <rect x="412" y="142" width="176" height="52" rx="8" fill="#fff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="500" y="162" text-anchor="middle" font-size="10" font-weight="700" fill="#312e81">reads pull requests</text>
  <text x="500" y="180" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">merge tool visible</text>

  <rect x="412" y="218" width="176" height="52" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="500" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">nothing at all</text>

  <line x1="384" y1="92" x2="408" y2="92" stroke="#16a34a" stroke-width="1.5" marker-end="url(#d2)"/>
  <line x1="384" y1="168" x2="408" y2="168" stroke="#16a34a" stroke-width="1.5" marker-end="url(#d2)"/>
  <line x1="384" y1="244" x2="408" y2="244" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#d1)"/>

  <text x="370" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">The GitHub token at the gateway is the same one throughout, and can do all of it.</text>
</svg>
