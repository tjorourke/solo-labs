# The agent's OTHER way out: the model.
#
# Tool calls already go through a gateway. The model call did not: the agent talked
# straight to api.anthropic.com, which meant it had a route to the internet, which meant
# "the only way out is the gateway" was a claim the lab did not back up. It does now, in
# the same shape as the GitHub route: an in-cluster name, a waypoint, a static backend.
#
# The agent still carries its own model key. Moving that to the gateway is a separate
# job; this one is about the route.
apiVersion: v1
kind: Service
metadata:
  name: anthropic
  namespace: kagent
  labels:
    istio.io/use-waypoint: model-waypoint
spec:
  # No selector, like github-mcp: a name for agents to call and something for the
  # waypoint to attach to. Nothing behind it but the gateway.
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: model-waypoint
  namespace: kagent
spec:
  gatewayClassName: enterprise-agentgateway-waypoint
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: anthropic
  namespace: kagent
spec:
  static:
    host: api.anthropic.com
    port: 443
  policies:
    tls:
      sni: api.anthropic.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: anthropic
  namespace: kagent
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: anthropic
    port: 80
  rules:
  - backendRefs:
    - group: enterpriseagentgateway.solo.io
      kind: EnterpriseAgentgatewayBackend
      name: anthropic
