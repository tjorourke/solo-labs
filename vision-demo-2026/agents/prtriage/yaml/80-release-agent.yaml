# The second identity. Same image, same catalogue entry, same skill. The only thing
# that differs is who it is, and the gateway gives it a different set of tools for it.
apiVersion: ar.dev/v1alpha1
kind: Agent
metadata:
  name: releasejava
spec:
  description: Release agent. Reads pull requests and may merge them.
  mcpServers:
  - kind: MCPServer
    name: github-mcp
    tag: latest
  modelName: claude-haiku-4-5
  modelProvider: anthropic
  source:
    image: localhost:5001/prtriage-java:latest
---
apiVersion: ar.dev/v1alpha1
kind: Deployment
metadata:
  name: releasejava
spec:
  targetRef:  { kind: Agent,   name: releasejava }
  runtimeRef: { kind: Runtime, name: kind-kagent }
  env:
    SERVE: "true"
    PORT: "8080"
    # The egress policy covers every agent it names, so each of them needs the model
    # route too. Miss one and it dies with "Network is unreachable" the first time it
    # thinks, which looks like the gateway refusing it and is not.
    ANTHROPIC_BASE_URL: "http://anthropic.kagent.svc.cluster.local"
