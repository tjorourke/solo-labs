# A third agent, and the point of it is that it does not work.
#
# Another team's agent, for writing release notes. It wants exactly the same data as
# the triage agent, and it has been wired to the same approved GitHub server in the
# catalogue, so nothing about its deployment looks wrong. What it does not have is a
# clause in the gateway's policy naming it.
#
# That split is the demo: AgentRegistry decides what an agent may be WIRED to, and the
# gateway decides what it may CALL. Being in the catalogue is not permission.
apiVersion: ar.dev/v1alpha1
kind: Agent
metadata:
  name: changelogjava
spec:
  description: Changelog agent. Another team's, and not named in the gateway policy.
  mcpServers:
  - kind: MCPServer
    name: github-mcp
    tag: latest
  modelName: claude-haiku-4-5
  modelProvider: anthropic
  source:
    image: localhost:5001/prtriage-java:latest
---
apiVersion: ar.dev/v1alpha1
kind: Deployment
metadata:
  name: changelogjava
spec:
  targetRef:  { kind: Agent,   name: changelogjava }
  runtimeRef: { kind: Runtime, name: kind-kagent }
  env:
    SERVE: "true"
    PORT: "8080"
    # The egress policy covers every agent it names, so each of them needs the model
    # route too. Miss one and it dies with "Network is unreachable" the first time it
    # thinks, which looks like the gateway refusing it and is not.
    ANTHROPIC_BASE_URL: "http://anthropic.kagent.svc.cluster.local"
