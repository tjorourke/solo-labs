# Close the published listener. The waypoint checks a workload's SPIFFE identity, which a
# human at a laptop does not have, so the published route needs a different proof: a token.
#
# Without this the route answers an unauthenticated MCP initialize with 200, and anything that
# can reach the address - including an agent in this cluster that the egress policy does not
# cover - gets a session and the GitHub credential behind it. The per-agent policy lives on the
# waypoint and does nothing for a route published beside it.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: github-mcp-ingress-auth
  namespace: agentgateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: github-mcp
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
      - issuer: http://keycloak.192.168.97.144.sslip.io/realms/agentregistry
