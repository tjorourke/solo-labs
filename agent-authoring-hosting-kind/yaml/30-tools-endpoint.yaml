# A tool endpoint for one agent.
#
# Same shape as Part 1's sre-tools: a Service with no pods, a waypoint, an MCP backend
# forwarding to kagent-tools, and a GAMMA route. The difference is who may call it:
# 40-tools-policy.yaml allows the designated agent and controller service accounts.
# The catalogue entry points at this Service; 80-tools-authz.yaml separately blocks
# these agents from reaching the upstream tool server directly.
apiVersion: v1
kind: Service
metadata:
  name: contained-tools
  namespace: kagent
  labels:
    istio.io/use-waypoint: contained-tools-waypoint
spec:
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: contained-tools-waypoint
  namespace: kagent
spec:
  gatewayClassName: enterprise-agentgateway-waypoint
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: contained-tools
  namespace: kagent
spec:
  entMcp:
    toolMode: Standard
    sessionRouting: Stateful
    failureMode: FailClosed
    targets:
    - name: kagent-tools
      static:
        host: kagent-tools.kagent.svc.cluster.local
        port: 8084
        path: /mcp
        protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: contained-tools
  namespace: kagent
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: contained-tools
    port: 80
  rules:
  - backendRefs:
    - group: enterpriseagentgateway.solo.io
      kind: EnterpriseAgentgatewayBackend
      name: contained-tools
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: contained-tools
  namespace: kagent
spec:
  description: Kubernetes read tools for the sre-contained agent, via its own agentgateway waypoint
  protocol: STREAMABLE_HTTP
  url: http://contained-tools.kagent.svc.cluster.local/mcp
  timeout: 30s
  sseReadTimeout: 5m0s
  terminateOnClose: true
