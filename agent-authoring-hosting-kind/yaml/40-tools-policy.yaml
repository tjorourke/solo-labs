# Allow the designated agent service account and the controller in kagent.
# Pods sharing a namespace and service account share this workload identity.
# The controller uses the allowlist for discovery and also has these tool grants.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: contained-tools-one-agent
  namespace: kagent
spec:
  targetRefs:
  - group: enterpriseagentgateway.solo.io
    kind: EnterpriseAgentgatewayBackend
    name: contained-tools
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
          - >-
            source.identity.namespace == "kagent"
            && source.identity.serviceAccount in ["sre-contained", "kagent-controller"]
            && mcp.tool.name in
              ["k8s_get_resources", "k8s_describe_resource", "k8s_get_pod_logs", "k8s_get_events"]
