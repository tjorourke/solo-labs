# Agent to agent, by policy.
#
# sre-caller has no Kubernetes tools. Its one tool is another agent: a tools[].type: Agent
# reference to sre-contained, which kagent turns into an A2A call. The AccessPolicy below
# grants that call to sre-caller in kagent. Other callers have no grant in this policy. The
# policy is enforced at sre-contained's own waypoint on the caller's mesh identity, so
# sre-other in 55-other-agent.yaml, which carries the same tools[] reference, is refused.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: sre-caller
  namespace: kagent
spec:
  type: Declarative
  description: On-call front door. Delegates namespace triage to sre-contained over A2A and returns its report.
  declarative:
    modelConfig: sre-model
    systemMessage: |
      You are the on-call front door for a platform team. You have no Kubernetes tools of
      your own. When asked about a namespace, hand the question to the sre-contained agent
      exactly as asked, wait for its report, and return that report unchanged with one
      line at the top saying it came from sre-contained. If the delegation fails, say so
      in one line, quoting the error, and stop.
    tools:
    - type: Agent
      agent:
        name: sre-contained
---
apiVersion: policy.kagent-enterprise.solo.io/v1alpha1
kind: AccessPolicy
metadata:
  name: sre-contained-callers
  namespace: kagent
spec:
  action: ALLOW
  from:
    subjects:
    - kind: Agent
      name: sre-caller
      namespace: kagent
  targetRef:
    kind: Agent
    name: sre-contained
