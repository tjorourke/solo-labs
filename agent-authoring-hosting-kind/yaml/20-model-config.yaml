# A ModelConfig whose base URL is the model waypoint. A declarative agent that
# references it never opens a connection to api.anthropic.com itself. The key stays in
# the same Secret the default config uses.
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: sre-model
  namespace: kagent
spec:
  provider: Anthropic
  model: claude-haiku-4-5
  apiKeySecret: kagent-anthropic
  apiKeySecretKey: ANTHROPIC_API_KEY
  anthropic:
    baseUrl: http://sre-model.kagent.svc.cluster.local
