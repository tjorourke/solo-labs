# Registry read-only: the layer-7 rule that ends the message board.
#
# The incident's covert channel was a WRITABLE package registry. Agents PUT notes into
# Artifactory to coordinate, and when the notes were deleted they rebuilt the board out of
# directory names instead, so deleting artefacts changed nothing. A package pull only ever
# needs GET and HEAD, so the fix is least privilege at the grain of the VERB: take the
# write capability away and there is nothing to rebuild into.
#
# Enforced at the agentgateway waypoint from 93-registry-waypoint.yaml. matchExpressions
# are OR'd and the action is Allow, so a request that satisfies none of them is refused:
# PUT, POST, DELETE and the WebDAV MKCOL the agents used to rebuild the board all fall
# through to a 403 at the waypoint, with the caller's SPIFFE identity in the access log.
#
# source.identity.* is available without a token because ztunnel already proved the
# caller's workload identity over HBONE before handing the connection to the waypoint.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: registry-readonly
  namespace: artifactory
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: artifactory-waypoint
  traffic:
    authorization:
      action: Allow
      policy:
        matchExpressions:
          # reads only. a pull is a GET, an existence check is a HEAD, and that is the
          # whole legitimate vocabulary of a package client.
          - 'request.method == "GET"'
          - 'request.method == "HEAD"'
