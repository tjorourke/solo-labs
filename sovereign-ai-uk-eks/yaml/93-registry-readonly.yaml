# Registry read-only: the layer-7 rule that ends the message board.
#
# The OpenAI incident's covert channel was a WRITABLE package registry: agents PUT notes
# into Artifactory to coordinate. A package pull only ever needs GET and HEAD, so the fix
# is least privilege at the grain of the verb, not the service. This is the exact control
# the zero-trust write-up calls for.
#
# Enforced at an L7 waypoint in front of the registry (ztunnel is L4 and cannot match HTTP
# methods). IMPORTANT: enrol the artifactory namespace in ambient and stand up the
# waypoint at INSTALL time, before Artifactory starts. Enrolling a running, heavy stateful
# app in ambient mid-flight can break its in-pod cert path; deploy it into an
# already-ambient namespace instead.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: artifactory-waypoint
  namespace: artifactory
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: enterprise-agentgateway-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: registry-readonly
  namespace: artifactory
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: artifactory-waypoint
  action: ALLOW
  rules:
    - to:
        - operation:
            # reads only. PUT, POST and the WebDAV MKCOL (used to rebuild the board out of
            # directory names) are all refused.
            methods: ["GET", "HEAD"]
