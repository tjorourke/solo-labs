# Default-deny egress, the posture the whole lab assumes.
#
# Kubernetes egress is default-ALLOW: a namespace can reach the internet unless a
# NetworkPolicy says otherwise. So a namespace you forget to lock down is an open door,
# and the SSRF story is exactly what happens when one workload keeps that door open. The
# fix is to make deny the default and allow the exceptions, not the other way round.
#
# Each workload namespace gets a baseline that permits only DNS, traffic inside its own
# namespace, and the gateway. Nothing reaches the internet directly. The one component
# that does reach out is agentgateway, the sanctioned egress broker, which is deliberately
# NOT given a deny policy.
#
# ONLY THE NON-AMBIENT NAMESPACES ARE LISTED HERE, and that is deliberate. On this cluster
# the CNI is AWS VPC CNI, which enforces NetworkPolicy at the pod veth. An ambient-enrolled
# pod has its egress re-originated out of ztunnel, past that veth hook, so a k8s NetworkPolicy
# is a silent no-op for it. models, kagent and keycloak are ambient, so a NetworkPolicy in
# those namespaces would enforce nothing and only mislead; their egress is sealed instead by
# the mesh (the egress waypoint blocks the hosted-LLM providers, yaml/48; the model's L4
# authorization admits only the gateway, yaml/33) and, at the network layer, by the Route 53
# Resolver DNS firewall (scripts/dns.sh) and the VPC's single NAT. The namespaces below
# (default, internal, mcp-tools, and the agents namespace via yaml/70) are NOT ambient, so
# here NetworkPolicy is a real, enforced control.
#
# Control-plane namespaces (kube-system, istio-system, cert-manager, vault, monitoring) are
# left to their own policies: they have their own egress needs (Vault reaches AWS KMS to
# auto-unseal, for one) and locking them here would break the platform.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: default
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to: [{ podSelector: {} }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: agentgateway-system } }
      ports: [{ protocol: TCP, port: 443 }, { protocol: TCP, port: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: internal
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to: [{ podSelector: {} }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: agentgateway-system } }
      ports: [{ protocol: TCP, port: 443 }, { protocol: TCP, port: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  # mcp-tools is NOT ambient, so this genuinely enforces: the tool server may reach DNS, its
  # own namespace and the gateway, and nothing else on the internet directly.
  name: default-deny-egress
  namespace: mcp-tools
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to: [{ podSelector: {} }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: agentgateway-system } }
      ports: [{ protocol: TCP, port: 443 }, { protocol: TCP, port: 80 }]
