# Vault is the secrets store, not only the mesh CA.
#
# The application secrets in this cluster used to be plain Kubernetes Secrets, base64 in
# etcd. This leases them from the same Vault that signs every workload identity, and
# delivers them as a read-only file through the Secrets Store CSI driver, never an env var.
# That is the same root of trust, the same in-region KMS story, extended from the CA to the
# credentials, and it is exactly what the disallow-secrets-in-env Kyverno rule asks for:
# the rule says "mount secrets as files", this is the thing that provides the file.
#
# CSI driver, not the Vault Agent Injector, on purpose: the injector adds a per-pod sidecar,
# which fights the ambient "no per-pod injection" model the rest of this build relies on.
# CSI mounts a file with no sidecar, so it fits the mesh and the admission rule both.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-demo
  namespace: apps
automountServiceAccountToken: true   # needs its SA token to authenticate to Vault
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ar-secrets
  namespace: apps
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.vault.svc:8200"
    vaultCACertPath: "/vault/tls/ca.crt"   # the provider verifies Vault's TLS, no skip-verify
    roleName: "ar-secrets-reader"          # Vault k8s-auth role, scoped to this SA + read-only policy
    objects: |
      - objectName: "oidcClientSecret"
        secretPath: "secret/data/agentregistry"
        secretKey: "oidcClientSecret"
