# Model ingress lock: only the gateway's identity may reach the model.
#
# This was a plain L3 NetworkPolicy, and in the ambient mesh that is a footgun: a
# NetworkPolicy that admits only the agentgateway namespace also blocks the kubelet's
# health probe, which comes from the node and not from any namespace, so vLLM never
# passes its readiness probe and the model looks broken. The connection simply times out
# with nothing pointing at the policy.
#
# The correct layer is the mesh. This is an Istio AuthorizationPolicy enforced by ztunnel
# at L4: it allows connections to the model ONLY from the gateway's SPIFFE identity, and
# istio-cni rewrites the kubelet health probe to bypass the mesh, so the probe is never
# subject to it. Identity, not IP, and no probe breakage.
#
# The model is protected by three things together: it has no external route (only the
# gateway's HTTPRoute reaches it), the gateway enforces JWT, and this policy means even
# in-cluster, only the gateway's identity is admitted.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: models-gateway-only
  namespace: models
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            # the sovereign-gateway data plane's identity, from the Vault-signed SPIFFE
            # cert (spiffe://cluster.local/ns/agentgateway-system/sa/sovereign-gateway).
            principals:
              - "cluster.local/ns/agentgateway-system/sa/sovereign-gateway"
