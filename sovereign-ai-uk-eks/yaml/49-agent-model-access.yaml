# How an in-cluster agent reaches the model, without a bearer token it would have to mint,
# expire and refresh — and without opening a second, unauthenticated door to the internet.
#
# External callers reach the model through the NLB on the public gateway's :443 edge-TLS
# door, where jwt-auth is Strict (yaml/32). An in-cluster agent is a mesh workload; it should
# be let in by being in-cluster, not by carrying a human's Keycloak token.
#
# THE TRAP THIS AVOIDS. The obvious way to give the agent a tokenless path is a second route
# on the PUBLIC gateway's :80 listener with a Permissive JWT, restricted to in-cluster source
# IPs. That is bypassable from the internet: the public Service is externalTrafficPolicy:
# Cluster, so the node SNATs an external client to a node IP inside the pod/node CIDR before
# the packet reaches ztunnel. An IP allowlist keyed on that CIDR therefore matches the
# attacker too, and anyone who knows the internal Service name reaches the model with no
# token. The fix is not a better IP rule; it is to not put the route on a public Service at
# all.
#
# So the internal route lives on its OWN agentgateway Gateway whose backing Service is
# ClusterIP (no ELB, no public IP), created via EnterpriseAgentgatewayParameters below. It is
# reachable only from inside the cluster, so it is fail-closed by construction — there is no
# external path to bypass. The agent targets this gateway's in-cluster Service name; the
# public :443 model door is untouched and still Strict.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayParameters
metadata:
  name: sovereign-gateway-internal-params
  namespace: agentgateway-system
spec:
  # The agentgateway controller owns the Gateway's Service; this is the supported way to set
  # its type. ClusterIP means no AWS load balancer is created, so the gateway has no public
  # address at all.
  service:
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sovereign-gateway-internal
  namespace: agentgateway-system
spec:
  gatewayClassName: enterprise-agentgateway
  infrastructure:
    parametersRef:
      group: enterpriseagentgateway.solo.io
      kind: EnterpriseAgentgatewayParameters
      name: sovereign-gateway-internal-params
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        # Only routes from this namespace may attach; the internal model route is the only one.
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm-mistral-internal
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: sovereign-gateway-internal
      sectionName: http
  hostnames:
    # The internal gateway's own in-cluster Service name; this is what the agent calls.
    - sovereign-gateway-internal.agentgateway-system.svc.cluster.local
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: vllm-mistral
          group: enterpriseagentgateway.solo.io
          kind: EnterpriseAgentgatewayBackend
---
# Permissive on this route: the agent's in-cluster call carries no token and is allowed
# through, while a token, if present, is still validated. It is safe because the gateway this
# route lives on is ClusterIP and therefore unreachable from outside the cluster.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: agent-model-access
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: vllm-mistral-internal
  traffic:
    jwtAuthentication:
      mode: Permissive
      providers:
        - issuer: "https://keycloak.sovereign.local/realms/sovereign"
          audiences: ["sovereign-ai"]
          jwks:
            remote:
              jwksPath: "/realms/sovereign/protocol/openid-connect/certs"
              cacheDuration: "5m"
              backendRef:
                group: ""
                kind: Service
                name: keycloak
                namespace: keycloak
                port: 80
