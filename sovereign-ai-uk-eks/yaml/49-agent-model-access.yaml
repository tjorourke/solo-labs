# How an in-cluster agent reaches the model, without a bearer token it would have to mint,
# expire and refresh.
#
# External callers reach the model through the NLB on the :443 edge-TLS door, where jwt-auth
# is Strict (yaml/32). An in-cluster agent is a mesh workload; it should be let in by being
# in-cluster, not by carrying a human's Keycloak token. This adds a second, in-cluster-only
# route to the same vLLM backend on the gateway's :80 listener, matched by the gateway's own
# Service FQDN (which the sovereign-analyst agent already targets, so no agent change and no
# token: SOVEREIGN_MODEL_TOKEN stays unset).
#
# Why the restriction is at L4, not by SPIFFE at L7: in ambient, ztunnel terminates the HBONE
# mTLS before the gateway's own listener sees it, so the peer's SPIFFE identity is NOT present
# in the gateway's L7 authorization context (source.identity is empty). Measured: an
# authorization policy keyed on source.identity denies even the agent. The workable enforcement
# is the Istio AuthorizationPolicy below, enforced by ztunnel at L4: it denies the gateway's
# :80 from any source outside the cluster pod/node network, so an external caller cannot reach
# this route through the NLB even with the right Host header, while in-cluster workloads can.
# The :443 model door is untouched and still Strict.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm-mistral-internal
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: sovereign-gateway
      sectionName: http
  hostnames:
    # The gateway's own in-cluster Service name. A hostname-specific route on :80 wins over
    # the catch-all http-to-https redirect, so the agent's plaintext in-mesh call is routed
    # to the model instead of bounced to the edge-TLS door.
    - sovereign-gateway.agentgateway-system.svc.cluster.local
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: vllm-mistral
          group: enterpriseagentgateway.solo.io
          kind: EnterpriseAgentgatewayBackend
---
# Permissive on this route only: it overrides the gateway-wide Strict so the agent's tokenless
# call is allowed through. It stays safe because the AuthorizationPolicy below already limits
# this route to in-cluster sources.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: agent-model-access
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: vllm-mistral-internal
  traffic:
    jwtAuthentication:
      mode: Permissive
      providers:
        - issuer: "https://keycloak.sovereign.local/realms/sovereign"
          audiences: ["sovereign-ai"]
          jwks:
            remote:
              jwksPath: "/realms/sovereign/protocol/openid-connect/certs"
              cacheDuration: "5m"
              backendRef:
                group: ""
                kind: Service
                name: keycloak
                namespace: keycloak
                port: 80
---
# The L4 seal: ztunnel denies the gateway's :80 listener to any source outside the cluster
# network, so the in-cluster model route above is unreachable from the NLB / the internet.
# In-cluster workloads (the agent) are unaffected; the :443 door is on a different port.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-internal-route-inmesh-only
  namespace: agentgateway-system
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: sovereign-gateway
  action: DENY
  rules:
    - to:
        - operation:
            ports: ["80"]
      from:
        - source:
            notIpBlocks: ["10.0.0.0/8"]
