# ServiceAccount hardening: lock the default SA, and make the automount default hold.
#
# Framing first, because it changes what the real gap is. On Kubernetes 1.34 the auto-mounted
# token is already a bound, roughly one-hour, kubelet-rotated projected token scoped to the
# API-server audience. The legacy non-expiring Secret-based token is not auto-created any
# more, so "the default token lives forever" is not the live gap. The live gaps are narrower:
#   1. the default ServiceAccount, the one nobody names, is still mountable, and
#   2. the pod-level automount default (disable-token-automount, 40-policies.yaml) uses +(),
#      so it only sets the field when absent; a pod can set automountServiceAccountToken: true
#      and win.
# These two rules close both. A workload that genuinely calls an API should carry its own
# scoped ServiceAccount and mount a projected token bound to a NAMED audience with a short
# expiry, so a token minted for one callee is useless at another. The pattern is at the foot
# of this file. (On the AWS-scoped side, EKS Pod Identity is the current successor to IRSA;
# IRSA is fine to keep and is what this lab uses.)
---
# The default SA in every workload namespace is set non-mountable. A pod that never names a
# ServiceAccount falls back to default, so making default non-mountable means "no SA named"
# also means "no API token". mutateExistingOnPolicyUpdate re-patches the default SAs that
# already exist, not only ones created later.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: lock-default-serviceaccount
spec:
  rules:
    - name: default-sa-no-automount
      match:
        any:
          - resources:
              kinds: [ServiceAccount]
              names: [default]
              namespaces: [models, apps, agents, keycloak, agentgateway-system, kagent, mcp-tools, internal]
      mutate:
        patchStrategicMerge:
          automountServiceAccountToken: false
---
# Harden the pod-level default into a check. disable-token-automount sets automount:false
# only when the field is absent; this reports any pod that instead sets it to true, so an
# override is visible rather than silent. Audited, not enforced, because a couple of the
# platform's own pods legitimately request a token (the Vault-auth demo, kagent's chart);
# flip to Enforce with an allowlist once those are pinned to projected-token volumes.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: report-explicit-automount
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: automount-true-is-reported
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [models, apps, agents, keycloak, agentgateway-system, kagent, mcp-tools, internal]
      validate:
        message: "This pod sets automountServiceAccountToken: true. Prefer a scoped ServiceAccount with a projected token bound to a named audience over a blanket API token."
        pattern:
          spec:
            =(automountServiceAccountToken): "false"
# ---
# The pattern a workload that DOES call an API should use: its own ServiceAccount, and a
# projected token bound to one audience with a short expiry, so a token for callee A is
# refused at callee B. Not a policy, the shape to copy:
#
#   volumes:
#     - name: sa-token
#       projected:
#         sources:
#           - serviceAccountToken:
#               audience: agent-api        # valid only against this one callee
#               expirationSeconds: 3600
#               path: token
