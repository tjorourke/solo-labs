# Egress control for the ambient namespaces, at the mesh layer, for attribution.
#
# CORRECTED 2026-09-07. This file used to say that a NetworkPolicy "cannot do it here",
# on the grounds that ambient re-originates a pod's traffic from ztunnel so it never
# crosses the veth where the VPC CNI policy agent hooks. That is wrong, and the claim
# behind it ("measured, a vLLM pod CAN reach api.openai.com even with a default-deny
# NetworkPolicy in place") was measured the wrong way. Re-measured on this cluster with a
# real HTTPS fetch rather than a bare TCP connect:
#
#   models (ambient), no NetworkPolicy       -> reached api.github.com, 1216 bytes
#   models (ambient), default-deny egress    -> Connection reset by peer
#
# So NetworkPolicy DOES contain ambient egress here. The trap that produces the wrong
# answer is worth knowing, because it is easy to fall into twice: in ambient a TCP connect
# always succeeds, since it is ztunnel on the same node that accepts it. The drop only
# appears once bytes have to reach the real destination. Any egress claim proved with
# connect() alone is proving nothing.
#
# The egress waypoint is still worth having, for three reasons that survive the
# correction. It decides by identity rather than by IP, so the deny names the workload
# that tried. It logs, where a NetworkPolicy drop is a silent reset. And it does not depend
# on the CNI supporting NetworkPolicy at all, which on EKS is a cluster-wide setting
# someone can turn off. Defence in depth, with the network layer doing the enforcing and
# this layer saying who.
#
# DNS capture (already on: AMBIENT_DNS_CAPTURE=true) sends an enmeshed pod's outbound
# traffic to the waypoint, and an AuthorizationPolicy on the waypoint decides allow or
# deny. The ambient workloads here need no external egress at all (an agent reaches the
# model through the in-cluster gateway, which is in-mesh, not out over the internet), so
# the policy is a clean default-deny with no ServiceEntry exceptions.
apiVersion: v1
kind: Namespace
metadata:
  name: istio-egress
  labels:
    istio.io/use-waypoint: egress-waypoint
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: egress-waypoint
  namespace: istio-egress
  labels:
    # A service-scoped waypoint: it fronts ServiceEntry/Service destinations, which is what
    # egress traffic resolves to once DNS capture and IP autoallocation place an external
    # host in the registry.
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
---
# The external LLM providers, declared as mesh services so an enmeshed pod's traffic to them
# is captured through the egress waypoint (DNS capture resolves each host to an auto-allocated
# VIP, which routes via the waypoint). Declaring them is what lets the AuthorizationPolicy
# below see and deny the traffic; without a ServiceEntry the host is not in the registry and
# ztunnel would pass it straight through. This is the sovereignty claim made enforceable at
# the mesh layer: a self-hosted model and its agents have no path to a hosted LLM.
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata: { name: ext-llm-providers, namespace: istio-egress }
spec:
  hosts:
    - api.openai.com
    - api.anthropic.com
    - generativelanguage.googleapis.com
  ports:
    - { number: 443, name: tls, protocol: TLS }
  resolution: DNS
---
# Default-deny at the egress waypoint. targetRefs to the Gateway is mandatory: an
# AuthorizationPolicy WITH a targetRef is enforced at the waypoint (L7); one without a
# targetRef is pushed to ztunnel and silently reduced to L4 (host/path rules stripped). So
# every captured external-LLM connection from an enmeshed pod is denied here. In-cluster
# traffic (an agent reaching the gateway) never touches this waypoint and is unaffected.
# This is the mesh-layer half of egress control; the Route 53 DNS Firewall (scripts/dns.sh)
# is the network-layer half, together a defence-in-depth seal that NetworkPolicy cannot
# provide for ambient namespaces.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: egress-default-deny, namespace: istio-egress }
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: egress-waypoint
  action: DENY
  rules:
    - {}
