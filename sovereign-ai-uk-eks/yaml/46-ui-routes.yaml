# The Enterprise product consoles, each on its own hostname through the one gateway.
#
# The security standard for this build is that every UI gets its own DNS name and is
# reached through the gateway, never a kubectl port-forward. These HTTPRoutes attach the
# Enterprise consoles to the same sovereign-gateway that fronts the model, so a console is
# behind the same door, the same TLS and the same audit path as everything else. The
# gateway terminates TLS (the *.sovereign.local edge cert) and proxies to each in-cluster
# Service.
#
# Two consoles here. The unified Solo Enterprise console (solo-enterprise-ui, from the
# management chart) carries both the kagent agent views AND the agentgateway traffic /
# distributed-trace / cost views, so it answers on BOTH kagent.sovereign.local and
# age.sovereign.local. The OSS kagent chat UI is deliberately not deployed (kagent.sh sets
# ui.enabled=false); the Enterprise experience is this console. agentregistry has its own
# Enterprise UI on registry.sovereign.local.
#
# Login is OIDC to the sovereign Keycloak realm, the same realm the model and the APIs use,
# so a console is not a second identity system bolted on the side.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentregistry-ui
  namespace: agentregistry
spec:
  parentRefs:
    - name: sovereign-gateway
      namespace: agentgateway-system
      # Pin to the *.sovereign.local SNI listener only. Without this the route also binds
      # to the catch-all https listener (the model door), and a browser coalescing HTTP/2
      # connections across the console hostnames gets a 421 Misdirected Request.
      sectionName: https-sovereign-local
  hostnames:
    - registry.sovereign.local
  rules:
    - backendRefs:
        - name: agentregistry-enterprise-server
          port: 12121
---
# The agentgateway Enterprise console (the /age observability + cost UI), served by the
# management plane's solo-enterprise-ui Service. This is where the gateway's own traffic,
# distributed traces (OTel -> the collector -> ClickHouse) and cost views live.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-console
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: sovereign-gateway
      namespace: agentgateway-system
      # Pin to the *.sovereign.local SNI listener only. Without this the route also binds
      # to the catch-all https listener (the model door), and a browser coalescing HTTP/2
      # connections across the console hostnames gets a 421 Misdirected Request.
      sectionName: https-sovereign-local
  hostnames:
    # The unified Solo Enterprise console answers on both: age for the agentgateway view,
    # kagent for the agent view. Same solo-enterprise-ui behind both.
    - age.sovereign.local
    - kagent.sovereign.local
  rules:
    - backendRefs:
        - name: solo-enterprise-ui
          port: 80
---
# Keycloak on its own hostname through the gateway, so a browser can complete the OIDC
# login the consoles redirect to. The frontend issuer becomes https://keycloak.sovereign.local
# (KC_HOSTNAME, yaml/37-keycloak.yaml); the gateway terminates TLS with the *.sovereign.local
# cert and forwards to Keycloak's plaintext Service. In-cluster callers reach the same name
# via a CoreDNS rewrite to the gateway, so nothing leaves the cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  parentRefs:
    - name: sovereign-gateway
      namespace: agentgateway-system
      # Pin to the *.sovereign.local SNI listener only. Without this the route also binds
      # to the catch-all https listener (the model door), and a browser coalescing HTTP/2
      # connections across the console hostnames gets a 421 Misdirected Request.
      sectionName: https-sovereign-local
  hostnames:
    - keycloak.sovereign.local
  rules:
    - backendRefs:
        - name: keycloak
          port: 80
