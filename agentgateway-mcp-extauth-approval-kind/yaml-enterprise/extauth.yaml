apiVersion: apps/v1
kind: Deployment
metadata:
  name: hitl-extauth
  namespace: mcp-extauth-demo
  labels: { app: hitl-extauth }
spec:
  replicas: 1   # in-memory queue; multi-replica would need Redis
  selector:
    matchLabels: { app: hitl-extauth }
  template:
    metadata:
      labels: { app: hitl-extauth }
    spec:
      containers:
        - name: extauth
          image: hitl-extauth-sts-hitl-part2:dev
          imagePullPolicy: IfNotPresent
          env:
            # Solo STS: tokens minted for an agent acting for a user (user + agent).
            - { name: DELEGATED_ISSUER, value: "enterprise-agentgateway.agentgateway-system.svc.cluster.local:7777" }
            # Keycloak: a user's own sign-in token (user only, no agent).
            - { name: USER_ISSUER,      value: "http://keycloak.keycloak.svc.cluster.local:8080/realms/hitl-part2" }
            - { name: GRPC_PORT,        value: "9001" }
            - { name: HTTP_PORT,        value: "8081" }
            - { name: PARK_TIMEOUT_SEC, value: "600" }
            - { name: POLICY_PATH,      value: "/etc/hitl/policy.yaml" }
          ports:
            - { containerPort: 9001, name: grpc }
            - { containerPort: 8081, name: http }
          volumeMounts:
            - name: policy
              mountPath: /etc/hitl
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8081 }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            periodSeconds: 10
      volumes:
        - name: policy
          configMap:
            name: hitl-tool-policy
---
# gRPC service consumed by agentgateway. appProtocol:h2c lets agentgateway use
# HTTP/2 without TLS, required for envoy ext-auth gRPC.
apiVersion: v1
kind: Service
metadata:
  name: hitl-extauth
  namespace: mcp-extauth-demo
  labels: { app: hitl-extauth }
spec:
  selector: { app: hitl-extauth }
  ports:
    - name: grpc
      port: 9001
      targetPort: 9001
      appProtocol: kubernetes.io/h2c
---
# HTTP admin API: list and resolve pending calls with curl.
apiVersion: v1
kind: Service
metadata:
  name: hitl-extauth-admin
  namespace: mcp-extauth-demo
  labels: { app: hitl-extauth }
spec:
  selector: { app: hitl-extauth }
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      appProtocol: http
