# Tools that must wait for a human, per MCP server key. Each entry is a Go
# regular expression matched against the whole tool name. A match is parked
# until a reviewer approves or rejects it. Every other call passes ext-auth:
# which tools are visible and callable at all is decided by native MCP
# authorization on the users-mcp backend (mcp-authz.yaml). Handshake frames
# with no tool name always pass.
# Edit this ConfigMap to change which tools park, without rebuilding the image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hitl-tool-policy
  namespace: mcp-extauth-demo
data:
  policy.yaml: |
    users-mcp:
      approve:
        - delete_.*
