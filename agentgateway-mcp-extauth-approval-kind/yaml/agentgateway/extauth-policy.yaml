# AgentgatewayPolicy (OSS) targeting the single /mcp route. ext-auth fires
# before every request is forwarded, so a denial never reaches the backend.
#
# forwardBody pulls the JSON-RPC body into the ext-auth Check() request — this
# is what lets hitl-extauth read the tool name and decide get_users vs
# delete_user. The gating decision itself lives in hitl-extauth's own Go code,
# not in this policy: agentgateway just calls Check() and does what it says.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-extauth
  namespace: mcp-extauth-demo
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mcp
  traffic:
    extAuth:
      backendRef:
        name: hitl-extauth
        port: 9001
      forwardBody:
        maxSize: 65536
      grpc: {}
