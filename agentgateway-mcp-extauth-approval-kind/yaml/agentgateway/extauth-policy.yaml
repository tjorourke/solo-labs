# AgentgatewayPolicy (OSS) targeting the single /mcp route. ext-auth fires
# before every request is forwarded, so a denial never reaches the backend.
#
# forwardBody pulls the JSON-RPC body into the ext-auth Check() request. This
# is what lets hitl-extauth read the tool name. Which names are allowed,
# parked or denied lives in the hitl-tool-policy ConfigMap, not in this
# policy: agentgateway just calls Check() and does what it says.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-extauth
  namespace: mcp-extauth-demo
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mcp
  traffic:
    extAuth:
      backendRef:
        name: hitl-extauth
        port: 9001
      forwardBody:
        maxSize: 65536
      grpc: {}
