# One endpoint, one route. Gating is by JSON-RPC body (tool name), not path.
# See the AgentgatewayPolicy in extauth-policy.yaml and hitl-extauth's Check().
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
  namespace: mcp-extauth-demo
spec:
  parentRefs:
    - name: extauth-gw
  rules:
    - backendRefs:
        - name: users-mcp
          port: 8080
