# /mcp goes only to the users-mcp MCP backend. Keep serverForPath in
# hitl-extauth in sync. Approve rules for that server come from the
# hitl-tool-policy ConfigMap; tool access comes from mcp-authz.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
  namespace: mcp-extauth-demo
spec:
  parentRefs:
    - name: extauth-gw
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: users-mcp
