# /mcp is bound only to users-mcp. Keep serverForPath in hitl-extauth in sync.
# Tool rules within that server come from the hitl-tool-policy ConfigMap.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
  namespace: mcp-extauth-demo
spec:
  parentRefs:
    - name: extauth-gw
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp
      backendRefs:
        - name: users-mcp
          port: 8080
