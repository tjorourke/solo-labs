# The gateway, declared entirely through the Kubernetes API.
# AgentgatewayParameters shapes the generated proxy Service so kind's
# mapped host port (30081) reaches the listener.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: extauth-gw-params
  namespace: mcp-extauth-demo
spec:
  service:
    spec:
      type: NodePort
      ports:
        - $patch: replace
        - name: mcp
          port: 3000
          targetPort: 3000
          nodePort: 30081
          protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: extauth-gw
  namespace: mcp-extauth-demo
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: extauth-gw-params
  listeners:
    - name: mcp
      protocol: HTTP
      port: 3000
      allowedRoutes:
        namespaces:
          from: Same
