# The CALLING side of one cross-cluster call: a ServiceEntry naming the synthetic
# hostname and pointing it at the other cluster's east-west gateway, plus the
# client's DNS-capture annotation.
#
# ONE ServiceEntry per cluster pair, listing every hostname that has to cross.
# Not one object per call: the hosts field is a list, so adding a service to the
# bridge is a one-line edit here plus an HTTPRoute on the exposing side.
#
# Declaring the crossings explicitly is why this pattern needs no remote secret
# and never touches the other cluster's Kubernetes API. During a migration the
# set of calls that cross is a known, finite, changing list, not "every service
# in the other cluster, automatically, forever".
#
# Tested: a hostname listed here with no HTTPRoute on the far side returns 404
# from the gateway, so a name you have declared but not yet exposed fails
# obviously rather than hanging.
#
# Do NOT try to collapse this to a wildcard. `hosts: ["*.crosscluster.svc"]` with
# resolution: STATIC does not work with DNS auto-allocation: the client cannot
# resolve the name at all and curl exits 6. List the hostnames.
#
# Replace the endpoint address with the east-west gateway's INTERNAL LoadBalancer
# IP on the other cluster:
#   kubectl --context <other> -n istio-gateways get svc istio-eastwestgateway \
#     -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: crosscluster-services
  namespace: cross-cluster-test
spec:
  hosts:
    - "hop-a.crosscluster.svc"
    # add each further crossing hostname here, one line each
  location: MESH_EXTERNAL
  resolution: STATIC
  ports:
    - name: http
      number: 80
      protocol: HTTP
  endpoints:
    - address: 10.128.0.26          # <-- other cluster's internal east-west LB IP
      ports:
        http: 8080
---
# The client. A synthetic hostname has no real DNS record anywhere, so without
# Istio's DNS proxy the pod cannot resolve it at all and curl fails before any
# mesh routing happens. The annotation turns on DNS capture for this pod only —
# deliberately per-pod rather than a mesh-wide meshConfig edit, because a managed
# control plane is entitled to ignore meshConfig changes you make locally.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: cross-cluster-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: client }
  template:
    metadata:
      labels: { app: client }
      annotations:
        proxy.istio.io/config: |
          proxyMetadata:
            ISTIO_META_DNS_CAPTURE: "true"
            ISTIO_META_DNS_AUTO_ALLOCATE: "true"
    spec:
      containers:
        - name: client
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c", "sleep infinity"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
