# One MCP URL for all four servers: http://localhost:8080/mcp
# agentregistry 2026.10.0 writes one route per Deployment (/registry/<name>) and has no record that merges servers,
# so the platform team writes this once. It multiplexes the four servers in one backend (agentgateway "Virtual MCP",
# https://agentgateway.dev/docs/kubernetes/latest/mcp/virtual/). Tool names get the target name as a prefix.
# Fields checked with kubectl explain and --dry-run=server on enterprise-agentgateway v2026.10.2.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: all-mcp
  namespace: agentgateway-system
spec:
  mcp:
    prefixMode: Always
    targets:
      - name: health
        static: {host: host.docker.internal, port: 8001, path: /mcp, protocol: StreamableHTTP}
      - name: finance
        static: {host: host.docker.internal, port: 8002, path: /mcp, protocol: StreamableHTTP}
      - name: telco
        static: {host: host.docker.internal, port: 8003, path: /mcp, protocol: StreamableHTTP}
      - name: compute
        static: {host: host.docker.internal, port: 8004, path: /mcp, protocol: StreamableHTTP}
  policies:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
            - '!jwt.Groups.exists(g, g == "developers")'
            # The expressions are ORed, so the developer rule is one expression. mcp.tool.name is the server's own
            # tool name (no prefix) and mcp.tool.target is the target name; both checked live on v2026.10.2.
            - >-
              !(mcp.tool.target == "health" && mcp.tool.name == "get_patient_record") &&
              !(mcp.tool.target == "finance" && mcp.tool.name == "issue_refund") &&
              !(mcp.tool.target == "telco" && mcp.tool.name == "reset_cell_site") &&
              !(mcp.tool.target == "compute" && mcp.tool.name == "restart_vm")
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: all-mcp
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
  rules:
    - matches:
        - path: {type: Exact, value: /mcp}
        - path: {type: PathPrefix, value: /.well-known/oauth-protected-resource/mcp}
      backendRefs:
        - group: enterpriseagentgateway.solo.io
          kind: EnterpriseAgentgatewayBackend
          name: all-mcp
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: all-mcp-auth
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: all-mcp
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: "http://keycloak.127.0.0.1.nip.io:8180/realms/agentregistry"
          audiences:
            - mcp-gateway
          jwks:
            remote:
              jwksPath: /realms/agentregistry/protocol/openid-connect/certs
              backendRef:
                name: keycloak
                kind: Service
                namespace: keycloak
                port: 8180
      mcp:
        resourceMetadata:
          scopesSupported:
            - openid
            - profile
          bearerMethodsSupported:
            - header
