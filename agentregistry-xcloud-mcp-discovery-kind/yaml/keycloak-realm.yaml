# Keycloak realm for the lab. Base is the "General setup" realm from
# https://docs.solo.io/agentregistry/latest/setup/oidc/keycloak.md (clients ar-backend,
# ar-cli-interactive, ar-cli-password, ar-ui; groups mapper; ar-backend audience mapper).
# Lab additions (field names copied from the same doc's client entries):
#   - client mcp-gateway: audience target only, no flows. The gateway JWT policy requires aud=mcp-gateway.
#   - client codex-mcp: public, auth code + PKCE, redirect wildcard http://127.0.0.1:5555/* (codex issue #30460).
#   - ar-cli-password also gets the mcp-gateway audience so one minted token works for the
#     registry MCP and the bearer fallback on the gateway.
#   - group developers and user dev-user/password (demo only, never reuse these credentials).
# The ar-mcp-client entry from the Solo doc is left out: Codex uses codex-mcp here.
# Checked 9 Nov 2026: Keycloak 26.7.1 gives the imported codex-mcp client the default scopes
# web-origins, acr, profile, roles, basic and email. Codex asks for openid and profile.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-agentregistry-realm
  namespace: keycloak
data:
  agentregistry-realm.json: |
    {
      "realm": "agentregistry",
      "enabled": true,
      "clients": [
        {
          "clientId": "ar-backend",
          "enabled": true,
          "publicClient": false,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false
        },
        {
          "clientId": "ar-cli-interactive",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "attributes": {
            "oauth2.device.authorization.grant.enabled": "true"
          },
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "Groups",
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "ar-backend-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "ar-backend",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "ar-cli-password",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "Groups",
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "ar-backend-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "ar-backend",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            },
            {
              "name": "mcp-gateway-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "mcp-gateway",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "ar-ui",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "redirectUris": [
            "*"
          ],
          "webOrigins": [
            "*"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256"
          },
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "Groups",
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "ar-backend-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "ar-backend",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "mcp-gateway",
          "enabled": true,
          "publicClient": false,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false
        },
        {
          "clientId": "codex-mcp",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "redirectUris": [
            "http://127.0.0.1:5555/*"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256"
          },
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "Groups",
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "mcp-gateway-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "mcp-gateway",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            }
          ]
        }
      ],
      "groups": [
        {
          "name": "admins"
        },
        {
          "name": "developers"
        }
      ],
      "users": [
        {
          "username": "admin-user",
          "email": "admin-user@example.com",
          "firstName": "Admin",
          "lastName": "User",
          "enabled": true,
          "credentials": [
            {
              "type": "password",
              "value": "password",
              "temporary": false
            }
          ],
          "groups": [
            "admins"
          ]
        },
        {
          "username": "dev-user",
          "email": "dev-user@example.com",
          "firstName": "Dev",
          "lastName": "User",
          "enabled": true,
          "credentials": [
            {
              "type": "password",
              "value": "password",
              "temporary": false
            }
          ],
          "groups": [
            "developers"
          ]
        }
      ]
    }
