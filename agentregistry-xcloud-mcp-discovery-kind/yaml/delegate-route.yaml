# Parent HTTPRoute. Delegates /registry/* to every child HTTPRoute the registry writes in agentregistry-system.
# From https://docs.solo.io/agentregistry/latest/setup/runtime/virtual.md Step 2.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentregistry-delegate
  namespace: agentgateway-system
  labels:
    agentregistry.solo.io/runtime: mcp-gateway
spec:
  parentRefs:
    - name: agentgateway-proxy
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /registry
      backendRefs:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: "*"
          namespace: agentregistry-system
