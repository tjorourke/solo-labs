# Four externally hosted MCP servers, catalogued by URL. Shape from
# https://docs.solo.io/agentregistry/latest/mcp/remote.md and quickstart/mcp-gateway.md Step 1.
# All four run as plain processes on the laptop (scripts/quick.sh servers-up) on ports 8001 to 8004.
# Pods reach the laptop through host.docker.internal (checked 9 Nov 2026 on OrbStack 29.8.2).
# The cloud-a / cloud-b grouping is in the title and description only, so it uses no extra fields.
apiVersion: ar.dev/v1alpha1
kind: MCPServer
metadata:
  name: health-records
spec:
  title: "Health records (cloud-a)"
  description: "Patient search, appointments and full patient records for the clinics. Hosted in cloud-a, outside the cluster."
  remote:
    type: streamable-http
    url: http://host.docker.internal:8001/mcp
---
apiVersion: ar.dev/v1alpha1
kind: MCPServer
metadata:
  name: finance-payments
spec:
  title: "Finance payments (cloud-a)"
  description: "Account balances, transactions and refunds for business accounts. Hosted in cloud-a, outside the cluster."
  remote:
    type: streamable-http
    url: http://host.docker.internal:8002/mcp
---
apiVersion: ar.dev/v1alpha1
kind: MCPServer
metadata:
  name: telco-network
spec:
  title: "Telco network operations (cloud-b)"
  description: "Cell-site status, outages and cell-site resets for the radio network. Hosted in cloud-b, outside the cluster."
  remote:
    type: streamable-http
    url: http://host.docker.internal:8003/mcp
---
apiVersion: ar.dev/v1alpha1
kind: MCPServer
metadata:
  name: compute-inventory
spec:
  title: "Compute inventory (cloud-b)"
  description: "VMs, their state and size, last month's cost per VM, and VM restarts. Hosted in cloud-b, outside the cluster."
  remote:
    type: streamable-http
    url: http://host.docker.internal:8004/mcp
