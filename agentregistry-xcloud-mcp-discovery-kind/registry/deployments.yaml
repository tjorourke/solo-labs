# Expose the four servers on the gateway through the Virtual runtime. The reachable path is /registry<pathSuffix>.
# Fields from https://docs.solo.io/agentregistry/latest/quickstart/mcp-gateway.md Steps 2, 6 and 7.
# Each Deployment carries an inline tool policy: action Allow passes a call when any expression is true.
# Members of the developers group see every tool except the one sensitive tool. For them that tool
# drops out of tools/list and returns 400 with JSON-RPC error -32602 "unknown resource" if called by name
# (seen on agentgateway 2026.10.2, 9 Nov 2026).
apiVersion: ar.dev/v1alpha1
kind: Deployment
metadata:
  name: health
spec:
  targetRef:
    kind: MCPServer
    name: health-records
    tag: latest
  runtimeRef:
    kind: Runtime
    name: mcp-gateway
  runtimeConfig:
    route:
      pathSuffix: /health
    backend:
      mcp:
        authorization:
          action: Allow
          policy:
            matchExpressions:
              - '!jwt.Groups.exists(g, g == "developers")'
              - 'mcp.tool.name != "get_patient_record"'
---
