# The gateway half of the lab, applied by agentdesktop.sh.
#
# Two things here are easy to get wrong.
#
# jwtAuthentication in Strict mode is what stops a developer bypassing the
# daemon: the gateway will not serve a request that does not carry a token the
# controller minted, and the provider key needed to bypass the gateway is not
# on the workstation.
#
# policies.ai.routes selects the Anthropic Messages API. Leave it out and an AI
# backend normalises replies to the OpenAI schema, which Claude Code cannot
# read. The call still succeeds and still reaches Anthropic, so the failure is
# quiet.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: agentdesktop-jwt
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai-gateway
  frontend:
    accessLog:
      attributes:
        add:
          - name: llm.client
            expression: jwt.client_id
          - name: user
            expression: jwt.email
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: agentdesktop-controller
          audiences: [agentgateway]
          jwks:
            remote:
              jwksPath: /.well-known/jwks.json
              backendRef:
                group: ""
                kind: Service
                name: agentdesktop
                namespace: agentdesktop
                port: 443
---
# The controller serves JWKS over its own certificate, so the gateway needs the
# device CA to trust it.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agentdesktop-controller-tls
  namespace: agentdesktop
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: agentdesktop
  backend:
    tls:
      caCertificateRefs:
        - name: agentdesktop-controller-ca
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: anthropic-claude
  namespace: agentgateway-system
spec:
  ai:
    provider:
      anthropic: {}
  policies:
    auth:
      secretRef:
        name: anthropic-secret
    ai:
      routes:
        "/v1/messages": Messages
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentdesktop-messages
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: ai-gateway
  rules:
    - matches:
        - path: { type: PathPrefix, value: /v1/messages }
      backendRefs:
        - name: anthropic-claude
          group: enterpriseagentgateway.solo.io
          kind: EnterpriseAgentgatewayBackend
      timeouts: { request: 120s }
