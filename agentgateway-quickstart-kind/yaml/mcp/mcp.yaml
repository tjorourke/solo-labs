# An MCP tool server exposed through the gateway at /mcp.
# Apply into the `demo` namespace:  kubectl -n demo apply -f yaml/mcp/mcp.yaml
apiVersion: apps/v1
kind: Deployment
metadata: { name: mcp-website-fetcher, labels: { app: mcp-website-fetcher } }
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-website-fetcher } }
  template:
    metadata: { labels: { app: mcp-website-fetcher } }
    spec:
      containers:
        - name: fetcher
          image: ghcr.io/peterj/mcp-website-fetcher:main
          ports: [{ containerPort: 8000 }]
---
apiVersion: v1
kind: Service
metadata: { name: mcp-website-fetcher }
spec:
  selector: { app: mcp-website-fetcher }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata: { name: mcp-backend }
spec:
  mcp:
    targets:
      - name: fetcher
        static:
          backendRef: { name: mcp-website-fetcher }
          port: 80
          protocol: SSE
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: mcp }
spec:
  parentRefs: [{ name: agw }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /mcp } }]
      backendRefs:
        - name: mcp-backend
          group: enterpriseagentgateway.solo.io
          kind: EnterpriseAgentgatewayBackend
