# The official "everything" MCP reference server, exposed through the gateway at /mcp.
# It speaks Streamable HTTP and exposes a batch of demo tools (echo, get-sum, get-tiny-image, ...).
# One command deploys it into the demo namespace:  kubectl apply -f yaml/mcp/mcp.yaml
apiVersion: apps/v1
kind: Deployment
metadata: { name: mcp-everything, namespace: demo, labels: { app: mcp-everything } }
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-everything } }
  template:
    metadata: { labels: { app: mcp-everything } }
    spec:
      containers:
        - name: everything
          image: node:22-alpine
          command: ["npx"]
          args: ["-y", "@modelcontextprotocol/server-everything", "streamableHttp"]
          ports: [{ containerPort: 3001 }]
---
apiVersion: v1
kind: Service
metadata: { name: mcp-everything, namespace: demo }
spec:
  selector: { app: mcp-everything }
  ports: [{ port: 80, targetPort: 3001 }]
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata: { name: mcp-backend, namespace: demo }
spec:
  mcp:
    targets:
      - name: everything
        static:
          backendRef: { name: mcp-everything }
          port: 80
          protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: mcp, namespace: demo }
spec:
  parentRefs: [{ name: agw }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /mcp } }]
      backendRefs:
        - name: mcp-backend
          group: enterpriseagentgateway.solo.io
          kind: EnterpriseAgentgatewayBackend
