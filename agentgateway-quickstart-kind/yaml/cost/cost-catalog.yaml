# Model cost catalog (USD per 1M tokens) + the parameters that load it.
# Apply:  kubectl -n agentgateway-system apply -f yaml/cost/cost-catalog.yaml
apiVersion: v1
kind: ConfigMap
metadata: { name: model-costs, namespace: agentgateway-system }
data:
  catalog.json: |
    {
      "providers": {
        "openai":    { "models": { "gpt-4o-mini":      { "rates": { "input": "0.15", "output": "0.6", "cacheRead": "0.075" } } } },
        "anthropic": { "models": { "claude-haiku-4-5": { "rates": { "input": "1.0",  "output": "5.0" } } } }
      }
    }
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayParameters
metadata: { name: cost-params, namespace: agentgateway-system }
spec:
  modelCatalog:
    sources:
      - configMap: { name: model-costs, key: catalog.json }
