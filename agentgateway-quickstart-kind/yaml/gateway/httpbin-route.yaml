# Sample app + a Gateway (enterprise-agentgateway class) + an HTTPRoute to it.
# Apply into the `demo` namespace:  kubectl -n demo apply -f yaml/gateway/httpbin-route.yaml
apiVersion: apps/v1
kind: Deployment
metadata: { name: httpbin, labels: { app: httpbin } }
spec:
  replicas: 1
  selector: { matchLabels: { app: httpbin } }
  template:
    metadata: { labels: { app: httpbin } }
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: httpbin }
spec:
  selector: { app: httpbin }
  ports: [{ port: 8000, targetPort: 8080 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: agw }
spec:
  gatewayClassName: enterprise-agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes: { namespaces: { from: Same } }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: httpbin }
spec:
  parentRefs: [{ name: agw }]
  rules:
    - backendRefs: [{ name: httpbin, port: 8000 }]
