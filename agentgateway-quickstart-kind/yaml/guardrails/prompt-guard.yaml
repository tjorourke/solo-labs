# Prompt guard on the LLM routes: reject requests carrying PII, mask PII in responses.
# One policy protects every route in targetRefs (here /openai and /anthropic from step 7).
# Keep only the routes you actually created; a targetRef to a missing route just does not
# attach. Built-in detectors: CreditCard, Ssn, PhoneNumber, Email, CaSin. Custom: `matches`.
#   kubectl apply -f yaml/guardrails/prompt-guard.yaml
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata: { name: prompt-guard, namespace: demo }
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: openai }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: anthropic }
  backend:
    ai:
      promptGuard:
        request:
          - regex:
              action: Reject               # Reject or Mask
              builtins: ["Ssn", "CreditCard"]
              # matches: ["(?i)api[_-]?key"]   # add your own regex too
            response:
              statusCode: 403
              message: "Blocked: the request contained sensitive data (PII)."
        response:
          - regex:
              action: Mask                  # mask PII the model returns
              builtins: ["Ssn", "CreditCard", "Email"]
