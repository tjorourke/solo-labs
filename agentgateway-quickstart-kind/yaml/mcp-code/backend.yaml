# Code Mode: front the SAME everything MCP server (from yaml/mcp/mcp.yaml) on a new
# route /mcp-code, but with toolMode: Code so the gateway collapses every tool into a
# single run_code tool. The model writes one script that calls the tools it needs, so
# fewer tool schemas ship in the prompt and there are fewer round trips.
#   kubectl apply -f yaml/mcp-code/backend.yaml
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata: { name: mcp-code, namespace: demo }
spec:
  entMcp:
    toolMode: Code
    sessionRouting: Stateful
    targets:
      - name: everything
        static: { host: mcp-everything.demo.svc.cluster.local, port: 80, protocol: StreamableHTTP, path: /mcp }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: mcp-code, namespace: demo }
spec:
  parentRefs: [{ name: agw }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /mcp-code } }]
      backendRefs:
        - name: mcp-code
          group: enterpriseagentgateway.solo.io
          kind: EnterpriseAgentgatewayBackend
