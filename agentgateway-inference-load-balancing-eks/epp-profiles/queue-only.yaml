# Queue depth and nothing else.
#
# vllm:num_requests_waiting on each replica, inverted, so the shortest queue wins. This
# is the profile to run when you want to see the queue signal on its own: saturate one
# replica and watch every new request go to the other, with no prefix affinity pulling
# in the opposite direction.
#
# On its own it is a good least-loaded balancer and a bad cache strategy. It will
# cheerfully send the second turn of a conversation to the replica that has never seen
# the first, paying full prefill again to save a place in a queue of one.
inferenceExtension:
  pluginsConfigFile: custom-plugins.yaml
  pluginsCustomConfig:
    custom-plugins.yaml: |
      apiVersion: inference.networking.x-k8s.io/v1alpha1
      kind: EndpointPickerConfig
      plugins:
      - type: queue-scorer
      - type: max-score-picker
      schedulingProfiles:
      - name: default
        plugins:
        - pluginRef: max-score-picker
        - pluginRef: queue-scorer
          weight: 1
