# payments — the namespace that migrates to ambient. Same shape as ledger,
# with the client calling back INTO ledger, so after migration every request
# crosses the sidecar/ambient boundary in the other direction.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: httpbin
  namespace: payments
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: payments
  labels:
    app: httpbin
spec:
  selector:
    app: httpbin
  ports:
    - name: http
      port: 8000
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: payments
spec:
  replicas: 1
  # give ztunnel a beat to fetch the pod's certificate before the rolling
  # update shifts traffic onto it during the ambient migration
  minReadySeconds: 10
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
    spec:
      serviceAccountName: httpbin
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:2.25.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: client
  namespace: payments
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      serviceAccountName: client
      containers:
        - name: client
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - while true; do
                curl -s -o /dev/null -w "%{http_code}\n" --max-time 5
                  http://httpbin.ledger:8000/status/200;
                sleep 2;
              done
