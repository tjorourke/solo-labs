# kind cluster for the Vault + istio-csr sidecar-to-ambient lab.
# One control-plane + one worker: ztunnel is a per-node DaemonSet, so a second
# node keeps the app pods off the control-plane and closer to a real cluster.
#
# No host port mappings: all traffic is in-cluster (clients calling httpbin
# across namespaces over the mesh), there is no ingress in this lab.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: istio-csr
nodes:
  - role: control-plane
  - role: worker
