# A gateway for Claude Code and Claude Desktop. Both speak the Anthropic Messages API, so
# there is nothing Anthropic-specific about the Gateway itself: the work is on the backend and
# the route.
#
# The Service is ClusterIP on purpose. A plain Gateway renders a LoadBalancer Service, which
# on a public cloud means a public endpoint before any policy is attached. Claude Desktop in
# particular wants HTTPS unless the endpoint is on loopback, so how the laptop reaches this is
# a deployment decision.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayParameters
metadata:
  name: my-gateway-params
  namespace: agentgateway-system
spec:
  service:
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: my-gateway
  namespace: agentgateway-system
spec:
  gatewayClassName: enterprise-agentgateway
  infrastructure:
    parametersRef:
      group: enterpriseagentgateway.solo.io
      kind: EnterpriseAgentgatewayParameters
      name: my-gateway-params
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
