# The front door: a third Gateway that every client reaches first.
#
# It exists because of where a transformation runs. On one Gateway the order is JWT, then
# extAuth, then extProc, then transformation, then route selection, so a transformation that
# rewrote the request would run AFTER the router had already read it. Putting the rewrite on
# an earlier hop is what lets the router see a request it understands.
#
# It carries no JWT policy of its own. The gateway behind it verifies the token, so a request
# with no token still gets a 401 before any model is involved; this hop only reshapes the body.
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayParameters
metadata:
  name: intake-gateway-params
  namespace: agentgateway-system
spec:
  service:
    spec:
      # ClusterIP, like the other two. Whatever you put in front of this (a load balancer, an
      # ingress) is a deployment decision, not part of the flow.
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: intake-gateway
  namespace: agentgateway-system
spec:
  gatewayClassName: enterprise-agentgateway
  infrastructure:
    parametersRef:
      group: enterpriseagentgateway.solo.io
      kind: EnterpriseAgentgatewayParameters
      name: intake-gateway-params
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
