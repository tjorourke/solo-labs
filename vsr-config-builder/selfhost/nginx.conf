# conf.d/*.conf is included inside http{}, so these belong here rather than in a
# server block. nginx wants somewhere to write temp files even when it is only
# serving static files, and its defaults are under /var/cache/nginx, which an
# unprivileged uid cannot create on a read-only root filesystem. Point them all at
# /tmp and the container needs exactly one writable directory.
client_body_temp_path /tmp/client_temp;
proxy_temp_path       /tmp/proxy_temp;
fastcgi_temp_path     /tmp/fastcgi_temp;
uwsgi_temp_path       /tmp/uwsgi_temp;
scgi_temp_path        /tmp/scgi_temp;

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Nothing here is user data and nothing is posted anywhere, but the page does
    # fetch one file cross-origin (the lab's own config, as a worked example), so
    # the policy has to allow that and nothing else.
    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "SAMEORIGIN"       always;
    add_header Referrer-Policy         "no-referrer"      always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://mastertheagent.com; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Revalidate rather than cache. The filenames carry no content hash, so an hour
    # of caching means rebuilding the image and still being served the old wizard,
    # with nothing on screen to say why. The files are a few tens of kilobytes and
    # a 304 is cheap; correctness is worth more here than the round trip.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache" always;
    }

    # Not an SPA. A missing file must be a 404, not a 200 with the page's own HTML
    # in it: the wizard fetches the lab's config by relative path first, and an
    # index.html fallback turns that miss into a "success" carrying markup.
    location / {
        try_files $uri $uri/ =404;
    }
}
