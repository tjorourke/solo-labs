# The cluster this lab runs on. Standalone: it shares nothing with any other lab.
#
# Two node groups. Everything that is not a model runs on `platform`, and the models
# get `gpu`, one card each.
#
# WHY ONE AZ FOR THE GPUs. The model weights live on gp3 volumes, and a gp3 volume is
# bound to the AZ it was created in. Spread the nodegroup across AZs and a scale-up that
# lands in a different one leaves the pod Pending forever, with events that do not say
# why. Pin it, and the node comes back to the same volume every time.
#
# WHY g7e.2xlarge. One RTX PRO 6000 Server with 96 GB, which holds either model on its
# own with room for KV cache, so there is no tensor parallelism to configure and no
# NCCL. London GPU capacity moves hour to hour: before a rehearsal, hold the nodes with
# an On-Demand Capacity Reservation in this AZ rather than hoping.
#
#   aws ec2 create-capacity-reservation --instance-type g7e.2xlarge \
#     --instance-platform Linux/UNIX --availability-zone eu-west-2a --instance-count 2 \
#     --instance-match-criteria open --end-date-type limited --end-date <when you finish>
#
# instance-match-criteria=open means the nodegroup consumes it with no extra config.
# ALWAYS set an end date: a reservation bills the full hourly rate with nothing in it.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: model-routing
  region: eu-west-2
  version: "1.34"
  tags:
    Owner: torourke
    Project: model-routing-lab

iam:
  withOIDC: true

addons:
  # Without the EBS CSI driver every PVC in the lab stays Pending, and the events blame
  # the volume rather than the missing driver.
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy

managedNodeGroups:
  - name: platform
    instanceType: m6i.xlarge
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 80
    privateNetworking: true
    labels:
      role: platform

  - name: gpu
    instanceType: g7e.2xlarge
    # Two nodes, one model each. The device plugin hands out whole GPUs, so a second
    # model on the same node stays Pending on Insufficient nvidia.com/gpu.
    desiredCapacity: 2
    minSize: 0
    maxSize: 2
    # 200 GB because the vLLM image alone is 9 GB and the weights are pulled through
    # the node before they reach the volume.
    volumeSize: 200
    privateNetworking: true
    availabilityZones:
      - eu-west-2a
    labels:
      role: gpu
    taints:
      # Keeps everything that is not a model off the expensive nodes. The vLLM
      # deployments tolerate it; nothing else does.
      - key: nvidia.com/gpu
        value: "true"
        effect: NoSchedule
