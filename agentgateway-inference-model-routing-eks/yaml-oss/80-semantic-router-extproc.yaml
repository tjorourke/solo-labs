# OSS conversion. Same routing, upstream agentgateway CRDs.
#
# Mechanical from the Enterprise manifests in ../yaml:
#   enterpriseagentgateway.solo.io/v1alpha1 -> agentgateway.dev/v1alpha1
#   EnterpriseAgentgatewayPolicy            -> AgentgatewayPolicy
#   EnterpriseAgentgatewayBackend           -> AgentgatewayBackend
#   gatewayClassName: enterprise-agentgateway -> agentgateway
#
# Every field this lab uses is present on the OSS CRDs, checked with kubectl explain:
# spec.traffic.phase (PreRouting), spec.traffic.transformation and
# spec.traffic.extProc.processingOptions on the policy, and
# spec.ai.provider.openai.model with host and path on the backend. None of the
# Enterprise-only fields (entPromptGuard, entRateLimit, entExtAuth, entWAF,
# entBudgetEnforcement, entMcp, tokenExchange, workloadIdentity) appears anywhere here.
#
# These are the files the lab's scripts apply. The whole lab was run on upstream
# agentgateway v1.3.0-alpha.1 with Gateway API v1.4.0 experimental, and the Enterprise
# set in ../yaml was run separately. Both builds are in the Versions footer.

# Semantic classification: hand the decision to the semantic router.
#
# Applying this file plus yaml-oss/81 turns semantic classification on. Re-applying yaml-oss/20 plus yaml-oss/30
# returns to the keyword classifier, so the A/B is two commands either way:
#
#   kubectl apply -f yaml-oss/80-semantic-router-extproc.yaml -f yaml-oss/81-httproute-vsr.yaml
#   kubectl apply -f yaml-oss/20-routing-policy.yaml          -f yaml-oss/30-httproute.yaml
#
# THERE IS NO TRANSFORMATION IN THIS POLICY, AND THAT IS NOT AN OMISSION.
#
# Within one PreRouting policy the transformation is evaluated BEFORE the external
# processor, and the processor's body rewrite is applied after the backend has
# already pinned its own model name. Keeping both in one policy produces a request
# whose route was chosen by the regex and whose body was rewritten by the router, and
# when those two disagree the backend is handed a model it does not serve and answers
# 400. Measured: a CrashLoopBackOff prompt routed to the general model and arrived
# there asking for the code model.
#
# So this policy does not read the body at all. The router publishes its decision as a
# request header and the route in yaml-oss/81 matches that header instead.
#
# THE HEADER IS `x-selected-model`. Not `x-vsr-selected-model`, which is a response
# header carrying the same value for debugging. Matching the response name produces a
# route that never matches, every request falls through to the default backend, and
# nothing anywhere reports an error.
#
# WHY requestBodyMode: Buffered IS MANDATORY. The router needs the whole prompt to
# classify it. The field defaults to FullDuplexStreamed, and on the default the router
# still classifies while its output is dropped, so every request quietly serves the
# default model.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: extract-model-internal
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: model-gateway
  traffic:
    # The router runs before the route is chosen, which is the only reason its header
    # is available to match on. At the default PostRouting the backend is already
    # selected and the decision changes nothing.
    phase: PreRouting
    extProc:
      backendRef:
        name: semantic-router
        namespace: agentgateway-system
        port: 50051
      # NOTE: the OSS CRD has no failureMode. The Enterprise set adds it, and the
      # Enterprise manifest in ../yaml sets FailOpen so a classifier outage does not
      # become a gateway outage. On OSS the behaviour is the controller's default.
      processingOptions:
        requestHeaderMode: Send
        requestBodyMode: Buffered
        responseHeaderMode: Send
        responseBodyMode: Buffered
        allowModeOverride: true
