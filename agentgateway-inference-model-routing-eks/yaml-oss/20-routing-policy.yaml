# OSS conversion. Same routing, upstream agentgateway CRDs.
#
# Mechanical from the Enterprise manifests in ../yaml:
#   enterpriseagentgateway.solo.io/v1alpha1 -> agentgateway.dev/v1alpha1
#   EnterpriseAgentgatewayPolicy            -> AgentgatewayPolicy
#   EnterpriseAgentgatewayBackend           -> AgentgatewayBackend
#   gatewayClassName: enterprise-agentgateway -> agentgateway
#
# Every field this lab uses is present on the OSS CRDs, checked with kubectl explain:
# spec.traffic.phase (PreRouting), spec.traffic.transformation and
# spec.traffic.extProc.processingOptions on the policy, and
# spec.ai.provider.openai.model with host and path on the backend. None of the
# Enterprise-only fields (entPromptGuard, entRateLimit, entExtAuth, entWAF,
# entBudgetEnforcement, entMcp, tokenExchange, workloadIdentity) appears anywhere here.
#
# These are the files the lab's scripts apply. The whole lab was run on upstream
# agentgateway v1.3.0-alpha.1 with Gateway API v1.4.0 experimental, and the Enterprise
# set in ../yaml was run separately. Both builds are in the Versions footer.

# Lift the requested model name out of the JSON body into a header the router can
# match on. coalesce treats an omitted model field as auto; the expression still
# requires a valid messages array and text content in one of the supported shapes.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: extract-model-internal
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: model-gateway
  traffic:
    phase: PreRouting
    transformation:
      request:
        set:
          - name: x-model
            # Honour a concrete model name. Only auto or an omitted model is classified.
            # Read the last message; messages[0] is usually the system prompt.
            # For list content, this expression reads only the first part's text.
            #
            # type() selects the accessor before applying the regex. OR-ing a string
            # match with a list accessor can error when the string match is false.
            # Clients sending an empty list, non-text first part or tool-only message
            # need additional handling beyond this lab's prompt shapes.
            #
            # Semantic mode replaces this transformation with ExtProc and changes the
            # HTTPRoute's matched header to x-selected-model. The backends stay the same.
            value: |
              coalesce(json(request.body).model, "auto") != "auto"
                ? json(request.body).model
                : ((type(json(request.body).messages[size(json(request.body).messages) - 1].content) == string
                      ? json(request.body).messages[size(json(request.body).messages) - 1].content
                      : json(request.body).messages[size(json(request.body).messages) - 1].content[0].text
                   ).matches("(?i)(code|function|python|javascript|refactor|debug|compile|regex|sql query|unit test)") ? "qwen3-coder-30b" : "mistral-small-3.2-24b")
