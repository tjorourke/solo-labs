# The coding model as a gateway backend.
#
# Both models get a backend.
# yaml/00-mistral-model.yaml. Both are defined below.
#
# `ai.provider` is singular deliberately. Prompt guards bind to the single-provider
# shape only: on the ai.groups[]/providers[] failover shape a guard policy still
# reports Accepted and Attached and enforces nothing at all. Do not tidy this into
# the groups form to add a fallback.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: vllm-qwen
  namespace: agentgateway-system
spec:
  ai:
    provider:
      openai:
        # Must match --served-model-name on the Qwen deployment exactly.
        model: qwen3-coder-30b
      host: vllm-qwen.models.svc.cluster.local
      port: 8000
      path: /v1/chat/completions
