# legacy: a test caller outside the mesh (hand-written, not part of Bookinfo).
# Its namespace is never labelled, so no ztunnel redirect applies to it and it
# talks plain TCP to the ratings pod. While ratings accepts plaintext (the
# PERMISSIVE default) it gets 200. Once STRICT lands its connections are reset.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: legacy
  namespace: legacy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy
  namespace: legacy
spec:
  replicas: 1
  selector:
    matchLabels: { app: legacy }
  template:
    metadata:
      labels: { app: legacy }
    spec:
      serviceAccountName: legacy
      containers:
        - name: legacy
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c", "sleep infinity"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
