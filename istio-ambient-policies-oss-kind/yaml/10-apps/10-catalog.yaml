# catalog — the server every policy in this lab protects. go-httpbin answers
# any method on /anything with 200 and echoes the request back, so a 200 means
# the request reached the pod, and a 403 or a reset means a policy stopped it.
#
# Its ServiceAccount is its mesh identity: spiffe://cluster.local/ns/shop/sa/catalog.
# The Service port is named http so the waypoint (step 5) treats it as HTTP.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog
  namespace: shop
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: shop
  labels:
    app: catalog
spec:
  selector:
    app: catalog
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: { app: catalog }
  template:
    metadata:
      labels: { app: catalog }
    spec:
      serviceAccountName: catalog
      containers:
        - name: catalog
          image: mccutchen/go-httpbin:2.26.0
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
