# Policy 1: STRICT mTLS for the catalog pods.
# Generated by Flightbay 0.4.5, task "Require mTLS" (Require mesh mTLS),
# on Service shop/catalog. Unchanged apart from this comment.
# Flightbay scopes it to the catalog pods with a selector. It does not generate
# the mesh-wide version (name default, namespace istio-system, no selector).
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  labels:
    app.kubernetes.io/managed-by: flightbay
    flightbay.dev/test-id: efc3b3d553a6b4cc
  name: catalog-strict-mtls
  namespace: shop
spec:
  mtls:
    mode: STRICT
  selector:
    matchLabels:
      app: catalog
