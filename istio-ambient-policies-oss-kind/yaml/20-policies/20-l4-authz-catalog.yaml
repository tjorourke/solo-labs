# Policy 2: L4 authorization by identity, enforced by ztunnel.
#
# A selector-based AuthorizationPolicy on the catalog pods that matches on the
# caller's mTLS identity and nothing else: no methods, no paths, no headers.
# Those would need a waypoint; this does not. Only checkout may open a
# connection to catalog. Every other identity, reporting included, is reset
# before a byte of HTTP is read, so the caller sees a failed connection
# rather than a 403.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: catalog-l4
  namespace: shop
spec:
  selector:
    matchLabels:
      app: catalog
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/shop/sa/checkout
