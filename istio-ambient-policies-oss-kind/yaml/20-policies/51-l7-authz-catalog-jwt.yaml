# Policy 4, part two: DELETE needs a valid token AND the checkout identity.
#
# Same policy name as step 6 (catalog-l7), so this REPLACES it rather than
# adding a second ALLOW policy next to it. The GET rule is unchanged. The new
# rule opens DELETE to checkout only when the request carries a JWT that the
# RequestAuthentication verified and whose iss/sub form the request principal
# testing@secure.istio.io/testing@secure.istio.io.
#
# Both source conditions have to hold: reporting presenting the same valid
# token is still refused, because the workload identity is wrong.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: catalog-l7
  namespace: shop
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: catalog
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/shop/sa/checkout
      to:
        - operation:
            methods: ["GET"]
    - from:
        - source:
            principals:
              - cluster.local/ns/shop/sa/checkout
            requestPrincipals:
              - testing@secure.istio.io/testing@secure.istio.io
      to:
        - operation:
            methods: ["DELETE"]
