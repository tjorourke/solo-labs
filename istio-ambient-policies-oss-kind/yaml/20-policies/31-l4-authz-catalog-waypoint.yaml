# Policy 2, revised for the waypoint.
#
# Once shop uses a waypoint, a call from checkout to catalog has two hops:
# checkout -> waypoint, then waypoint -> catalog. The second hop is the one the
# catalog pod's ztunnel sees, and its source identity is the WAYPOINT, not
# checkout. The L4 policy from step 4 therefore refuses the waypoint, and every
# caller gets a 503 from it, checkout included, the one caller that should pass.
#
# The fix keeps the L4 rule and names the identity that now connects. Only the
# waypoint may open catalog's port, which means every caller has to go through
# the waypoint and its L7 policy. The per-caller rule moves up to L7.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: catalog-l4
  namespace: shop
spec:
  selector:
    matchLabels:
      app: catalog
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/shop/sa/waypoint
