# The waypoint for the shop namespace: a Gateway of class istio-waypoint.
# istiod turns it into one Envoy deployment (also called waypoint) with its
# own ServiceAccount, so its identity is spiffe://cluster.local/ns/shop/sa/waypoint.
#
# Nothing uses it until a namespace, service or pod is labelled
# istio.io/use-waypoint: waypoint. scripts/05-waypoint.sh puts the
# label on the namespace, so every service in shop is served by it.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: shop
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
