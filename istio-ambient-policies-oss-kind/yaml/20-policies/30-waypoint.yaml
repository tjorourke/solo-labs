# The waypoint for shop, and the namespace labels that send shop's traffic to it.
# Generated by Flightbay 0.4.5, task "Set up a waypoint": Deploy a new waypoint,
# Namespace default, name waypoint, class istio-waypoint. Unchanged apart from
# this comment. The Namespace part only adds two labels; kubectl apply merges
# them with the labels shop already has.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  labels:
    app.kubernetes.io/managed-by: flightbay
    flightbay.dev/test-id: b6b83cbbe2be868c
    istio.io/waypoint-for: service
  name: waypoint
  namespace: shop
spec:
  gatewayClassName: istio-waypoint
  listeners:
  - allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values:
            - shop
    name: mesh
    port: 15008
    protocol: HBONE
# Existing resource: scoped merge snippet. Flightbay applies only the reviewed fields with UID/resourceVersion checks.
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    istio.io/use-waypoint: waypoint
    istio.io/use-waypoint-namespace: shop
  name: shop
