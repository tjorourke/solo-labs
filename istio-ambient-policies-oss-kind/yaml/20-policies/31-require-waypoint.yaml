# Policy 2, revised: only the waypoint may open a connection to the catalog pods.
# Generated by Flightbay 0.4.5, task "Block traffic that skips the waypoint".
# Unchanged apart from this comment. ALLOW policies add up, so catalog-l4
# (allow checkout) has to be deleted as well, or checkout can still go
# straight to the pod IP.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: flightbay
    flightbay.dev/test-id: 8f59296c2fd8bca5
  name: catalog-require-waypoint
  namespace: shop
spec:
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/shop/sa/waypoint
  selector:
    matchLabels:
      app: catalog
