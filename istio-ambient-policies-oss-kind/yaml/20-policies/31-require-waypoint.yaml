# Policy 2, fixed: only the waypoint may open a connection to the ratings pods.
# Generated by Flightbay 0.4.5, task "Block traffic that skips the waypoint",
# on Service bookinfo/ratings. Unchanged apart from this comment.
# Apply it, then delete ratings-l4. ALLOW policies add up, so while ratings-l4
# exists reviews can still skip the waypoint by calling the pod IP.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: flightbay
    flightbay.dev/test-id: 3573cf572a808f5e
  name: ratings-require-waypoint
  namespace: bookinfo
spec:
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/bookinfo/sa/bookinfo-waypoint
  selector:
    matchLabels:
      app: ratings
