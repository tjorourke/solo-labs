# kind cluster for the OSS ambient policies lab.
# One control-plane + two workers: ztunnel runs as a DaemonSet, so a second
# worker shows that a policy enforced "by ztunnel" is enforced on whichever
# node the destination pod landed on, with no per-pod proxy anywhere.
#
# No host port mappings: every call in this lab is pod to pod inside the
# cluster. There is no ingress gateway.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ambient-policies-lab
nodes:
  - role: control-plane
  - role: worker
  - role: worker
