# The inspecting corporate proxy. It terminates the destination's TLS, looks at
# the plaintext, then re-originates TLS to the real destination. Everything the
# gateway sees is signed by corp-ca instead of the destination's own CA, which
# is the whole reason caCertificateRefs exists.
#
# mitmproxy verifies the real destination itself, so it is given upstream-ca to
# trust. A corporate proxy that skipped that check would be the actual security
# problem, not the gateway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mitm
  namespace: egress
  labels: { app: mitm }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mitm }
  template:
    metadata:
      labels: { app: mitm }
    spec:
      # No pod securityContext on purpose. The image's entrypoint starts as
      # root and drops to the mitmproxy user itself; pinning runAsUser makes it
      # fail with "failed switching to mitmproxy: operation not permitted".
      initContainers:
      # confdir has to be writable by that user: mitmproxy derives
      # mitmproxy-ca-cert.pem and friends from the CA on first start, and the
      # Secret mount is read-only. Copy the CA into an emptyDir and hand it over.
      - name: seed-confdir
        image: busybox:1.36
        command: ["sh", "-c", "cp /secret/mitmproxy-ca.pem /confdir/ && chmod 600 /confdir/mitmproxy-ca.pem && chown -R 1000:1000 /confdir"]
        volumeMounts:
        - { name: ca, mountPath: /secret, readOnly: true }
        - { name: confdir, mountPath: /confdir }
      containers:
      - name: mitmdump
        image: mitmproxy/mitmproxy:11.1.3
        args:
        - mitmdump
        - --mode=regular
        - --listen-host=0.0.0.0
        - --listen-port=8080
        - --set=confdir=/confdir
        - --set=ssl_verify_upstream_trusted_ca=/secret/upstream-ca.crt
        - --set=flow_detail=1
        - --set=termlog_verbosity=info
        ports:
        - containerPort: 8080
        volumeMounts:
        - { name: ca, mountPath: /secret, readOnly: true }
        - { name: confdir, mountPath: /confdir }
        readinessProbe:
          tcpSocket: { port: 8080 }
          initialDelaySeconds: 3
          periodSeconds: 3
      volumes:
      - name: ca
        secret: { secretName: mitm-ca }
      - name: confdir
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mitm
  namespace: egress
spec:
  selector: { app: mitm }
  ports:
  - name: proxy
    port: 8080
    targetPort: 8080
