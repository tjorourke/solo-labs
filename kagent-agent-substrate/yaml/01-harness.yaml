# Which runtime, which worker pool, where snapshots go, and which
# AgentTemplates this Harness admits.
apiVersion: kagent.dev/v1alpha3
kind: Harness
metadata:
  name: kagent
  namespace: kagent
spec:
  allowedAgentTemplates:          # omit the selector and the Harness admits nothing
    selector:
      matchLabels:
        kagent.dev/harness: kagent
  kagent: {}                      # runtime adapter: kagent | claude | codex | byo
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
  workload:
    image: ghcr.io/kagent-dev/kagent/golang-adk@sha256:699c7a36daa0050d5954f42ad3b614690d825664cf64ffe8871dbe20dc68464e
