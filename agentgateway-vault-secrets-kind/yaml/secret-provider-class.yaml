# Must exist before the enterprise-agentgateway controller pod first mounts the CSI
# volume that references it by name. Applied before the controller's Helm upgrade.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: openai-vault
  namespace: agentgateway-system
spec:
  provider: vault
  parameters:
    vaultAddress: "http://vault.vault.svc:8200"
    roleName: "agentgateway"
    objects: |
      - objectName: "openai-api-key"
        secretPath: "secret/data/openai-api-key"
        secretKey: "api-key"
