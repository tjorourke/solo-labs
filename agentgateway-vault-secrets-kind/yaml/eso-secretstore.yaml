# ESO's connection to Vault dev-mode over plain HTTP, authenticating with the
# eso-virtual-keys Vault role (bound to the eso-virtual-keys-reader ServiceAccount
# below, policy read-only on secret/data/virtual-keys/*). Deliberately a separate
# Vault role from the CSI-driver's "agentgateway" role used for the provider key,
# so the two flows cannot read each other's secrets (tested in scripts/test.py).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-virtual-keys-reader
  namespace: agentgateway-system
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-virtual-keys
  namespace: agentgateway-system
spec:
  provider:
    vault:
      server: "http://vault.vault.svc:8200"
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-virtual-keys
          serviceAccountRef:
            name: eso-virtual-keys-reader
