# Materializes the CSI-mounted file into the in-memory key "Authorization",
# which the openai backend below reads via auth.secretRef. refreshInterval is
# set explicitly rather than relying on a chart default (>= 15m is enforced).
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayExternalSecret
metadata:
  name: openai-external-secret
  namespace: agentgateway-system
spec:
  storeRef:
    name: llm-secrets
  refreshInterval: 1h
  data:
    - materializedKey: Authorization
      remoteRef:
        key: openai-api-key
