# Vault dev-mode holds one KV v2 entry per demo user under
# secret/virtual-keys/<user>, each holding keyHash + metadata as a single JSON
# blob under the field "value" (seed-virtual-keys.py writes `vault kv put ...
# value='<json>'`). remoteRef.property: value unwraps that field, so each
# secretKey gets the JSON blob itself, not Vault's {"value": "<json>"} envelope
# (mirrors the per-user JSON shape in
# agentgateway-virtual-keys/yaml/virtual-keys.yaml).
# Public demo credentials only; clients send vk-demo-<user>-not-for-production.
# The ExternalSecret never stores the raw credential, only its SHA-256 hash.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: virtual-key-hashes
  namespace: agentgateway-system
spec:
  secretStoreRef:
    name: vault-virtual-keys
    kind: SecretStore
  refreshInterval: 1m
  target:
    name: virtual-key-hashes
    template:
      metadata:
        labels:
          agentgateway.dev/apikey: virtual-keys-lab
  data:
    - secretKey: alice
      remoteRef:
        key: virtual-keys/alice
        property: value
    - secretKey: bob
      remoteRef:
        key: virtual-keys/bob
        property: value
    - secretKey: carol
      remoteRef:
        key: virtual-keys/carol
        property: value
    - secretKey: dave
      remoteRef:
        key: virtual-keys/dave
        property: value
