# Same apiKeyAuthentication shape as agentgateway-virtual-keys/yaml/auth-budget.yaml,
# but secretRef instead of configMapSelector: the hashes now come from Vault via
# ESO (eso-external-secret.yaml), materialized into the virtual-key-hashes Secret,
# never authored directly as a Kubernetes object.
#
# targetRefs the "llm" HTTPRoute specifically, not the Gateway: the Gateway also
# carries the "openai" HTTPRoute for Flow A (backend-openai.yaml), which
# authenticates upstream to the mock LLM using the CSI/Vault-materialized
# provider key and must not also be forced through client-facing virtual-key
# auth. Targeting the Gateway would apply apiKeyAuthentication to every route
# under it, including /v1/openai.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: vault-secrets
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: llm
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: virtual-key-hashes
