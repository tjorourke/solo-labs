# OSS version of yaml/virtual-keys-policy.yaml. apiKeyAuthentication.secretRef
# reads the same ESO-synced virtual-key-hashes Secret; only the policy kind
# changes.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: vault-secrets
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: llm
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: virtual-key-hashes
