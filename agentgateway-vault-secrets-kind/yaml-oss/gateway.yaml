# OSS version of yaml/gateway.yaml, Flow B only. The provider-key route
# (/v1/openai) is not here: it depends on EnterpriseAgentgatewayExternalSecret,
# which has no OSS equivalent. What remains is the virtual-keys route in front
# of the local mock LLM.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: vault-secrets
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mock-llm
  namespace: agentgateway-system
spec:
  ai:
    provider:
      openai: {}
      host: mock-llm.agentgateway-system.svc.cluster.local
      port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: vault-secrets
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mock-llm
