# kagent-tools (124 Kubernetes/Helm/Istio/Argo/Cilium tools) published through the gateway
# at /mcp. The harness is pointed at this address, never at kagent-tools directly.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: kagent-tools
  namespace: agentgateway-system
spec:
  mcp:
    targets:
      - name: kagent-tools
        static:
          host: kagent-tools.kagent.svc.cluster.local
          port: 8084
          path: /mcp
          protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent-tools
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: openclaw-gateway
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: kagent-tools
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
