# Four read tools, enforced at the gateway. Tools that do not match are not refused when
# called: they are absent from tools/list, so the harness never sees them. Everything else
# kagent-tools serves (patch, scale, rollout, apply, delete, shell, helm, ...) stays behind
# this line whatever the harness decides to attempt.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: kagent-tools-read-only
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: kagent-tools
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
            - 'mcp.tool.name in ["k8s_get_resources", "k8s_describe_resource", "k8s_get_pod_logs", "k8s_get_events"]'
