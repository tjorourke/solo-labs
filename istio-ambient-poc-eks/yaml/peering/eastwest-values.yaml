# Helm values for the Solo `peering` chart: one east-west gateway per cluster.
# The gateway is a ztunnel that terminates the outer HBONE hop from the peer
# cluster. It sits on an INTERNAL NLB: the two VPCs are peered, so nothing
# about the mesh path is reachable from the internet.
# Substitute CLUSTER before applying (eks-a or eks-b).
eastwest:
  create: true
  cluster: CLUSTER
  network: CLUSTER
  service:
    metadata:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
        service.beta.kubernetes.io/aws-load-balancer-internal: "true"
remote:
  create: false
