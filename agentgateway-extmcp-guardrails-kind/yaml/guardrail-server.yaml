# guardrail-mcp: the external ExtMCP policy server (ext_mcp.proto). agentgateway
# speaks cleartext HTTP/2 (h2c) to it, so the Service must declare that
# appProtocol or agentgateway falls back to HTTP/1.1 and the calls fail.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrail-mcp
  namespace: extmcp-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guardrail-mcp
  template:
    metadata:
      labels:
        app: guardrail-mcp
    spec:
      containers:
      - name: server
        image: guardrail-mcp:lab
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4445
---
apiVersion: v1
kind: Service
metadata:
  name: guardrail-mcp
  namespace: extmcp-demo
spec:
  selector:
    app: guardrail-mcp
  ports:
  - name: grpc
    port: 4445
    targetPort: 4445
    appProtocol: kubernetes.io/h2c
