# The restricted AI backend a red agent's model traffic is redirected through.
#
# prompt.prepend puts a system message in front of every request the agent makes,
# with no involvement from the agent. Its job here is narrow: get the agent to
# EXPLAIN ITSELF just before it acts, so the person approving sees a rationale and a
# blast radius instead of a bare tool name.
#
# The wording matters more than it looks. An earlier version said changes "are
# reviewed by a human before they execute", and the model read that as licence to
# stop and ask the user for permission — so the agent never called the tool at all,
# the real approval never fired, and the user was asked twice for one change. The
# prompt now says the review is automatic and instructs the agent to state its
# reasoning and then MAKE THE CALL. Advisory layers that accidentally add a second
# gate are worse than no advisory layer.
#
# It is also NOT a control. The model can ignore a system message; nothing here
# stops a tool call. That is precisely why the lab pairs it with the extAuth gate
# on the MCP route. Watch the two together and the difference is the point:
#
#   prompt.prepend   asks the agent to behave differently   (advisory)
#   extAuth on /mcp-gated   stops the call until a human agrees   (enforcement)
#
# Verified field path on 2026.7:
#   spec.ai.groups[].providers[].policies.ai.prompt.prepend[] -> {role, content}
#
# The nesting matters. `prompt` lives inside the per-provider `policies.ai` block,
# not at the top of spec.ai. Some ai policies (notably promptGuard) silently no-op
# when attached at the wrong level on a groups[]-shaped backend, so a config that
# applies cleanly can still do nothing. Confirm with a real request, not with
# `kubectl get -o yaml`.
#
# __LB__ is substituted with the ingress LoadBalancer IP by 07-verdict.sh.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: restricted-anthropic
  namespace: agentgateway-system
spec:
  ai:
    groups:
      - providers:
          - name: anthropic
            anthropic:
              model: claude-haiku-4-5
            policies:
              ai:
                # Declare the API shape per path, or the gateway cannot parse the
                # body and the agent gets:
                #   litellm.ServiceUnavailableError: AnthropicException -
                #   processing failed: failed to marshal request: missing field `type`
                #
                # ADK's LiteLLM client POSTs the Anthropic Messages API to
                # /v1/messages. Without this map the gateway does not know that is
                # what it is looking at, so it cannot apply any ai policy to it —
                # including the prompt.prepend below, which is the whole point of
                # this backend.
                routes:
                  "/v1/messages": Messages
                prompt:
                  prepend:
                    - role: system
                      content: |
                        CONTEXT — set by the platform team, not by the user and
                        not by your own instructions.

                        Every call you make to a tool that changes state is
                        reviewed and approved automatically by a separate system
                        before it executes. You do not need to ask the user for
                        permission, and you must not stop to request confirmation.

                        Immediately before each call to restart_deployment or
                        scale_deployment, state in one or two sentences: what you
                        are about to change, which evidence led you there, and the
                        blast radius. Then MAKE THE CALL. A reviewer reads that
                        statement to decide, so write it for them.

                        A call may take several minutes to return while it is
                        reviewed. That is expected. Do not retry it and do not
                        treat the delay as a failure.

        # A single provider group, so no routing decision to make. The AI backend
        # exists here purely as the attachment point for the prompt policy.
---
# The route that puts the restricted backend on a hostname the red agent's
# LiteLLM client can reach. ADK's Anthropic client posts to /v1/messages, so the
# route has to match that path for the backend to see the request at all — a
# bare "/" match forwards it but the AI policies never engage.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: restricted-llm
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: verdict-ingress
      namespace: agentgateway-system
  hostnames:
    - "llm.__LB__.sslip.io"
  rules:
    - matches:
        - path: { type: PathPrefix, value: /v1 }
      backendRefs:
        - name: restricted-anthropic
          group: enterpriseagentgateway.solo.io
          kind: EnterpriseAgentgatewayBackend
