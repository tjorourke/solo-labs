# HTTPRoutes for the two platform services the host needs to reach by name:
# Keycloak (OIDC issuer) and the AgentRegistry API (what arctl talks to).
#
# __LB__ is substituted with the ingress LoadBalancer IP by 03-keycloak.sh.
#
# The MCP routes are NOT here. They live in yaml/agentgateway/10-mcp-routes.yaml
# because they are the ones the verdict decides between, and keeping them
# separate makes it obvious which routes are part of the control story.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: ar-keycloak
spec:
  parentRefs:
    - name: verdict-ingress
      namespace: agentgateway-system
  hostnames:
    - "keycloak.__LB__.sslip.io"
  rules:
    - backendRefs:
        - name: keycloak
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentregistry
  namespace: agentregistry-system
spec:
  parentRefs:
    - name: verdict-ingress
      namespace: agentgateway-system
  hostnames:
    - "agentregistry.__LB__.sslip.io"
  rules:
    - backendRefs:
        - name: agentregistry-enterprise-server
          port: 12121
---
# The Solo Enterprise UI. This is where the approval card appears, and it is the
# Enterprise product — NOT the OSS kagent dashboard. Two things follow from that:
#
#   * It ships in the separate `management` chart (solo-enterprise-helm/charts/
#     management), not in the kagent chart. Setting ui.enabled=true on the kagent
#     chart deploys the OSS dashboard instead, which is not what an Enterprise
#     customer runs.
#   * It authenticates against Keycloak, so it needs the realm's kagent-ui
#     (public, PKCE) and kagent-backend (confidential) clients. Reaching it without
#     that returns "Failed to get user ID: no session found".
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent-ui
  namespace: solo-mgmt
spec:
  parentRefs:
    - name: verdict-ingress
      namespace: agentgateway-system
  hostnames:
    - "kagent.__LB__.sslip.io"
  rules:
    - backendRefs:
        - name: solo-enterprise-ui
          port: 80
