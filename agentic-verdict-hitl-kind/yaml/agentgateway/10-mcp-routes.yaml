# The route to the MCP server the agents share.
#
# One route, one endpoint, one tool set. All three agents ask for the same URL and
# get it. Nothing about the approval decision is expressed here, because approval is
# enforced inside kagent and the agent's own toolsets, not in front of the server.
#
# __LB__ is substituted with the ingress LoadBalancer IP by 05-mcp.sh.
#
# Path: FastMCP's streamable_http_app() serves at /mcp INSIDE whatever it is mounted
# under, and the server mounts it at "/". So the real upstream endpoint is /mcp —
# verified in-pod: / returns 404, /mcp returns 200. The route therefore must NOT
# rewrite, since the match path and the upstream path are already the same.
# Rewriting to "/" makes the server 404, which reaches the agent as an opaque MCP
# connection failure with no hint that the path is wrong.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-open
  namespace: sre-tools
spec:
  parentRefs:
    - name: verdict-ingress
      namespace: agentgateway-system
  hostnames:
    - "mcp.__LB__.sslip.io"
  rules:
    - matches:
        - path: { type: PathPrefix, value: /mcp }
      backendRefs:
        - name: sre-tools
          port: 8080
