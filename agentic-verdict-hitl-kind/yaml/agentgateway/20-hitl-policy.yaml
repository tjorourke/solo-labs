# The gate. Every MCP call across a route labelled hitl.platform.solo.io/gated
# parks at hitl-extauth until a human approves or rejects it.
#
# Attached by LABEL, not by name. targetSelectors (2026.7.0 and later) means the
# platform team writes this policy once and any route they label comes under the
# gate. Nothing here names an agent, and the agents cannot see it.
#
# Three schema constraints this manifest is shaped around, all enforced by CEL
# rules on the CRD:
#
#  1. `phase: PreRouting` may only target a Gateway, ListenerSet, Service or
#     ServiceEntry — NOT an HTTPRoute. Because we want the gate scoped to one
#     route, phase is left at its default (PostRouting). ext-auth still runs
#     before the request reaches the MCP server, so a rejected call never lands.
#     Setting phase: PreRouting here is rejected at apply time.
#  2. Exactly one of targetRefs / targetSelectors may be set, never both.
#  3. At most one of extAuth / entExtAuth. We use `extAuth` because hitl-extauth
#     is a plain custom gRPC Authorization service; `entExtAuth` is for the Solo
#     ext-auth-service and wants an AuthConfig instead.
#
# failureMode: FailClosed is the whole point. If the approval service is down, a
# red agent's mutating calls fail rather than sail through ungated. A HITL gate
# that fails open is not a gate.
#
# forwardBody pulls the JSON-RPC body into the Check() request so the approval UI
# can say "restart_deployment(name=checkout)" instead of "some MCP call". The
# gating decision does not depend on the body — the route is what decides.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: mcp-hitl-gate
  namespace: sre-tools
spec:
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      matchLabels:
        hitl.platform.solo.io/gated: "true"
  traffic:
    extAuth:
      backendRef:
        name: hitl-extauth
        namespace: hitl
        port: 9001
      grpc: {}
      forwardBody:
        maxSize: 65536
      failureMode: FailClosed
