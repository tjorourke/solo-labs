# Extra RBAC for Kyverno, so the verdict policy can discover addresses instead of
# being told them.
#
# The policy uses an `apiCall` context to read the gated HTTPRoute and build the
# redirect URL from the route's own hostname and path. Kyverno's default ClusterRole
# does not include gateway.networking.k8s.io, so without this the apiCall fails, the
# rule errors, and the agent is not admitted. That is the correct direction to fail
# for a security control, but it looks like a broken policy, so grant the read.
#
# Kyverno aggregates any ClusterRole carrying the label below into its own
# admission-controller role (confirmed with:
#   kubectl get clusterrole kyverno:admission-controller -o jsonpath='{.aggregationRule}'
# ). Read-only, and only the two Gateway API kinds the policy actually reads.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:verdict-hitl-read-gateway-api
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "gateways"]
    verbs: ["get", "list", "watch"]
