# THE CONTROL. One policy that puts a human in front of an agent whose developer
# never agreed to it, never implemented it, and cannot remove it.
#
# It reads one ConfigMap — the risk register — and for any agent named there it
# imposes approval. HOW it imposes it depends on what kind of agent it is, because
# kagent gives you two different surfaces:
#
#   spec.type: Declarative   kagent knows the agent's tool list, so it can gate the
#                            tools itself. Adding requireApproval makes the approval
#                            appear in the kagent chat UI. This is the good path:
#                            native surface, nothing extra to run.
#
#   spec.type: BYO           kagent only knows "run this image" — spec.byo has a
#                            single field, `deployment`, and no tool list, so there
#                            is nowhere to put requireApproval. The gate has to move
#                            outside the agent, to the gateway, by redirecting the
#                            agent's MCP traffic onto a route that holds every call
#                            until a human decides.
#
# Both are in ONE ClusterPolicy on purpose. It is one decision with two
# implementations, and `spec.type` in each rule's preconditions is what picks the
# implementation. Splitting them across two policy objects made it look like two
# unrelated features and meant two things to install and keep in step.
#
# ── Where the addresses come from ────────────────────────────────────────────────
#
# Nowhere. They are discovered.
#
# The BYO rule needs the URL of the gated route. Rather than being told it in config,
# the policy reads it off the route itself with an apiCall context: the hostname from
# spec.hostnames[0] and the path from the route's own path match. The HTTPRoute is
# the single source of truth, so there is nothing to keep in sync and the same policy
# works unmodified on any cluster.
#
# This replaced two earlier attempts, both worse:
#   - Putting the cluster's ingress IP in the risk register. That mixed a security
#     decision with a deployment detail, and every cluster had to edit the register.
#   - Rewriting only the path in place with
#     replace_all(element.value, '/mcp"', '/mcp-gated"'), which needs no address at
#     all but does not work: patchesJson6902 is a literal block scalar, so YAML's ''
#     escape never fires and JMESPath receives the doubled quotes verbatim. Matching
#     a bare '/mcp' is not an option either — it also matches the '//mcp' inside
#     'http://mcp.<host>', so replace_all would corrupt the hostname too.
#
# apiCall needs RBAC that Kyverno does not have by default. yaml/kyverno/05-rbac.yaml
# grants it via an aggregated ClusterRole. Without that the rule errors and the agent
# is not admitted, which is the right way round for a control.
#
# ── Why a ConfigMap register and not a label on the Agent ────────────────────────
#
# The register is readable at admission, so the mutation fires on CREATE and the
# agent never serves a request ungated. A label could only be applied after
# AgentRegistry created the resource, leaving a window — brief, but a window — where
# a red agent is running with nothing gating it. It also means an agent can be marked
# red before it has ever been deployed.
#
# The policy still writes a verdict label, as a record for humans. Do not key
# enforcement off it.
#
# ── The two traps ────────────────────────────────────────────────────────────────
#
# 1. patchesJson6902, never patchStrategicMerge, for anything touching a list. The
#    Agent CRD has no merge key for spec.byo.deployment.env, so a strategic merge
#    replaces the WHOLE list and silently drops the registry-injected MCP wiring and
#    the model key. Labels are a map, so a strategic merge is safe there.
# 2. Patch by {{ elementIndex }} from a foreach, never a fixed index. The env order
#    is set by AgentRegistry plus other injecting webhooks, so /env/0/value will
#    eventually patch the wrong variable.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verdict-hitl-enrolment
  annotations:
    policies.kyverno.io/title: Put a human in front of agents named red
    policies.kyverno.io/category: Platform
    policies.kyverno.io/description: >-
      Agents named on the red list of the agent-risk-register ConfigMap get human
      approval imposed on their state-changing tools. Declarative agents get
      requireApproval, so the approval appears in the kagent UI. BYO agents have
      their MCP traffic redirected onto a gateway route that parks every call until
      a human decides. Applied at admission, so it is in force before the agent
      serves a single request.
spec:
  background: false            # admission-time only; mutating policy
  rules:

    # ══ THE GOOD PATH: Declarative agents, gated by kagent itself ═══════════════
    #
    # Adds the mutating tools to requireApproval. kagent then pauses the agent and
    # renders an approval card in its chat UI. No gateway involved, no approval
    # service to run.
    #
    # Only fires when both tools are ALREADY in toolNames. A CEL rule on the Agent
    # CRD requires every requireApproval entry to appear in toolNames, so patching
    # an agent that left toolNames empty would produce a resource the API server
    # rejects — the deploy would fail rather than the agent being gated. Skipping
    # quietly is the correct failure here.
    - name: native-approval-declarative
      match:
        any:
          - resources:
              kinds: [kagent.dev/v1alpha2/Agent]
              namespaces: [kagent]
      context:
        - name: register
          configMap:
            name: agent-risk-register
            namespace: kyverno
      preconditions:
        all:
          - key: "{{ request.object.spec.type || '' }}"
            operator: Equals
            value: Declarative
        any:
          - key: "{{ contains(split(register.data.red || '', ','), request.object.metadata.name) }}"
            operator: Equals
            value: true
          - key: "{{ register.data.default || 'green' }}"
            operator: Equals
            value: red
      mutate:
        foreach:
          - list: "request.object.spec.declarative.tools"
            preconditions:
              all:
                - key: "{{ element.type || '' }}"
                  operator: Equals
                  value: McpServer
                # Idempotence: re-applies arrive as admission UPDATEs.
                - key: "{{ element.mcpServer.requireApproval || `[]` | length(@) }}"
                  operator: Equals
                  value: 0
                - key: restart_deployment
                  operator: AnyIn
                  value: "{{ element.mcpServer.toolNames || `[]` }}"
                - key: scale_deployment
                  operator: AnyIn
                  value: "{{ element.mcpServer.toolNames || `[]` }}"
            patchesJson6902: |-
              - op: add
                path: "/spec/declarative/tools/{{ elementIndex }}/mcpServer/requireApproval"
                value: ["restart_deployment", "scale_deployment"]

    # ══ THE FALLBACK: BYO agents, gated at the gateway ══════════════════════════
    #
    # kagent cannot see this agent's tools, so instead we change where its tools
    # come from. The gated route's URL is discovered from the route itself.
    - name: gateway-gate-byo
      match:
        any:
          - resources:
              kinds: [kagent.dev/v1alpha2/Agent]
              namespaces: [kagent]
      context:
        - name: register
          configMap:
            name: agent-risk-register
            namespace: kyverno
        # Read the gated route and build its URL from what it actually says.
        - name: gatedRoute
          apiCall:
            urlPath: "/apis/gateway.networking.k8s.io/v1/namespaces/sre-tools/httproutes/mcp-gated"
            jmesPath: "spec"
        - name: gatedUrl
          variable:
            value: "http://{{ gatedRoute.hostnames[0] }}{{ gatedRoute.rules[0].matches[0].path.value }}"
      preconditions:
        all:
          - key: "{{ request.object.spec.type || '' }}"
            operator: Equals
            value: BYO
        any:
          - key: "{{ contains(split(register.data.red || '', ','), request.object.metadata.name) }}"
            operator: Equals
            value: true
          - key: "{{ register.data.default || 'green' }}"
            operator: Equals
            value: red
      mutate:
        foreach:
          - list: "request.object.spec.byo.deployment.env"
            preconditions:
              all:
                - key: "{{ element.name }}"
                  operator: Equals
                  value: MCP_SERVERS_CONFIG
            patchesJson6902: |-
              - op: replace
                path: "/spec/byo/deployment/env/{{ elementIndex }}/value"
                value: '[{"name":"sre-tools","type":"remote","url":"{{ gatedUrl }}"}]'

    # ══ OPTIONAL: send a BYO agent's model calls through the gateway ════════════
    #
    # Advisory only. Lets the gateway prepend a system message so the agent explains
    # itself before acting. Prevents nothing — see 30-restricted-llm.yaml. The
    # backend's own route is the source of truth for the address.
    - name: restrict-model-traffic-byo
      match:
        any:
          - resources:
              kinds: [kagent.dev/v1alpha2/Agent]
              namespaces: [kagent]
      context:
        - name: register
          configMap:
            name: agent-risk-register
            namespace: kyverno
        - name: llmHost
          apiCall:
            urlPath: "/apis/gateway.networking.k8s.io/v1/namespaces/agentgateway-system/httproutes/restricted-llm"
            jmesPath: "spec.hostnames[0]"
      preconditions:
        all:
          - key: "{{ request.object.spec.type || '' }}"
            operator: Equals
            value: BYO
          - key: "{{ request.object.spec.byo.deployment.env[?name=='ANTHROPIC_API_BASE'] | length(@) }}"
            operator: Equals
            value: 0
        any:
          - key: "{{ contains(split(register.data.red || '', ','), request.object.metadata.name) }}"
            operator: Equals
            value: true
          - key: "{{ register.data.default || 'green' }}"
            operator: Equals
            value: red
      mutate:
        patchesJson6902: |-
          - op: add
            path: "/spec/byo/deployment/env/-"
            value:
              name: ANTHROPIC_API_BASE
              value: "http://{{ llmHost }}"

    # ══ RECORD THE DECISION, for humans reading the cluster ═════════════════════
    # Two plain rules rather than one clever expression. The label is a record, not
    # the mechanism.
    - name: label-red
      match:
        any:
          - resources:
              kinds: [kagent.dev/v1alpha2/Agent]
              namespaces: [kagent]
      context:
        - name: register
          configMap:
            name: agent-risk-register
            namespace: kyverno
      preconditions:
        any:
          - key: "{{ contains(split(register.data.red || '', ','), request.object.metadata.name) }}"
            operator: Equals
            value: true
          - key: "{{ register.data.default || 'green' }}"
            operator: Equals
            value: red
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              risk.platform.solo.io/verdict: red

    - name: label-green
      match:
        any:
          - resources:
              kinds: [kagent.dev/v1alpha2/Agent]
              namespaces: [kagent]
      context:
        - name: register
          configMap:
            name: agent-risk-register
            namespace: kyverno
      preconditions:
        all:
          - key: "{{ contains(split(register.data.red || '', ','), request.object.metadata.name) }}"
            operator: Equals
            value: false
          - key: "{{ register.data.default || 'green' }}"
            operator: NotEquals
            value: red
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              risk.platform.solo.io/verdict: green
