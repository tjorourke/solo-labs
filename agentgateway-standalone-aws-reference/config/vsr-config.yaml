version: v0.3
listeners: []
providers:
  defaults:
    model: gpt-4.1
  models:
    - name: gpt-4.1
      provider_model_id: gpt-4.1
      api_format: openai
      backend_refs:
        - name: openai
          endpoint: api.openai.com:443
          weight: 1
    - name: gpt-5.4
      provider_model_id: gpt-5.4
      api_format: openai
      backend_refs:
        - name: openai
          endpoint: api.openai.com:443
          weight: 1
    - name: claude-haiku-4-5-20251001
      provider_model_id: claude-haiku-4-5-20251001
      api_format: openai
      backend_refs:
        - name: anthropic
          endpoint: api.anthropic.com:443
          weight: 1
    - name: claude-sonnet-4-6
      provider_model_id: claude-sonnet-4-6
      api_format: openai
      backend_refs:
        - name: anthropic
          endpoint: api.anthropic.com:443
          weight: 1
routing:
  strategy: priority
  modelCards:
    - name: gpt-4.1
    - name: gpt-5.4
    - name: claude-haiku-4-5-20251001
    - name: claude-sonnet-4-6
  # SIGNALS - what the router looks for in the request.
  # `keywords` is the categorisation itself: a named signal ("stem") that
  # fires when the prompt contains any of these words. Add more signal
  # blocks here for more categories (e.g. "legal", "code") - each becomes
  # a condition you can reference in a decision below.
  signals:
    keywords:
      - name: stem
        operator: OR
        keywords:
          - quantum physics
          - physics
          - chemistry
          - biology
          - mathematics
          - engineering
        case_sensitive: false
    # role_bindings maps the caller's group (read from the
    # x-entitlement-tier header, set in global.services.authz below) to a
    # named role a decision can require.
    role_bindings:
      - name: basic-tier
        role: basic
        subjects:
          - kind: Group
            name: basic
      - name: standard-tier
        role: standard
        subjects:
          - kind: Group
            name: standard
      - name: pro-tier
        role: pro
        subjects:
          - kind: Group
            name: pro
  # DECISIONS - the actual routing table. Each one is a named rule:
  # "if these conditions all hold, send it to this model." Priority breaks
  # ties when more than one decision could match; higher goes first. This
  # is the part to copy and extend for your own categories - add a
  # decision per (tier x category) combination you want to route
  # differently, referencing a signal/role_binding name from above.
  decisions:
    - name: basic_stem
      priority: 100
      rules:
        operator: AND
        conditions:
          - type: authz
            name: basic
          - type: keyword
            name: stem
      modelRefs:
        - model: gpt-5.4
          use_reasoning: false
    - name: standard_stem
      priority: 100
      rules:
        operator: AND
        conditions:
          - type: authz
            name: standard
          - type: keyword
            name: stem
      modelRefs:
        - model: claude-haiku-4-5-20251001
          use_reasoning: false
    - name: pro_stem
      priority: 100
      rules:
        operator: AND
        conditions:
          - type: authz
            name: pro
          - type: keyword
            name: stem
      modelRefs:
        - model: claude-sonnet-4-6
          use_reasoning: false
global:
  router:
    config_source: file
    auto_model_name: auto
    clear_route_cache: false
    model_selection:
      enabled: false
    streamed_body:
      enabled: true
      max_bytes: 10485760
      timeout_sec: 30
    # Agentgateway sends this header on its subsequent processing pass.
    skip_processing:
      enabled: true
  services:
    observability:
      tracing:
        enabled: false
    # This is where x-entitlement-tier and x-authz-user-id (the headers
    # agentgateway's extProc.conditional checks for) get read as the
    # caller's identity/group for the role_bindings above.
    authz:
      fail_open: false
      identity:
        user_id_header: x-authz-user-id
        user_groups_header: x-entitlement-tier
      providers: []
    ratelimit:
      providers: []
  model_catalog:
    kbs: []
    embeddings: null
    modules: null
  integrations:
    tools:
      enabled: false
  stores:
    memory: null
    response_cache:
      enabled: false
    vector_store:
      enabled: false
