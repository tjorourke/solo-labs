# Validate before ext-auth, retaining the token only for identity extraction.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata: {name: sts-jwt, namespace: agentgateway-system}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: hitl-gateway}]
  traffic:
    jwtAuthentication:
      mode: Strict
      preserveToken: true
      providers:
      - issuer: enterprise-agentgateway.agentgateway-system.svc.cluster.local:7777
        audiences: [hitl-mcp]
        jwks:
          remote:
            jwksPath: /.well-known/jwks.json
            backendRef: {group: "", kind: Service, name: enterprise-agentgateway, namespace: agentgateway-system, port: 7777}
