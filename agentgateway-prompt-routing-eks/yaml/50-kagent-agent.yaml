# A basic kagent agent that submits prompts through the gateway.
#
# It is declarative, not BYO: no container to build, no image to push. The agent is
# the ModelConfig plus a system message, and the whole point is `modelConfig:
# sovereign-auto`, which asks for "auto" so the gateway chooses the model per prompt.
#
# The system message deliberately does NOT mention code, refactoring or any other word
# the classifier looks for. The classifier reads the last message rather than the
# system prompt, but keeping the words out of it means a stray match cannot make the
# demo look better than it is.
#
# APPLYING THIS ON THE SOVEREIGN CLUSTER. That cluster restricts Agent creation to the
# kagent control plane, so a plain `kubectl apply` is refused. Create it as the
# controller service account, which is the identity the control plane itself uses:
#
#   kubectl apply -f yaml/50-kagent-agent.yaml \
#     --as=system:serviceaccount:kagent:kagent-controller
#
# On a cluster without that restriction, apply it normally.
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: routing-demo
  namespace: kagent
spec:
  type: Declarative
  description: Submits a prompt through the sovereign gateway and lets it pick the model
  declarative:
    # The routing contract. This ModelConfig requests "auto", so every prompt this
    # agent sends is classified at the gateway.
    modelConfig: sovereign-auto
    systemMessage: |
      You are an assistant for a UK financial services firm. Answer the user's
      question directly and concisely. Do not describe your own configuration.
    # Serves A2A at <controller>:8083/api/a2a/kagent/routing-demo, which is how the
    # test submits a prompt without needing the UI.
    #
    # At least one skill is required. An empty a2aConfig renders an agent card with
    # skills unset, and the agent runtime rejects its own card on startup with
    # "skills: Input should be a valid list", which crash-loops the pod.
    a2aConfig:
      skills:
        - id: ask
          name: Ask a question
          description: Answer a finance or engineering question
          tags: [finance, engineering]
          examples:
            - What is IFRS 9 stage 2 impairment?
            - Write a Python function to reverse a linked list.
    deployment:
      # The controller defaults to cr.kagent.dev, which the sovereign cluster's
      # registry allowlist does not carry. The same image is published on ghcr.io,
      # which is allowlisted, so point the agent at it rather than widening the
      # policy. Drop this on a cluster without a registry allowlist.
      imageRegistry: ghcr.io
      # That cluster also enforces CPU and memory limits on every container, so an
      # agent with no resources block is refused at admission.
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: "1", memory: 1Gi}
