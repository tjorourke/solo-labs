# agentgateway v1.4.1 (OSS, standalone) fronting the ops-mcp server.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-config
  namespace: mcp-2026
data:
  config.yaml: |
    mcp:
      port: 3000
      targets:
      - name: ops
        mcp:
          host: http://ops-mcp.mcp-2026.svc.cluster.local:8000/mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: mcp-2026
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentgateway
  template:
    metadata:
      labels:
        app: agentgateway
    spec:
      containers:
      - name: agentgateway
        image: ghcr.io/agentgateway/agentgateway:v1.4.1
        args: ["-f", "/etc/agentgateway/config.yaml"]
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: config
          mountPath: /etc/agentgateway
      volumes:
      - name: config
        configMap:
          name: agentgateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  namespace: mcp-2026
spec:
  type: NodePort
  selector:
    app: agentgateway
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30080
