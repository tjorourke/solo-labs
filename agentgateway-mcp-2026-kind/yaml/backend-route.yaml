# The MCP backend and the route that binds it to the gateway.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: ops-mcp
  namespace: mcp-2026
spec:
  mcp:
    targets:
    - name: ops
      static:
        backendRef:
          name: ops-mcp
        port: 8000
        path: /mcp
        protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
  namespace: mcp-2026
spec:
  parentRefs:
  - name: mcp-gw
  rules:
  - backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: ops-mcp
