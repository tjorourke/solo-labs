# 3 of 3. Point the route's prompt guard at the adapter listener.
# The Enterprise manifest in ../yaml/ is verified live on enterprise-agentgateway
# 2026.8.2. This is a group and kind swap of it; the OSS run is still pending.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: external-guardrail-declarative
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: anthropic
  backend:
    ai:
      promptGuard:
        request:
          - webhook:
              # The adapter proxy is unreachable, not the vendor: the gateway decides.
              failureMode: FailClosed
              backendRef:
                kind: Service
                name: guard-adapter
                port: 8081
        response:
          - webhook:
              failureMode: FailClosed
              backendRef:
                kind: Service
                name: guard-adapter
                port: 8081
