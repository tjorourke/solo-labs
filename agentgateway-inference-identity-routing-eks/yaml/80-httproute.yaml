# The route answers one question: which backend gets this request. Four rules, two
# headers, both written inside the gateway before the route is chosen.
#
# x-routing-target is OPA's: self-hosted, openai or anthropic. x-selected-model is the
# router's: general or code. A frontier target needs the first header only, because the
# frontier backend resolves the class itself through its aliases. The self-hosted target
# needs both, because the two open-weight models are two vLLM servers and therefore two
# backends. No user names, no model names beyond the two logical ones, and no catch-all:
# a request with no target header, which can only happen if extAuth did not run, gets a
# 404 rather than a default.
#
# The internal headers are removed here, after the match and before any backend sees the
# request. They cannot be removed earlier, because the route needs them to match.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: identity-routing
  namespace: agentgateway-system
spec:
  hostnames:
    - model-gateway.agentgateway-system.svc.cluster.local
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: model-gateway
      sectionName: http
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v1/chat/completions}
          headers:
            - {type: Exact, name: x-routing-target, value: self-hosted}
            - {type: Exact, name: x-selected-model, value: general}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [x-routing-user, x-routing-target, x-routing-data, x-routing-tier, x-routing-region, x-selected-model]
      backendRefs:
        - {name: vllm-mistral, group: agentgateway.dev, kind: AgentgatewayBackend}
    - matches:
        - path: {type: PathPrefix, value: /v1/chat/completions}
          headers:
            - {type: Exact, name: x-routing-target, value: self-hosted}
            - {type: Exact, name: x-selected-model, value: code}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [x-routing-user, x-routing-target, x-routing-data, x-routing-tier, x-routing-region, x-selected-model]
      backendRefs:
        - {name: vllm-qwen, group: agentgateway.dev, kind: AgentgatewayBackend}
    - matches:
        - path: {type: PathPrefix, value: /v1/chat/completions}
          headers:
            - {type: Exact, name: x-routing-target, value: openai}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [x-routing-user, x-routing-target, x-routing-data, x-routing-tier, x-routing-region, x-selected-model]
      backendRefs:
        - {name: openai, group: agentgateway.dev, kind: AgentgatewayBackend}
    - matches:
        - path: {type: PathPrefix, value: /v1/chat/completions}
          headers:
            - {type: Exact, name: x-routing-target, value: anthropic}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [x-routing-user, x-routing-target, x-routing-data, x-routing-tier, x-routing-region, x-selected-model]
      backendRefs:
        - {name: anthropic, group: agentgateway.dev, kind: AgentgatewayBackend}
