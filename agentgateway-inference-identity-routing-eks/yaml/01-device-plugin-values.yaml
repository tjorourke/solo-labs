# NVIDIA device plugin, from its Helm chart, handing out whole cards.
#
# No sharing is configured, so each GPU node advertises nvidia.com/gpu: 1 and the scheduler
# puts one vLLM pod on each. Time-slicing would fit both models onto one card, but it shares
# compute by turn and does nothing about memory: the two models divide the card's 96 GB with
# --gpu-memory-utilization, the KV cache shrinks with the share, and each model's context
# window has to shrink to what its cache can hold.
#
# The chart's default node affinity waits for labels that Node Feature Discovery or the
# GPU Feature Discovery sidecar would set (nvidia.com/gpu.present, the PCI vendor label).
# Neither runs here, so with the default the DaemonSet schedules zero pods and the nodes
# advertise no GPU at all. The nodegroup label is the selector instead. null, not {}:
# Helm merges an empty map with the chart default and keeps the affinity.
affinity: null
nodeSelector:
  role: gpu
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
gfd:
  enabled: false
