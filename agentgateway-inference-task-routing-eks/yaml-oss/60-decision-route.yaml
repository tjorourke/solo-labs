# The decision gateway's route. It reads the two headers native AGW CEL wrote.
#
#   pool=private,           class=coding   -> Qwen3-Coder on the GPU
#   pool=private,           class=finance  -> Mistral on the GPU
#   pool=private,           class=telco    -> Mistral on the GPU
#   pool=private,           class=general  -> Mistral on the GPU
#   pool=approved-frontier                 -> Anthropic
#
# No default model. yaml/52-denied-route.yaml is a backendless catch-all so the
# native PostRouting policy can refuse a denied or missing metadata decision.
# The audit envelope is removed before any backend; frontier rules also remove
# the employee identity, routing reason and source repository.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: decision-routing
  namespace: agentgateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: decision-gateway
      sectionName: http
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v1/chat/completions}
          headers:
            - {type: Exact, name: x-model-pool, value: private}
            - {type: Exact, name: x-model-class, value: coding}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [x-model-pool, x-model-class, x-routing-reason, x-routing-user, x-selected-model, x-source-repo]
      backendRefs:
        - {name: vllm-qwen, group: agentgateway.dev, kind: AgentgatewayBackend}
    - matches:
        - path: {type: PathPrefix, value: /v1/chat/completions}
          headers:
            - {type: Exact, name: x-model-pool, value: private}
            - {type: Exact, name: x-model-class, value: finance}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [x-model-pool, x-model-class, x-routing-reason, x-routing-user, x-selected-model, x-source-repo]
      backendRefs:
        - {name: vllm-mistral, group: agentgateway.dev, kind: AgentgatewayBackend}
    - matches:
        - path: {type: PathPrefix, value: /v1/chat/completions}
          headers:
            - {type: Exact, name: x-model-pool, value: private}
            - {type: Exact, name: x-model-class, value: telco}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [x-model-pool, x-model-class, x-routing-reason, x-routing-user, x-selected-model, x-source-repo]
      backendRefs:
        - {name: vllm-mistral, group: agentgateway.dev, kind: AgentgatewayBackend}
    - matches:
        - path: {type: PathPrefix, value: /v1/chat/completions}
          headers:
            - {type: Exact, name: x-model-pool, value: private}
            - {type: Exact, name: x-model-class, value: general}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [x-model-pool, x-model-class, x-routing-reason, x-routing-user, x-selected-model, x-source-repo]
      backendRefs:
        - {name: vllm-mistral, group: agentgateway.dev, kind: AgentgatewayBackend}
    - matches:
        - path: {type: PathPrefix, value: /v1/chat/completions}
          headers:
            - {type: Exact, name: x-model-pool, value: approved-frontier}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [x-model-pool, x-model-class, x-routing-reason, x-routing-user, x-selected-model, x-source-repo]
      backendRefs:
        - {name: anthropic, group: agentgateway.dev, kind: AgentgatewayBackend}
