# The three backends the decision gateway routes to, and the one thing each of them knows:
# what the task labels mean for the model it fronts.
#
# The router wrote a task label into the body's model field. OPA decided the pool and the
# class. The route picks a backend from those two, and the backend's modelAliases turns the
# task label into the model it actually serves. Private coding is Qwen3-Coder, private
# finance and the general default are Mistral, and the approved frontier is Anthropic, for
# generic coding only, so it aliases one label.
#
# The two GPU backends are Part 1's, same names, with their aliases replaced.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: vllm-qwen
  namespace: agentgateway-system
spec:
  ai:
    provider:
      openai:
        model: qwen3-coder-30b
      host: vllm-qwen.models.svc.cluster.local
      port: 8000
      path: /v1/chat/completions
  policies:
    ai:
      # Claude Code posts /v1/messages. Messages in, chat completions out to vLLM, and the
      # chat completion translated back to a Messages response on the way home.
      # Claude Code asks for max_tokens: 64000, which is more than this model's whole
      # context, and vLLM rejects the request outright: "max_completion_tokens=64000
      # cannot be greater than max_model_len". The client is not wrong and the model is
      # not wrong, so the gateway settles it: an override caps every request here,
      # whatever the caller asked for. Measured 2026-09-18 against Claude Code.
      overrides:
        - field: max_tokens
          value: 8192
      routes:
        "/v1/messages": Messages
      modelAliases:
        code_review: qwen3-coder-30b
        code_modification: qwen3-coder-30b
        generic_coding: qwen3-coder-30b
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: vllm-mistral
  namespace: agentgateway-system
spec:
  ai:
    provider:
      openai:
        model: mistral-small-3.2-24b
      host: vllm.models.svc.cluster.local
      port: 8000
      path: /v1/chat/completions
  policies:
    ai:
      # Same translation as vllm-qwen, for the finance and general rows of the table.
      # Claude Code asks for max_tokens: 64000, which is more than this model's whole
      # context, and vLLM rejects the request outright: "max_completion_tokens=64000
      # cannot be greater than max_model_len". The client is not wrong and the model is
      # not wrong, so the gateway settles it: an override caps every request here,
      # whatever the caller asked for. Measured 2026-09-18 against Claude Code.
      overrides:
        - field: max_tokens
          value: 8192
      routes:
        "/v1/messages": Messages
      modelAliases:
        finance: mistral-small-3.2-24b
        uncertain: mistral-small-3.2-24b
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: anthropic
  namespace: agentgateway-system
spec:
  ai:
    provider:
      anthropic: {}
  policies:
    auth:
      secretRef:
        name: anthropic-secret
    ai:
      # Declared for symmetry. Messages is already this provider's own API, so nothing is
      # translated here; the request passes through in the shape Claude Code sent it.
      routes:
        "/v1/messages": Messages
      modelAliases:
        generic_coding: claude-sonnet-5
