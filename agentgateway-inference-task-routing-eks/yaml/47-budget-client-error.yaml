# Claude Code speaks Anthropic Messages. Budget Block returns HTTP 429 with a plain
# text body ("rate limit exceeded"). The intake hop then tries to parse that as JSON
# and Claude sees 502 "expected value at line 1 column 1".
#
# CEL uses response.code, not response.status. The 429 is an upstream response on
# classify-then-decide (decision-gateway -> model-gateway). Rewrite it to OpenAI
# JSON there so the Messages translator can turn it into an Anthropic error.
# Intake still rewrites 429/502 as a backstop.
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: budget-error-openai
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: classify-then-decide
  traffic:
    transformation:
      conditional:
        - condition: 'response.code == 429'
          policy:
            response:
              set:
                - name: content-type
                  value: '"application/json"'
              body: "'{\"error\":{\"message\":\"Daily frontier token budget reached. Use a private model, or wait until the window resets.\",\"type\":\"insufficient_quota\",\"code\":\"budget_exceeded\"}}'"
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: budget-error-anthropic
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: intake-routing
  traffic:
    transformation:
      conditional:
        - condition: 'response.code == 429 || response.code == 502'
          policy:
            response:
              set:
                - name: content-type
                  value: '"application/json"'
              body: "'{\"type\":\"error\",\"error\":{\"type\":\"rate_limit_error\",\"message\":\"Daily frontier token budget reached. Use a private model, or wait until the window resets.\"}}'"
