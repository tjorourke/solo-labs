# The three backends the decision gateway routes to, and what each of them knows:
# what the task labels mean for the model it fronts. Every request reaching them is a chat
# completion, whatever the client sent: the intake hop converts anything else first
# (92-intake-route.yaml).
#
# The router wrote a task label into the body's model field. AGW decided the pool and the
# class. The route picks a backend from those two, and the backend's modelAliases turns the
# task label into the model it actually serves. Private coding is Qwen3-Coder, private
# finance, telco and the general default are Mistral, and the approved frontier is Anthropic, for
# generic coding only, so it aliases one label.
#
# The two GPU backends are Part 1's, same names, with their aliases replaced.
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: vllm-qwen
  namespace: agentgateway-system
spec:
  ai:
    groups:
      # Group 1: the real backend, self-hosted on the GPU nodegroup that gets scaled to
      # zero overnight (project_gpu_nightly_shutdown). Group 2 only serves once
      # 41-backend-failover-health.yaml's eviction policy has marked this one unhealthy.
      - providers:
          - name: vllm-qwen
            openai:
              model: qwen3-coder-30b
            host: vllm-qwen.models.svc.cluster.local
            port: 8000
            path: /v1/chat/completions
      # Group 2: real Claude, so a parked GPU nodegroup degrades the coding class to a
      # live model instead of a dead end. Its own override replaces the task label the
      # modelAliases below wrote onto the request, because Anthropic has never heard of
      # "qwen3-coder-30b". Added 2026-10-01 after excuse-bot/demo-agent/quiz-host-10 (a
      # different cluster's kagent agents, routed through this gateway) 503'd solid every
      # time the GPU nodegroup was parked.
      - providers:
          - name: anthropic-fallback
            anthropic: {}
            policies:
              auth:
                secretRef:
                  name: anthropic-secret
              ai:
                overrides:
                  - field: model
                    value: claude-sonnet-5
                  # Without this, generation got capped at exactly 4096 output
                  # tokens and silently cut off mid-response -- no error, no
                  # retry, just a truncated tool call the caller never saw fail.
                  # Caught live 2026-10-01: dev-bot (a different cluster's kagent
                  # agent, routed through this gateway) mid-generating a
                  # push_files call for a real code change.
                  - field: max_tokens
                    value: 16384
                  - field: max_completion_tokens
                    value: 16384
  policies:
    ai:
      # Claude Code asks for max_tokens: 64000, which is more than this model's whole
      # context, and vLLM rejects the request outright: "max_completion_tokens=64000
      # cannot be greater than max_model_len". The client is not wrong and the model is
      # not wrong, so the gateway settles it: an override caps every request here,
      # whatever the caller asked for, and one request cannot claim the whole window.
      # Measured 2026-09-18 against Claude Code.
      #
      # Both spellings, because the override matches the field name on the request as the
      # backend sees it. An OpenAI client sends max_tokens and is capped by the first
      # entry; Claude Code arrives on /v1/messages and the conversion to chat completions
      # emits max_completion_tokens, which the first entry does not match, so before the
      # second entry existed the cap silently did not apply to the one client the note
      # above names. It showed up as a 400 on Mistral and not on Qwen: 64000 output fits
      # inside Qwen's 262144 window whatever the prompt, and crosses Mistral's 131072 as
      # soon as the conversation passes about 67k tokens, which an agent session does
      # almost immediately. Measured 2026-09-19.
      overrides:
        - field: max_tokens
          value: 32768
        - field: max_completion_tokens
          value: 32768
      modelAliases:
        code_review: qwen3-coder-30b
        code_modification: qwen3-coder-30b
        generic_coding: qwen3-coder-30b
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: vllm-mistral
  namespace: agentgateway-system
spec:
  ai:
    groups:
      # Group 1: the real backend, self-hosted on the GPU nodegroup that gets scaled to
      # zero overnight (project_gpu_nightly_shutdown). Group 2 only serves once
      # 41-backend-failover-health.yaml's eviction policy has marked this one unhealthy.
      - providers:
          - name: vllm-mistral
            openai:
              model: mistral-small-3.2-24b
            host: vllm.models.svc.cluster.local
            port: 8000
            path: /v1/chat/completions
      # Group 2: real Claude, so a parked GPU nodegroup degrades finance/telco/general to
      # a live model instead of a dead end. Its own override replaces the task label the
      # modelAliases below wrote onto the request, because Anthropic has never heard of
      # "mistral-small-3.2-24b". Added 2026-10-01, same incident as vllm-qwen above.
      - providers:
          - name: anthropic-fallback
            anthropic: {}
            policies:
              auth:
                secretRef:
                  name: anthropic-secret
              ai:
                overrides:
                  - field: model
                    value: claude-haiku-4-5
                  # Same gotcha as vllm-qwen's fallback above: no override here meant
                  # generation silently capped at 4096 output tokens with no error.
                  - field: max_tokens
                    value: 16384
                  - field: max_completion_tokens
                    value: 16384
  policies:
    ai:
      # Claude Code asks for max_tokens: 64000, which is more than this model's whole
      # context, and vLLM rejects the request outright: "max_completion_tokens=64000
      # cannot be greater than max_model_len". The client is not wrong and the model is
      # not wrong, so the gateway settles it: an override caps every request here,
      # whatever the caller asked for, and one request cannot claim the whole window.
      # Measured 2026-09-18 against Claude Code.
      #
      # Both spellings, because the override matches the field name on the request as the
      # backend sees it. An OpenAI client sends max_tokens and is capped by the first
      # entry; Claude Code arrives on /v1/messages and the conversion to chat completions
      # emits max_completion_tokens, which the first entry does not match, so before the
      # second entry existed the cap silently did not apply to the one client the note
      # above names. It showed up as a 400 on Mistral and not on Qwen: 64000 output fits
      # inside Qwen's 262144 window whatever the prompt, and crosses Mistral's 131072 as
      # soon as the conversation passes about 67k tokens, which an agent session does
      # almost immediately. Measured 2026-09-19.
      overrides:
        - field: max_tokens
          value: 32768
        - field: max_completion_tokens
          value: 32768
      modelAliases:
        finance: mistral-small-3.2-24b
        telco: mistral-small-3.2-24b
        uncertain: mistral-small-3.2-24b
      # Mistral requires system instructions before user/assistant/tool turns. Claude
      # can add a system message after tool results, which this tokenizer rejects.
      # Preserve all system text in order in one leading message. Other messages,
      # tool-call IDs and results are unchanged. Native CEL already inspected the original body.
      finalTransformations:
        - field: messages
          expression: >-
            llmRequest.messages.filter(m, m.role == "system").size() == 0 ? llmRequest.messages :
            [{"role": "system", "content": llmRequest.messages.filter(m, m.role == "system").map(m,
              type(m.content) == string ? m.content : m.content.map(p, p.text).join("\n")).join("\n\n")}]
            + llmRequest.messages.filter(m, m.role != "system")
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: anthropic
  namespace: agentgateway-system
spec:
  ai:
    provider:
      anthropic: {}
  policies:
    auth:
      secretRef:
        name: anthropic-secret
    ai:
      modelAliases:
        generic_coding: claude-sonnet-5
