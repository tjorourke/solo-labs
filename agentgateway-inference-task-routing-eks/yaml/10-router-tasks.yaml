# vLLM Semantic Router as a task classifier. This is the whole of the router's job in this
# lab: read the prompt and say what kind of task it is. It writes one of six task labels
# into the request body's model field and into x-selected-model, and nothing else. Where
# the request runs, and which model answers, is decided afterwards by OPA and the route.
#
# The six labels are the rows of the routing table in opa/routing-data.json:
#
#   code_review        look at existing code and report on it
#   code_modification  change existing code
#   generic_coding     a coding question about no particular code
#   finance            the bank's own subject
#   telco              the network itself: radio, core, roaming, the subscriber
#   uncertain          nothing above matched with confidence
#
# Signals. `domains` is the same MMLU-Pro classifier Parts 1 to 3 use. The similarity
# rules under `complexity` are Part 2's mechanism with different banks: two sets of example
# phrasings scored with the mmbert model already on the volume, so review and modification
# are told apart by what they ask for rather than by a word list. `keywords` back them up
# for the short, blunt asks the examples do not cover. The examples are the definition of the signal; the
# test prompts are held out and never appear here.
#
# Priority resolves overlaps: a review of a function is computer science AND a review ask,
# and 60 beats 10, so it is a review rather than generic coding. `uncertain` is
# `default_model`: what the router says when no decision matches, and the routing table
# sends that to a private model, never to the frontier.
# Everything above `config:` is the Helm chart's own settings for the router pod. Everything
# under `config:` becomes the router's config.yaml, mounted from a ConfigMap.
persistence:
  storageClassName: gp3      # the volume the classifier weights are downloaded onto, once
  size: 20Gi

image:
  # Pinned by digest, not tag: chart and image drift independently, and a pair that
  # disagrees can start as a router that passes every request through unclassified.
  repository: ghcr.io/vllm-project/semantic-router/extproc@sha256
  tag: c0519e91c9dfe69066b25766aef40a38b5474e17dcbb1b58c791c451646334e0
  pullPolicy: IfNotPresent   # set, not inherited: the chart's last values document says Never

resources:
  requests:
    cpu: "1"
    memory: 3Gi
  limits:
    cpu: "2"
    memory: 7Gi              # the mmbert classifier does not load in the chart's 2Gi default

config:
  version: v0.3              # the config schema version this build reads

  listeners: []              # the router opens no listener of its own: agentgateway fronts it

  providers:
    defaults:
      default_model: uncertain   # what the router answers when no decision matches
    # Task labels, not models. Anything named here is a value the router may write into the
    # request's model field. backend_refs is required by the schema and never dialled on this
    # path: agentgateway does the forwarding.
    models:
      - name: code_review
        backend_refs: [{name: gateway, endpoint: model-gateway.agentgateway-system.svc.cluster.local:80, weight: 1}]
      - name: code_modification
        backend_refs: [{name: gateway, endpoint: model-gateway.agentgateway-system.svc.cluster.local:80, weight: 1}]
      - name: generic_coding
        backend_refs: [{name: gateway, endpoint: model-gateway.agentgateway-system.svc.cluster.local:80, weight: 1}]
      - name: finance
        backend_refs: [{name: gateway, endpoint: model-gateway.agentgateway-system.svc.cluster.local:80, weight: 1}]
      - name: telco
        backend_refs: [{name: gateway, endpoint: model-gateway.agentgateway-system.svc.cluster.local:80, weight: 1}]
      - name: uncertain
        backend_refs: [{name: gateway, endpoint: model-gateway.agentgateway-system.svc.cluster.local:80, weight: 1}]

  routing:
    signals:
      # Similarity rules. Each one holds two banks of example phrasings and scores a prompt
      # against both: `signal` is hard_score minus easy_score, and the rule returns `hard`
      # above the threshold, `easy` below it, `medium` around it. The router calls this
      # signal `complexity`, after its first use; here the two banks are two kinds of task,
      # so `hard` means "sounds like the first bank". Three rules separate three tasks:
      #
      #   review_vs_generic   review of existing code   against   a coding question about no code
      #   modify_vs_generic   change to existing code   against   a coding question about no code
      #   review_vs_modify    review                    against   change
      #
      # The examples are the definition of the signal. The test prompts are held out and
      # never appear here. Keep both banks of a rule on the same subjects, or the rule learns
      # the subject rather than the shape of the ask.
      complexity:
        - name: review_vs_generic
          description: Looking at existing code, against a question about no code
          threshold: 0.0
          hard:
            candidates:
              - Review this function and point out any problems
              - Look over this code and tell me what is wrong with it
              - Check this method for thread-safety issues
              - Audit this class for security problems
              - Are there any bugs in the following code
              - Give me feedback on this implementation
          easy:
            candidates:
              - Show an example of dependency injection in Java
              - How do I read a file in Python
              - What is the difference between a list and a set
              - Explain how a hash map works
              - Give an example of a REST client in Go
              - How does garbage collection work in the JVM
        - name: modify_vs_generic
          description: Changing existing code, against a question about no code
          threshold: 0.0
          hard:
            candidates:
              - Modify this function so that it handles the new case
              - Change this method to use the new API
              - Refactor this service to remove the duplication
              - Fix the bug in the following code
              - Rewrite this function to be thread safe
              - Update this class to add a retry
          easy:
            candidates:
              - Show an example of dependency injection in Java
              - How do I read a file in Python
              - What is the difference between a list and a set
              - Explain how a hash map works
              - Give an example of a REST client in Go
              - How does garbage collection work in the JVM
        - name: review_vs_modify
          description: Looking at code, against changing it
          threshold: 0.0
          hard:
            candidates:
              - Review this function and point out any problems
              - Look over this code and tell me what is wrong with it
              - Check this method for thread-safety issues
              - Audit this class for security problems
              - Are there any bugs in the following code
              - Give me feedback on this implementation
          easy:
            candidates:
              - Modify this function so that it handles the new case
              - Change this method to use the new API
              - Refactor this service to remove the duplication
              - Fix the bug in the following code
              - Rewrite this function to be thread safe
              - Update this class to add a retry
        # The one rule here whose two banks are deliberately on different subjects. Every
        # other similarity rule keeps both banks on the same subject so it learns the shape
        # of the ask; this one has to learn the subject, because the domain classifier
        # cannot. Its fourteen labels are fixed by the model that was trained on them, and
        # telco is not among them, so a network question lands on engineering, business or
        # other depending on how it is worded. The bank below is the definition of "this is
        # about the network". The easy bank is the rest of the lab: finance, coding, law.
        - name: telco_vs_rest
          description: The operator's own network, against everything else the bank asks
          threshold: 0.0
          hard:
            candidates:
              - How does a 5G network slice guarantee latency for an enterprise customer
              - What happens during an LTE to 5G handover at the cell edge
              - How is a subscriber authenticated when roaming onto a partner network
              - What does the IMS core do when a VoLTE call is set up
              - How should we dimension backhaul capacity for a new base station
              - What is the difference between the radio access network and the mobile core
          easy:
            candidates:
              - What effect does a central bank raising interest rates have on bond prices
              - How do I read a file in Python
              - Explain how a hash map works
              - How should a company account for deferred revenue on multi-year contracts
              - What is the difference between a list and a set
              - Summarise the main provisions of a commercial lease
      keywords:
        - name: review_words
          operator: OR
          method: bm25
          bm25_threshold: 0.01
          keywords: [review, audit, "look over", "any bugs", critique, feedback]
        - name: modify_words
          operator: OR
          method: bm25
          bm25_threshold: 0.01
          keywords: [modify, change, refactor, fix, rewrite, update, "add a", convert, migrate]
        # Nouns, not verbs. The other two keyword rules catch what the prompt asks for; this
        # one catches what it is about, and it is the half of the telco decision that fires
        # on a blunt question the similarity bank has no phrasing for.
        - name: telco_words
          operator: OR
          method: bm25
          bm25_threshold: 0.01
          keywords: [5G, LTE, RAN, "radio access network", gNodeB, eNodeB, VoLTE, IMS,
                     MSISDN, SIM, roaming, "network slice", "network slicing", BSS, OSS,
                     "core network", subscriber, spectrum, "base station", "cell site",
                     MVNO, interconnect, backhaul, "mobile network", tariff, churn]
      domains:
        - name: business
          description: Business, corporate strategy, management, finance, marketing
        - name: economics
          description: Microeconomics, macroeconomics, financial markets, monetary policy, trade
        - name: computer science
          description: Algorithms, data structures, programming, software engineering
        - name: engineering
          description: Engineering disciplines, design, problem-solving, systems
        - name: law
          description: Legal principles, case law, statutory interpretation, legal procedures
        - name: math
          description: Mathematics, algebra, calculus, geometry, statistics
        - name: physics
          description: Physical laws, mechanics, thermodynamics, electromagnetism, quantum physics
        - name: chemistry
          description: Chemical reactions, molecular structures, laboratory techniques
        - name: biology
          description: Molecular biology, genetics, cell biology, ecology, evolution, anatomy
        - name: health
          description: Anatomy, physiology, diseases, treatments, preventive care, nutrition
        - name: psychology
          description: Cognitive processes, behavioral patterns, mental health, developmental psychology
        - name: history
          description: Historical events, time periods, cultures, civilizations
        - name: philosophy
          description: Philosophical traditions, ethics, logic, metaphysics, epistemology
        - name: other
          description: General knowledge and miscellaneous topics

    # A decision is a list of conditions and what to write when they hold. Each condition names
    # a signal kind (`type`) and a rule of that kind (`name`). The names are not built in: they
    # are the rules defined under `signals` above. `review_words` is the keyword rule up there,
    # `computer science` is one of the fourteen domain names, and `review_vs_generic:hard` is a
    # similarity rule plus the band it returned. `operator` says whether all conditions must
    # hold (AND) or any one (OR).
    decisions:
      # Review and modification first. Each has a semantic rule and a keyword rule, so a
      # long ask is caught by its meaning and a short one by its verb. Both semantic rules
      # outrank both keyword rules: a verb in passing must not overrule the shape of the ask.
      - name: code_review_semantic
        description: Looking at existing code
        priority: 60
        rules:
          operator: AND
          conditions:
            - {type: domain, name: computer science}
            - {type: complexity, name: review_vs_generic:hard}
            - {type: complexity, name: review_vs_modify:hard}
        modelRefs: [{model: code_review, use_reasoning: false}]
      - name: code_review_keyword
        description: Looking at existing code, short form
        priority: 58
        rules:
          operator: AND
          conditions:
            - {type: domain, name: computer science}
            - {type: keyword, name: review_words}
        modelRefs: [{model: code_review, use_reasoning: false}]
      - name: code_modification_semantic
        description: Changing existing code
        priority: 59
        rules:
          operator: AND
          conditions:
            - {type: domain, name: computer science}
            - {type: complexity, name: modify_vs_generic:hard}
            - {type: complexity, name: review_vs_modify:easy}
        modelRefs: [{model: code_modification, use_reasoning: false}]
      # Real prompts arrive with the file attached, and a long code block does two things:
      # it dilutes every keyword score, and it hands the domain classifier the vocabulary of
      # the code rather than of the question. Ledger code reads as business, not computer
      # science. These two decisions do not ask the domain classifier at all: a review word
      # plus a prompt that sounds more like a review than a change is a review.
      - name: code_review_in_code
        description: Looking at code that came with the prompt
        priority: 62
        rules:
          operator: AND
          conditions:
            - {type: keyword, name: review_words}
            - {type: complexity, name: review_vs_modify:hard}
        modelRefs: [{model: code_review, use_reasoning: false}]
      - name: code_modification_in_code
        description: Changing code that came with the prompt
        priority: 61
        rules:
          operator: AND
          conditions:
            - {type: keyword, name: modify_words}
            - {type: complexity, name: review_vs_modify:easy}
        modelRefs: [{model: code_modification, use_reasoning: false}]
      - name: code_modification_keyword
        description: Changing existing code, short form
        priority: 57
        rules:
          operator: AND
          conditions:
            - {type: domain, name: computer science}
            - {type: keyword, name: modify_words}
        modelRefs: [{model: code_modification, use_reasoning: false}]
      # Finance is a subject, so the domain classifier is enough.
      - name: finance
        description: The bank's own subject
        priority: 50
        rules:
          operator: OR
          conditions:
            - {type: domain, name: economics}
            - {type: domain, name: business}
        modelRefs: [{model: finance, use_reasoning: false}]
      # Telco outranks everything, and it has to. The code rules' easy banks are all coding
      # examples, so a question about a 5G handover is unlike both banks of review_vs_generic
      # and scores hard against it by a whisker; with telco below them, three network
      # questions in four came back code_review or code_modification. Measured 2026-09-19.
      # Ranking it first is safe because both its signals must hold, and neither fires on a
      # prompt with no network vocabulary in it: "review the settle() method in
      # com.example.internal" has none, so it is still a review. A network question that is
      # genuinely about code ("review the handover logic in our RAN adapter") does come back
      # telco, and goes to Mistral rather than Qwen. That is the cost of ranking a subject
      # above a shape, and it is the right trade for an operator: the subject is the thing
      # that must not leave.
      - name: telco
        description: The operator's own network
        priority: 65
        rules:
          operator: AND
          conditions:
            - {type: keyword, name: telco_words}
            - {type: complexity, name: telco_vs_rest:hard}
        modelRefs: [{model: telco, use_reasoning: false}]
      # Generic coding needs to be clearly generic: computer science AND close to the
      # generic examples. A coding question that is neither review, modification nor
      # generic falls through to uncertain.
      - name: generic_coding
        description: A coding question about no code of ours
        priority: 10
        rules:
          operator: AND
          conditions:
            - {type: domain, name: computer science}
            - {type: complexity, name: review_vs_generic:easy}
            - {type: complexity, name: modify_vs_generic:easy}
        modelRefs: [{model: generic_coding, use_reasoning: false}]

    # The names the decisions may refer to. Same list as providers.models.
    modelCards:
      - name: code_review
      - name: code_modification
      - name: generic_coding
      - name: finance
      - name: telco
      - name: uncertain

  global:
    router:
      strategy: priority     # when several decisions match, the highest priority wins
    stores:
      # Off: a semantic cache would answer a repeated prompt from memory and the gateway
      # would log no upstream, so the routing would look broken while working.
      semantic_cache:
        enabled: false
      memory:
        embedding_model: mmbert
      vector_store:
        embedding_model: mmbert
    observability:
      tracing:
        enabled: false
