# The gateway this lab routes through.
#
# A Gateway on port 80 with no TLS and no external address. That is deliberate: this lab
# is about the routing decision, and everything that would normally sit in front of an
# LLM endpoint (TLS, JWT, rate limits, an external load balancer) is a separate concern
# that would triple the size of it. Put those back for anything real.
#
# WHICH IS WHY THE SERVICE TYPE IS PINNED. The gateway's Service defaults to
# LoadBalancer, so applying the Gateway on its own gets you a public cloud load balancer
# in front of an unauthenticated LLM endpoint, billed by the hour, and nothing on the
# Gateway says so. AgentgatewayParameters overrides the generated Service, and the
# Gateway points at it through spec.infrastructure.parametersRef.
#
# GATEWAY CLASS. `agentgateway` is the OSS class. On Solo Enterprise the class is
# `enterprise-agentgateway` and everything else on this page is unchanged. Check what
# you have with `kubectl get gatewayclass`.
#
# allowedRoutes from Same keeps the routes in this namespace, which is all the lab
# needs and one less thing to reason about.
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayParameters
metadata:
  name: model-gateway-params
  namespace: agentgateway-system
spec:
  service:
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: model-gateway
  namespace: agentgateway-system
spec:
  gatewayClassName: enterprise-agentgateway
  infrastructure:
    parametersRef:
      group: enterpriseagentgateway.solo.io
      kind: EnterpriseAgentgatewayParameters
      name: model-gateway-params
  listeners:
    # The front door, and the reason this lab needs two listeners rather than two Gateways.
    # A policy is evaluated in a fixed order within one listener, and extProc runs before a
    # transformation, so a rewrite the router must see cannot share a listener with it. It can
    # share a Gateway: the normalising policy is attached to this listener by sectionName, its
    # route forwards to the one below, and the request meets the router with the body already
    # fixed. One proxy, two listeners, one extra trip through the same pod.
    - name: intake
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
