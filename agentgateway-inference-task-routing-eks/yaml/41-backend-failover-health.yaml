# Turns the Claude group added to 40-backends.yaml into an actual failover rather than a
# dormant second entry: without a health policy, agentgateway has no reason to ever try
# group 2. Two consecutive failures (a parked GPU nodegroup gives a 503 on every request,
# so that is instant, not flaky) evicts the vLLM provider for 30s; traffic moves to the
# Claude group for the rest of that window, then agentgateway tries vLLM again on its own.
# Proven pattern: local-agw/health-policy.yaml, same shape on OSS AgentgatewayPolicy.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: task-routing-failover-health
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: enterpriseagentgateway.solo.io
      kind: EnterpriseAgentgatewayBackend
      name: vllm-mistral
    - group: enterpriseagentgateway.solo.io
      kind: EnterpriseAgentgatewayBackend
      name: vllm-qwen
  backend:
    health:
      unhealthyCondition: "response.code >= 500"
      eviction:
        duration: 30s
        consecutiveFailures: 2
