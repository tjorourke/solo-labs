# The decision gateway's route. It reads the two headers native AGW CEL wrote.
#
#   pool=private,           class=coding   -> Qwen3-Coder on the GPU
#   pool=private,           class=finance  -> Mistral on the GPU
#   pool=private,           class=telco    -> Mistral on the GPU
#   pool=private,           class=general  -> Mistral on the GPU
#   pool=approved-frontier                 -> Anthropic
#
# No default model. yaml/52-denied-route.yaml is a backendless catch-all so the
# native PostRouting policy can refuse a denied or missing metadata decision.
# The audit envelope is removed before any backend; frontier rules also remove
# the employee identity, routing reason and source repository.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: decision-routing
  namespace: agentgateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: decision-gateway
      sectionName: http
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v1/chat/completions}
          headers:
            - {type: Exact, name: x-model-pool, value: private}
            - {type: Exact, name: x-model-class, value: coding}
      backendRefs:
        - {name: vllm-qwen, group: enterpriseagentgateway.solo.io, kind: EnterpriseAgentgatewayBackend}
    - matches:
        - path: {type: PathPrefix, value: /v1/chat/completions}
          headers:
            - {type: Exact, name: x-model-pool, value: private}
            - {type: Exact, name: x-model-class, value: finance}
      backendRefs:
        - {name: vllm-mistral, group: enterpriseagentgateway.solo.io, kind: EnterpriseAgentgatewayBackend}
    - matches:
        - path: {type: PathPrefix, value: /v1/chat/completions}
          headers:
            - {type: Exact, name: x-model-pool, value: private}
            - {type: Exact, name: x-model-class, value: telco}
      backendRefs:
        - {name: vllm-mistral, group: enterpriseagentgateway.solo.io, kind: EnterpriseAgentgatewayBackend}
    - matches:
        - path: {type: PathPrefix, value: /v1/chat/completions}
          headers:
            - {type: Exact, name: x-model-pool, value: private}
            - {type: Exact, name: x-model-class, value: general}
      backendRefs:
        - {name: vllm-mistral, group: enterpriseagentgateway.solo.io, kind: EnterpriseAgentgatewayBackend}
    - matches:
        - path: {type: PathPrefix, value: /v1/chat/completions}
          headers:
            - {type: Exact, name: x-model-pool, value: approved-frontier}
      filters:
        # Only this rule leaves the cluster, so this is the only place a header could reach a
        # third party. The employee's identity and the repository they were working in are
        # removed here. The routing labels stay on the request: they name a pool and a task,
        # they identify nobody, and the gateway reads them when it records what this request
        # cost, which is how frontier spend is attributed to a task and a pool in the UI.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [x-routing-user, x-routing-reason, x-source-repo]
      backendRefs:
        - {name: anthropic, group: enterpriseagentgateway.solo.io, kind: EnterpriseAgentgatewayBackend}
