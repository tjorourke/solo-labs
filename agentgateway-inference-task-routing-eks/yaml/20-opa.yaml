# An immediate audit event for the live console, using OPA's existing log format.
# This service has no routing data and makes no access-control decision. Native
# AGW PreRouting CEL decides; the PostRouting policy refuses or forwards.
# Separate names allow migration without replacing the old authoriser in place.
apiVersion: v1
kind: ConfigMap
metadata:
  name: routing-audit-config
  namespace: agentgateway-system
data:
  config.yaml: |
    plugins:
      envoy_ext_authz_grpc:
        addr: :9191
        path: routing/result
        grpc-max-recv-msg-size-bytes: 10485760
    decision_logs:
      console: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routing-audit
  namespace: agentgateway-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: routing-audit}
  template:
    metadata:
      labels: {app: routing-audit}
    spec:
      containers:
      - name: audit
        image: openpolicyagent/opa:1.20.2-envoy-static
        args: [run, --server, --config-file=/config/config.yaml, --addr=0.0.0.0:8181, --diagnostic-addr=0.0.0.0:8282, /policy/routing.rego]
        ports:
        - {name: grpc, containerPort: 9191}
        readinessProbe:
          httpGet: {path: '/health?plugins', port: 8282}
        resources:
          requests: {cpu: 50m, memory: 256Mi}
        volumeMounts:
        - {name: config, mountPath: /config}
        - {name: policy, mountPath: /policy}
      volumes:
      - name: config
        configMap: {name: routing-audit-config}
      - name: policy
        configMap: {name: routing-audit-policy}
---
apiVersion: v1
kind: Service
metadata:
  name: routing-audit
  namespace: agentgateway-system
spec:
  selector: {app: routing-audit}
  ports:
  - {name: grpc, port: 9191, targetPort: 9191, appProtocol: grpc}
