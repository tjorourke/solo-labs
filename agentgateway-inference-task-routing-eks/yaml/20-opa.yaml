# Rego evaluates group permissions, task preference and data rules.
# The result reaches AGW through trusted gRPC dynamic metadata, not a header.
# Decision logs also provide the live console's immediate, correlated event.
apiVersion: v1
kind: ConfigMap
metadata:
  name: routing-policy-config
  namespace: agentgateway-system
data:
  config.yaml: |
    plugins:
      envoy_ext_authz_grpc:
        addr: :9191
        path: routing/result
        grpc-max-recv-msg-size-bytes: 10485760
    decision_logs:
      console: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routing-policy
  namespace: agentgateway-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: routing-policy}
  template:
    metadata:
      labels: {app: routing-policy}
    spec:
      containers:
      - name: policy
        image: openpolicyagent/opa:1.20.2-envoy-static
        args: [run, --server, --watch, --config-file=/config/config.yaml, --addr=0.0.0.0:8181, --diagnostic-addr=0.0.0.0:8282, /policy/routing.rego, /data/routing-data.json]
        ports:
        - {name: grpc, containerPort: 9191}
        readinessProbe:
          httpGet: {path: '/health?plugins', port: 8282}
        resources:
          requests: {cpu: 50m, memory: 256Mi}
        volumeMounts:
        - {name: config, mountPath: /config}
        - {name: policy, mountPath: /policy}
        - {name: data, mountPath: /data}
      volumes:
      - name: config
        configMap: {name: routing-policy-config}
      - name: policy
        configMap: {name: routing-policy-code}
      - name: data
        configMap: {name: routing-policy-data}
---
apiVersion: v1
kind: Service
metadata:
  name: routing-policy
  namespace: agentgateway-system
spec:
  selector: {app: routing-policy}
  ports:
  - {name: grpc, port: 9191, targetPort: 9191, appProtocol: grpc}
