# The second Gateway. The classify listener authenticates and classifies; this one decides and
# routes. Native PreRouting CEL sees the task label, verified identity and prompt
# together. PostRouting enforces the result before a model is called. The audit
# transport records the decision but carries no routing or access-control rules.
#
# Internal only: ClusterIP, reached by the classify listener's route and nothing else that
# needs to. It re-validates the bearer token itself (the classify listener preserves it), so a call
# that skips the classify listener still has to carry a real token.
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayParameters
metadata:
  name: decision-gateway-params
  namespace: agentgateway-system
spec:
  service:
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: decision-gateway
  namespace: agentgateway-system
spec:
  gatewayClassName: enterprise-agentgateway
  infrastructure:
    parametersRef:
      group: enterpriseagentgateway.solo.io
      kind: EnterpriseAgentgatewayParameters
      name: decision-gateway-params
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
