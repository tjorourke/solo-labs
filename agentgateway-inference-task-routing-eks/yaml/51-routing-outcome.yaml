# Generated by scripts/render-native-routing.py. Business rules live in opa/routing.rego.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: routing-outcome
  namespace: agentgateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: decision-gateway
  traffic:
    # After route selection, enforce the saved decision before any model call.
    directResponse:
      conditional:
      # Missing metadata or no permitted route returns 403; a blocked prompt returns 422.
      - condition: '!has(metadata.routing) || !(metadata.routing.status in [200, 422])'
        policy:
          status: 403
          headers:
          - name: content-type
            value: application/json
          body: '{"error":{"type":"forbidden","message":"no suitable permitted backend for this task"}}'
      - condition: metadata.routing.status == 422
        policy:
          status: 422
          headers:
          - name: content-type
            value: application/json
          bodyExpression: 'toJson({"error": {"type": "blocked", "message": metadata.routing.error, "param":
            null, "code": null}})'
    # Remove the audit-only header before forwarding an allowed request.
    transformation:
      request:
        remove:
        - x-agw-routing-decision
