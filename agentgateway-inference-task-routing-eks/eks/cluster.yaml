# The cluster for Parts 3 and 4: EKS 1.34, two m6i.xlarge platform nodes and ONE g7e.2xlarge
# GPU node in a single AZ. Part 1's config with the gpu nodegroup at one node, because this
# part puts both open-weight models on one card with the NVIDIA device plugin time-slicing it
# (scripts/platform/20-device-plugin.sh). The AZ is pinned because gp3 volumes are bound to
# the AZ they are created in; a nodegroup spread across AZs can scale up in the wrong one
# and never bind the weights. If EC2 has no g7e capacity in this AZ the nodegroup rolls
# back, and the Auto Scaling group's activity log names one that has stock.
#
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: model-routing
  region: eu-west-2
  version: "1.34"
  tags:
    Owner: torourke
    Project: model-routing-lab

iam:
  withOIDC: true

addons:
  # Without the EBS CSI driver every PVC in the lab stays Pending, and the events blame
  # the volume rather than the missing driver.
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy

managedNodeGroups:
  - name: platform
    instanceType: m6i.xlarge
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 80
    privateNetworking: true
    labels:
      role: platform

  - name: gpu
    instanceType: g7e.2xlarge
    # Two nodes, one model each. The device plugin hands out whole GPUs, so a second
    # model on the same node stays Pending on Insufficient nvidia.com/gpu.
    desiredCapacity: 1
    minSize: 0
    maxSize: 2
    # 200 GB because the vLLM image alone is 9 GB and the weights are pulled through
    # the node before they reach the volume.
    volumeSize: 200
    privateNetworking: true
    availabilityZones:
      - eu-west-2c
    labels:
      role: gpu
    taints:
      # Keeps everything that is not a model off the expensive nodes. The vLLM
      # deployments tolerate it; nothing else does.
      - key: nvidia.com/gpu
        value: "true"
        effect: NoSchedule
