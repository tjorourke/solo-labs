# Run an agent as a gVisor-sandboxed actor on Agent Substrate.
# SandboxAgent is its own kind (NOT Agent + spec.sandbox). The CRD rejects BYO and skills:
# a SandboxAgent must be Declarative. It runs on a substrate WorkerPool (ate.dev), so this
# needs Agent Substrate installed (ate-system + a gVisor worker pool) -- off by default.
#   kubectl apply -f yaml/sandbox/sandbox-agent.yaml
apiVersion: kagent.dev/v1alpha2
kind: SandboxAgent
metadata: { name: mathbot-sandboxed, namespace: kagent }
spec:
  type: Declarative                    # BYO is not supported for SandboxAgents
  description: A math agent, run as a gVisor-sandboxed actor on Agent Substrate.
  declarative:
    runtime: go                        # built-in ADK runtime: go | python
    modelConfig: default-model-config
    systemMessage: |
      You are a concise calculator running inside a gVisor-sandboxed actor.
      Use the get-sum tool for arithmetic and reply with just the result.
    tools:
      - type: McpServer
        mcpServer: { apiGroup: kagent.dev, kind: MCPServer, name: everything, toolNames: ["get-sum"] }
  sandbox:
    network:
      allowedDomains: ["api.anthropic.com"]   # egress allow-list (empty/unset => deny all)
  substrate:
    workerPoolRef:
      name: kagent-default             # an existing ate.dev WorkerPool
