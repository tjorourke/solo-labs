# Govern which tools an agent may call. Enforced at the agentgateway waypoint
# (enable rbac.istioAuthzTranslation.enabled=true + the ambient/agentgateway waypoint;
# label MCP servers kagent.solo.io/waypoint=true). See agentic-mcp-rbac-kind for the
# full enforcing setup.
#   kubectl apply -f yaml/accesspolicy/access-policy.yaml
apiVersion: policy.kagent-enterprise.solo.io/v1alpha1
kind: AccessPolicy
metadata: { name: mathbot-tools, namespace: kagent }
spec:
  action: ALLOW                 # ALLOW-list: anything not matched is denied
  from:
    subjects:
      - kind: Agent             # UserGroup | ServiceAccount | Agent
        name: mathbot
        namespace: kagent
  targetRef:
    kind: MCPServer
    name: everything
    tools: ["get-sum"]          # mathbot may call only get-sum on this server
