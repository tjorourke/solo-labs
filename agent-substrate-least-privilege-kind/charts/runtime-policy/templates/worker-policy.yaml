{{- if .Values.hardened }}
apiVersion: admissionregistration.k8s.io/v1beta1
kind: MutatingAdmissionPolicy
metadata:
  name: {{ .Release.Name }}-worker
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
    objectSelector:
      matchLabels:
        ate.dev/worker-pool: {{ .Values.worker.name }}
  matchConditions:
    - name: exact-namespace
      expression: object.metadata.namespace == {{ .Release.Namespace | quote }}
    - name: expected-container
      expression: object.spec.containers.size() == 1 && object.spec.containers[0].name == "ateom"
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [
            JSONPatch{op: "add", path: "/spec/containers/0/securityContext",
              value: {
                {{- range $key, $value := .Values.worker.securityContext }}
                {{ $key | quote }}: dyn({{ $value | toJson }}),
                {{- end }}
              }},
            JSONPatch{op: "add", path: "/spec/automountServiceAccountToken", value: false}
          ]
---
apiVersion: admissionregistration.k8s.io/v1beta1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: {{ .Release.Name }}-worker
spec:
  policyName: {{ .Release.Name }}-worker
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
{{- end }}
