apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.worker.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: {{ not .Values.hardened }}
---
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: {{ .Values.worker.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    workload: privilege-lab
spec:
  replicas: {{ .Values.worker.replicas }}
  sandboxClass: gvisor
  workerImage: {{ required "Set worker.image to the matching v0.4.0 image digest" .Values.worker.image | quote }}
  template:
    serviceAccountName: {{ .Values.worker.serviceAccountName }}
    nodeSelector:
      {{- toYaml .Values.worker.nodeSelector | nindent 6 }}
    tolerations:
      {{- toYaml .Values.worker.tolerations | nindent 6 }}
    resources:
      {{- toYaml .Values.worker.resources | nindent 6 }}
