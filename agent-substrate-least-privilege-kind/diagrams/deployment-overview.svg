<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Agent traffic through agentgateway</title>
  <desc id="desc">An application sends requests through an ingress agentgateway to an agent in a gVisor sandbox. Outgoing calls pass through an egress agentgateway to tools and APIs.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="370" rx="18" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="44" y="51" font-size="14" font-weight="700" fill="#475569" letter-spacing="1.2">AGENT TRAFFIC</text>
    <rect x="476" y="72" width="228" height="29" rx="14" fill="#dcfce7"/>
    <text x="590" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Dedicated worker node</text>

    <rect x="24" y="118" width="160" height="132" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="104" y="166" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Application</text>
    <text x="104" y="198" text-anchor="middle" font-size="15" fill="#475569">Calls the agent</text>

    <rect x="240" y="118" width="168" height="132" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="324" y="166" text-anchor="middle" font-size="25" font-weight="700" fill="#155e75">AGW</text>
    <text x="324" y="198" text-anchor="middle" font-size="15" fill="#155e75">Routes requests</text>
    <text x="324" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">Ingress gateway</text>

    <rect x="464" y="118" width="252" height="132" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="590" y="157" text-anchor="middle" font-size="24" font-weight="700" fill="#14532d">Agent</text>
    <text x="590" y="187" text-anchor="middle" font-size="16" fill="#166534">Runs your code</text>
    <text x="590" y="216" text-anchor="middle" font-size="15" fill="#166534">Inside a gVisor sandbox</text>

    <rect x="772" y="118" width="176" height="132" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="860" y="166" text-anchor="middle" font-size="25" font-weight="700" fill="#155e75">AGW</text>
    <text x="860" y="198" text-anchor="middle" font-size="15" fill="#155e75">Checks access policy</text>
    <text x="860" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">Egress gateway</text>

    <rect x="1004" y="118" width="172" height="132" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="1090" y="166" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Services</text>
    <text x="1090" y="198" text-anchor="middle" font-size="15" fill="#475569">MCP tools and APIs</text>

    <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M184 184H232"/><path d="M408 184H456"/><path d="M716 184H764"/><path d="M948 184H996"/>
    </g>
    <text x="44" y="330" font-size="15" fill="#64748b">AGW = agentgateway</text>
    <text x="1156" y="330" text-anchor="end" font-size="15" fill="#64748b">Outgoing calls require an actor egress policy.</text>
  </g>
</svg>
