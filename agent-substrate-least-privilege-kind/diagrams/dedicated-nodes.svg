<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Dedicated runtime node and general node</title>
  <desc id="desc">Worker pods and the atelet daemon select the runtime-labelled node. Agentgateway, the Substrate control plane and storage run on the general node.</desc>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="12" y="12" width="568" height="216" rx="16" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="36" y="53" font-size="23" font-weight="700" fill="#0f172a">Dedicated runtime node</text>
    <text x="36" y="84" font-family="monospace" font-size="16" fill="#92400e">pool=runtime</text>
    <rect x="36" y="116" width="248" height="78" rx="10" fill="#fff" stroke="#fde68a"/>
    <text x="160" y="147" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Worker pods</text>
    <text x="160" y="174" text-anchor="middle" font-size="15" fill="#475569">Agent sandboxes</text>
    <rect x="308" y="116" width="248" height="78" rx="10" fill="#fff" stroke="#fde68a"/>
    <text x="432" y="147" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Node daemon</text>
    <text x="432" y="174" text-anchor="middle" font-size="15" fill="#475569">atelet</text>
    <rect x="620" y="12" width="568" height="216" rx="16" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="644" y="53" font-size="23" font-weight="700" fill="#0f172a">General node</text>
    <text x="644" y="84" font-family="monospace" font-size="16" fill="#075985">pool=general</text>
    <text x="644" y="141" font-size="18" font-weight="700" fill="#0f172a">agentgateway ingress and egress</text>
    <text x="644" y="174" font-size="16" fill="#475569">Substrate control plane, storage and other services</text>
    <text x="36" y="261" font-size="15" fill="#475569">WorkerPool and atelet must both select the runtime node.</text>
  </g>
</svg>
