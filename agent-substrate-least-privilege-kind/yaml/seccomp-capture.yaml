apiVersion: v1
kind: Pod
metadata:
  name: seccomp-capture
  namespace: substrate-lab
spec:
  nodeSelector:
    lab.mastertheagent.com/pool: runtime
  automountServiceAccountToken: false
  tolerations:
    - key: ate.dev/sandboxClass
      operator: Equal
      value: gvisor
      effect: NoSchedule
  containers:
    - name: capture
      image: busybox:1.36
      command: [sleep, "300"]
      securityContext:
        runAsUser: 0
        capabilities:
          drop: [ALL]
          add: [NET_ADMIN, SYS_ADMIN, SYS_CHROOT, SYS_PTRACE, SETUID, SETGID, SETPCAP, DAC_OVERRIDE, FOWNER, CHOWN, MKNOD, NET_RAW, SETFCAP]
        seccompProfile:
          type: RuntimeDefault
