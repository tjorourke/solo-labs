# A different Endpoint Picker.
#
# The load-balancing lab runs the upstream one from the Gateway API Inference Extension.
# That one cannot do prefill/decode disaggregation, and not because it is behind: there
# is no prefill/decode plugin in GIE v1.4.0 at all. Its scorers are queue,
# kv-cache-utilization, running-requests-size, lora-affinity, prefix-cache and
# predicted-latency, its pickers are max-score, random and weighted-random, and it ships
# a single-profile handler. Disaggregation needs a handler that runs more than one
# profile per request, and that lives in llm-d.
#
# NOTHING ON THE GATEWAY CHANGES. The InferencePool below is the same API object, the
# HTTPRoute still names it, and agentgateway still calls whatever endpointPickerRef
# points at over ExtProc and dials the endpoint it gets back. Swapping the brain out
# from under an InferencePool is a supported thing to do, and that is the part worth
# noticing: the picker is a plugin point, not a fixed component.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pd-epp
  namespace: models
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: pd-epp
  namespace: models
rules:
  # It reads pods to discover the pool's endpoints and to see their role labels, and it
  # scrapes each one's /metrics itself. There is no Prometheus in this path.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["inference.networking.k8s.io"]
    resources: ["inferencepools"]
    verbs: ["get", "watch", "list"]
  # inferencemodelrewrites belongs in BOTH groups. The EPP starts a watch on the
  # x-k8s.io one regardless of whether you use the feature, and without the permission
  # the controller-runtime cache fails to sync, the manager shuts itself down, and the
  # pod restarts in a loop logging "Pool is not initialized" — which points at the
  # InferencePool, not at RBAC, and sends you looking in the wrong place.
  - apiGroups: ["inference.networking.x-k8s.io"]
    resources: ["inferencepools", "inferenceobjectives", "inferencemodelrewrites"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["llm-d.ai"]
    resources: ["inferenceobjectives", "inferencemodelrewrites"]
    verbs: ["get", "watch", "list"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: pd-epp
  namespace: models
subjects:
  - kind: ServiceAccount
    name: pd-epp
    namespace: models
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pd-epp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pd-epp-config
  namespace: models
data:
  # The scheduling config. Read it top to bottom: it is the whole disaggregation policy.
  #
  # Two profiles, and the handler runs them in a fixed order. DECODE ALWAYS RUNS FIRST
  # and always produces an endpoint, because every request has to land somewhere and the
  # decode worker is where it lands. Prefill runs second and is OPTIONAL: the decider
  # looks at how much of this prompt is not already cached, and only if that is worth
  # more than the transfer does it pick a prefill worker and set x-prefiller-host-port.
  #
  # So disaggregation here is a per-request decision, not a deployment mode. A short
  # follow-up in a warm conversation runs monolithic on the decode worker. A cold 8,000
  # token document goes out to prefill. The same two pods serve both.
  epp-config.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    # Builds the prefix index from what has been sent, so prefix-cache-scorer has
    # something to score and the PD decider knows how much is already cached.
    - type: approx-prefix-cache-producer
      parameters:
        maxPrefixTokensToMatch: 16384
        lruCapacityPerServer: 31250
    - type: prefix-cache-scorer
    - type: queue-scorer
    # These two are the role filters. They select on the llm-d.ai/role pod label, which
    # is why that label on the two Deployments is not decoration.
    - type: prefill-filter
    - type: decode-filter
    - type: max-score-picker
    - type: disagg-profile-handler
      parameters:
        deciders:
          prefill: prefix-based-pd-decider
    - type: prefix-based-pd-decider
      parameters:
        # The threshold, in tokens of prompt that are NOT already in cache. Below it,
        # disaggregating costs more than it saves and the request runs monolithic.
        #
        # 16 is what llm-d ships as its sample and it is very low: it means almost
        # everything disaggregates, which is what you want while proving the mechanism
        # works and not what you want afterwards. Raise it and watch the split between
        # monolithic and disaggregated move. On a TCP KV path with no RDMA, expect the
        # honest crossover to be much higher than 16.
        nonCachedTokens: 16
    schedulingProfiles:
    - name: prefill
      plugins:
      - pluginRef: prefill-filter
      - pluginRef: max-score-picker
      - pluginRef: prefix-cache-scorer
        weight: 2
      - pluginRef: queue-scorer
        weight: 1
    - name: decode
      plugins:
      - pluginRef: decode-filter
      - pluginRef: max-score-picker
      - pluginRef: prefix-cache-scorer
        weight: 2
      - pluginRef: queue-scorer
        weight: 1
---
apiVersion: v1
kind: Service
metadata:
  name: pd-epp
  namespace: models
  labels: {app: pd-epp}
spec:
  selector: {app: pd-epp}
  ports:
    - name: grpc-ext-proc
      protocol: TCP
      port: 9002
      targetPort: 9002
      # http2, and it matters. ExtProc is gRPC; without appProtocol the gateway may
      # negotiate HTTP/1.1 to this Service and every scheduling call fails, which
      # FailOpen then turns into silent monolithic serving.
      appProtocol: http2
    - {name: metrics, protocol: TCP, port: 9090, targetPort: 9090}
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pd-epp
  namespace: models
  labels: {app: pd-epp}
spec:
  replicas: 1
  selector:
    matchLabels: {app: pd-epp}
  template:
    metadata:
      labels: {app: pd-epp}
    spec:
      serviceAccountName: pd-epp
      nodeSelector:
        role: platform
      terminationGracePeriodSeconds: 130
      containers:
        - name: epp
          image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.10.0
          args:
            - --pool-name
            - vllm-pd
            - --pool-namespace
            - models
            # v4 prints one line per scheduling decision, naming the profiles that ran
            # and the endpoint each chose. That is the evidence for this whole lab.
            - --v
            - "4"
            - --grpc-port
            - "9002"
            - --grpc-health-port
            - "9003"
            - --config-file
            - /etc/epp/epp-config.yaml
            # The disagg profile handler and its deciders are behind this flag in
            # v0.10.0. Without it the EPP starts, loads the config, reports no error,
            # and runs the default single profile: every request monolithic, and
            # nothing anywhere says why.
            - --allow-experimental-plugins=true
          ports:
            - {containerPort: 9002}
            - {containerPort: 9003}
            - {name: metrics, containerPort: 9090}
          livenessProbe:
            grpc: {port: 9003, service: envoy.service.ext_proc.v3.ExternalProcessor}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc: {port: 9003, service: envoy.service.ext_proc.v3.ExternalProcessor}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {memory: 4Gi}
          volumeMounts:
            - {name: epp-config, mountPath: /etc/epp}
            - {name: cache, mountPath: /cache}
      volumes:
        - name: epp-config
          configMap:
            name: pd-epp-config
        - name: cache
          emptyDir: {}
---
# The same InferencePool API the other lab uses, pointed at the llm-d picker instead of
# the upstream one. The selector covers BOTH roles: prefill and decode pods are members
# of one pool, and the role filters inside the picker separate them. Split them into two
# pools and the disagg handler has nothing to choose between.
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: vllm-pd
  namespace: models
spec:
  targetPorts:
    - number: 8000
  selector:
    matchLabels:
      app: vllm-pd
  endpointPickerRef:
    name: pd-epp
    port:
      number: 9002
    # FailOpen means a dead picker degrades to the gateway choosing an endpoint itself,
    # which here means requests land on whichever pod it picked and run monolithic. That
    # is the right availability trade and the wrong thing to be unaware of, so
    # scripts/02-test.sh checks the picker actually ran rather than trusting a 200.
    failureMode: FailOpen
