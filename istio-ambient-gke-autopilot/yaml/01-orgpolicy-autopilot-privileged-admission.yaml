# The managed org policy that decides which allowlist paths a cluster may install
# privileged-workload allowlists from.
#
# A cluster's --autopilot-privileged-admission value MUST be drawn from this
# constraint's parameters, so your gs:// paths have to appear here before the
# cluster will accept them.
#
# Keep allowAnyGKEPath: true. Setting it false makes cluster creation and updates
# fail across the whole organisation unless every cluster passes a conforming
# --autopilot-privileged-admission, Autopilot or not.
#
# Name every object individually, as below. A trailing-slash directory prefix
# looks like it works -- both the org policy and the cluster flag accept
# gs://BUCKET/istio/ without complaint -- but the check is exact string
# membership, so the AllowlistSynchronizer is then refused:
#
#   [denied by autopilot-allowlist-synchronizer-limitation]: Unauthorized
#   allowlist path(s) 'gs://BUCKET/istio/1.30.4/istio-cni.yaml', ...: not found
#   in authorized path list 'gke://*', 'gs://BUCKET/istio/1.30.4/'.
#
# So an Istio version bump does cost an org policy change plus another ~20 minute
# cluster update, and no bucket layout avoids it.
#
# Substitute ORG_ID, BUCKET and ISTIO_VER, then:
#   envsubst < 01-orgpolicy-autopilot-privileged-admission.yaml > policy.yaml
#   gcloud org-policies set-policy policy.yaml
name: organizations/${ORG_ID}/policies/container.managed.autopilotPrivilegedAdmission
spec:
  rules:
    - enforce: true
      parameters:
        allowAnyGKEPath: true
        allowPaths:
          - gs://${BUCKET}/istio/${ISTIO_VER}/istio-cni.yaml
          - gs://${BUCKET}/istio/${ISTIO_VER}/istio-ztunnel.yaml
