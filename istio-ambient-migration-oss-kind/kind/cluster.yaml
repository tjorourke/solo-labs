# kind cluster for the OSS sidecar-to-ambient migration lab.
# One control-plane + two workers: ztunnel is a per-node DaemonSet, so extra
# nodes make the ambient resource story visible (three ztunnels, but still only
# ONE waypoint pod for the whole cluster).
#
# No host port mappings: all traffic is in-cluster (fortio and checkout calling
# catalog/orders over the mesh), there is no ingress in this lab.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ambient-oss
nodes:
  - role: control-plane
  - role: worker
  - role: worker
