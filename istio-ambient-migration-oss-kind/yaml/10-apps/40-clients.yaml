# The calling estate, in petstore-clients. Two roles:
#   1. checkout — an HTTP client that calls catalog and orders. Its identity is
#      what the L7 policies see, and its calls are how we prove where a policy
#      is (and is not) enforced at each stage of the migration.
#   2. fortio — a continuous load generator against catalog. Its report is the
#      zero-downtime scoreboard across every migration cut and the rollback.
#
# This namespace migrates to ambient too — on community Istio a caller must be
# on the ambient dataplane for its traffic to route through the destination's
# waypoint, so the calling estate moves before the waypoint's policy applies to
# it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkout
  namespace: petstore-clients
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: petstore-clients
spec:
  replicas: 1
  selector:
    matchLabels: { app: checkout }
  template:
    metadata:
      labels: { app: checkout }
    spec:
      serviceAccountName: checkout
      containers:
        - name: checkout
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c", "sleep infinity"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fortio
  namespace: petstore-clients
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  namespace: petstore-clients
spec:
  replicas: 1
  selector:
    matchLabels: { app: fortio }
  template:
    metadata:
      labels: { app: fortio }
    spec:
      serviceAccountName: fortio
      containers:
        - name: fortio
          image: fortio/fortio:latest
          command: ["fortio", "server"]
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
